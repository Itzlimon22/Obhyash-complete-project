    <circle cx="64" cy="93" r="11.5" fill="#09090B"/>
    <path d="M65.5 84.5L58.5 93.5H63.5L62.5 101.5L69.5 92.5H64.5L65.5 84.5Z" fill="url(#zapGrad)"/>
