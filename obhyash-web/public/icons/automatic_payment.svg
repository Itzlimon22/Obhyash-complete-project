<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Card Frame -->
    <linearGradient id="cardBg" x1="16" y1="14" x2="112" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Subtle Brand Glows behind logos -->
    <radialGradient id="bkashGlow" cx="34" cy="46" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2136E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E2136E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nagadGlow" cx="94" cy="46" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7941D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F7941D" stop-opacity="0"/>
    </radialGradient>

    <!-- Instant Zap Badge -->
    <linearGradient id="zapGrad" x1="56" y1="80" x2="72" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="zapShadow" x="48" y="74" width="32" height="42" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Card Base Frame -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#cardBg)"/>
  <rect x="15" y="15" width="98" height="98" rx="23" stroke="#27272A" stroke-width="1.5"/>

  <!-- Brand Ambient Glows -->
  <circle cx="34" cy="46" r="28" fill="url(#bkashGlow)"/>
  <circle cx="94" cy="46" r="28" fill="url(#nagadGlow)"/>

  <!-- Divider Line -->
  <path d="M64 22V70" stroke="#27272A" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round"/>

  <!-- 1. OFFICIAL BKASH ORIGAMI BIRD -->
