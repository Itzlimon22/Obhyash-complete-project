<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#ffffff; border-radius:16px; font-family:system-ui, -apple-system, 'Hind Siliguri', sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="800" height="5" fill="#2563eb" rx="2"/>

  <!-- Header Section -->
  <rect x="330" y="24" width="140" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="400" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">STUDY PSYCHOLOGY</text>

  <text x="400" y="74" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">টপারদের নীরব অভ্যাস বনাম সাধারণ শিক্ষার্থীর ভুল</text>
  <text x="400" y="96" text-anchor="middle" font-size="13" fill="#64748b">কম পরিশ্রমে সর্বোচ্চ ফলাফলের অ্যাকশনেবল কম্প্যারিজন</text>

  <!-- Left Column: সাধারণ ভুল (Red/Gray Theme) -->
  <g transform="translate(40, 118)">
    <rect width="345" height="270" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Column Title -->
    <rect x="18" y="16" width="125" height="26" rx="6" fill="#fee2e2"/>
    <text x="80" y="33" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">✕ সাধারণ শিক্ষার্থীর ভুল</text>

    <!-- Row 1 -->
    <circle cx="34" cy="72" r="12" fill="#fca5a5" fill-opacity="0.4"/>
    <text x="34" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">১</text>
    <text x="56" y="72" font-size="13" font-weight="700" fill="#1e293b">প্যাসিভ রিডিং</text>
    <text x="56" y="88" font-size="11.5" fill="#64748b">বারবার শুধু চোখ বোলানো, না লিখে পড়া</text>

    <!-- Row 2 -->
    <circle cx="34" cy="122" r="12" fill="#fca5a5" fill-opacity="0.4"/>
    <text x="34" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">২</text>
    <text x="56" y="122" font-size="13" font-weight="700" fill="#1e293b">৮০% ইনপুট ট্র্যাপ</text>
    <text x="56" y="138" font-size="11.5" fill="#64748b">শুধু ভিডিও ও নোট দেখা, মক টেস্ট শূন্য</text>

    <!-- Row 3 -->
    <circle cx="34" cy="172" r="12" fill="#fca5a5" fill-opacity="0.4"/>
    <text x="34" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">৩</text>
    <text x="56" y="172" font-size="13" font-weight="700" fill="#1e293b">ভুল এড়িয়ে যাওয়া</text>
    <text x="56" y="188" font-size="11.5" fill="#64748b">ভুল হওয়া MCQ বিশ্লেষণ না করা</text>

    <!-- Row 4 -->
    <circle cx="34" cy="222" r="12" fill="#fca5a5" fill-opacity="0.4"/>
    <text x="34" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">৪</text>
    <text x="56" y="222" font-size="13" font-weight="700" fill="#1e293b">পড়ার টেবিলে ফোন</text>
    <text x="56" y="238" font-size="11.5" fill="#64748b">প্রতি ১০ মিনিটে নোটিফিকেশন চেক</text>
  </g>

  <!-- Right Column: টপারদের অভ্যাস (Emerald Theme) -->
  <g transform="translate(415, 118)">
    <rect width="345" height="270" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Column Title -->
    <rect x="18" y="16" width="125" height="26" rx="6" fill="#dcfce7"/>
    <text x="80" y="33" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">✓ টপারদের কৌশল</text>

    <!-- Row 1 -->
    <circle cx="34" cy="72" r="12" fill="#86efac" fill-opacity="0.5"/>
    <text x="34" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">১</text>
    <text x="56" y="72" font-size="13" font-weight="700" fill="#1e293b">অ্যাক্টিভ রিকল</text>
    <text x="56" y="88" font-size="11.5" fill="#15803d">বই বন্ধ করে স্মরণ করা ও ফ্ল্যাশ কার্ড</text>

    <!-- Row 2 -->
    <circle cx="34" cy="122" r="12" fill="#86efac" fill-opacity="0.5"/>
    <text x="34" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">২</text>
    <text x="56" y="122" font-size="13" font-weight="700" fill="#1e293b">৭০% সেলফ-টেস্টিং</text>
    <text x="56" y="138" font-size="11.5" fill="#15803d">ঘড়ি ধরে বিগত বোর্ড ও টেস্ট পেপার সলভ</text>

    <!-- Row 3 -->
    <circle cx="34" cy="172" r="12" fill="#86efac" fill-opacity="0.5"/>
    <text x="34" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">৩</text>
    <text x="56" y="172" font-size="13" font-weight="700" fill="#1e293b">মিস্টেক লেজার (ভুল খাতা)</text>
    <text x="56" y="188" font-size="11.5" fill="#15803d">ভুল প্রশ্ন আলাদা ডায়েরিতে লিখে রিভিশন</text>

    <!-- Row 4 -->
    <circle cx="34" cy="222" r="12" fill="#86efac" fill-opacity="0.5"/>
    <text x="34" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">৪</text>
    <text x="56" y="222" font-size="13" font-weight="700" fill="#1e293b">ডিপ ওয়ার্ক ও ফোন অফ</text>
    <text x="56" y="238" font-size="11.5" fill="#15803d">পড়ার সময় ফোন সম্পূর্ণ অন্য রুমে রাখা</text>
  </g>
</svg>
