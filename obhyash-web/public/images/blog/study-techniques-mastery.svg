<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="100%" height="100%" style="background:#ffffff; border-radius:16px; font-family:system-ui, -apple-system, 'Hind Siliguri', sans-serif;">
  <defs>
    <filter id="card-shadow-tips-light" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="800" height="5" fill="#6366f1" rx="2" />

  <!-- Badge & Title -->
  <rect x="325" y="24" width="150" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="400" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="1">STUDY FRAMEWORKS</text>

  <text x="400" y="74" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">স্মার্ট স্টাডির ৪টি প্রমাণিত বৈজ্ঞানিক ফ্রেমওয়ার্ক</text>
  <text x="400" y="96" text-anchor="middle" font-size="13" fill="#64748b">কম পরিশ্রমে দ্বিগুণ পড়া মনে রাখার কার্যকরী কৌশল</text>

  <!-- 4 Grid Cards (2x2) -->

  <!-- Card 1: Pomodoro -->
  <g transform="translate(40, 118)">
    <rect width="345" height="112" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1" filter="url(#card-shadow-tips-light)"/>
    <text x="18" y="32" font-size="14" font-weight="800" fill="#dc2626">🍅 ১. পোমোডোরো (Pomodoro)</text>
    <text x="18" y="50" font-size="11.5" fill="#991b1b">মনোযোগ ধরে রাখা ও প্রোক্রাস্টিনেশন দূরীকরণ</text>
    <line x1="18" y1="62" x2="325" y2="62" stroke="#fee2e2" stroke-width="1"/>
    
    <text x="18" y="82" font-size="12" fill="#334155"><tspan font-weight="700">• ২৫ মিনিট ফোকাস:</tspan> ফোন সাইলেন্ট করে শুধুই একটা টপিক</text>
    <text x="18" y="100" font-size="12" fill="#334155"><tspan font-weight="700">• ৫ মিনিট ব্রেক:</tspan> স্ক্রিন ছাড়া হেঁটে পানি খাওয়া ও স্ট্রেচিং</text>
  </g>

  <!-- Card 2: Spaced Repetition -->
  <g transform="translate(415, 118)">
    <rect width="345" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" filter="url(#card-shadow-tips-light)"/>
    <text x="18" y="32" font-size="14" font-weight="800" fill="#2563eb">📈 ২. স্পেসড রিপিটিশন (Spaced Review)</text>
    <text x="18" y="50" font-size="11.5" fill="#1e40af">ফরগেটিং কার্ভ পরাস্ত করে দীর্ঘস্থায়ী স্মৃতি</text>
    <line x1="18" y1="62" x2="325" y2="62" stroke="#dbeafe" stroke-width="1"/>

    <text x="18" y="82" font-size="12" fill="#334155"><tspan font-weight="700">• ২৪ ঘণ্টায় ১ম রিভিশন:</tspan> ভুলে যাওয়ার আগেই মাথায় রিলক</text>
    <text x="18" y="100" font-size="12" fill="#334155"><tspan font-weight="700">• ৩য় ও ৭ম দিন:</tspan> দুর্বল পয়েন্ট দ্রুত স্ক্যান ও ফ্ল্যাশ কার্ড</text>
  </g>

  <!-- Card 3: Feynman -->
  <g transform="translate(40, 244)">
    <rect width="345" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" filter="url(#card-shadow-tips-light)"/>
    <text x="18" y="32" font-size="14" font-weight="800" fill="#16a34a">💡 ৩. ফাইনম্যান মেথড (Feynman)</text>
    <text x="18" y="50" font-size="11.5" fill="#166534">সহজ ভাষায় অন্যকে শেখানোর মাধ্যমে আয়ত্ত</text>
    <line x1="18" y1="62" x2="325" y2="62" stroke="#dcfce7" stroke-width="1"/>

    <text x="18" y="82" font-size="12" fill="#334155"><tspan font-weight="700">• সরল ভাষায় ব্যাখ্যা:</tspan> ১০ বছরের বাচ্চাকে বোঝানোর মতো শেখা</text>
    <text x="18" y="100" font-size="12" fill="#334155"><tspan font-weight="700">• নলেজ গ্যাপ পূরণ:</tspan> যেখানে আটকে যাবে সেখানে বই আবার দেখা</text>
  </g>

  <!-- Card 4: Active Recall -->
  <g transform="translate(415, 244)">
    <rect width="345" height="112" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" filter="url(#card-shadow-tips-light)"/>
    <text x="18" y="32" font-size="14" font-weight="800" fill="#9333ea">🎯 ৪. অ্যাক্টিভ রিকল ও টেস্ট (Active Recall)</text>
    <text x="18" y="50" font-size="11.5" fill="#6b21a8">সেলফ-টেস্টিং ও পরীক্ষার ভয় দূরীকরণ</text>
    <line x1="18" y1="62" x2="325" y2="62" stroke="#f3e8ff" stroke-width="1"/>

    <text x="18" y="82" font-size="12" fill="#334155"><tspan font-weight="700">• বই বন্ধ প্র্যাকটিস:</tspan> পড়ার পর না দেখে স্মরণ করে লেখা</text>
    <text x="18" y="100" font-size="12" fill="#334155"><tspan font-weight="700">• মিস্টেক লেজার:</tspan> ভুল প্রশ্ন ডায়রিতে নোট করে রি-টেস্ট দেওয়া</text>
  </g>
</svg>
