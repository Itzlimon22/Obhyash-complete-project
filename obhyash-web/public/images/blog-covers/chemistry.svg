<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;display=swap');
      .bn-text { font-family: 'Hind Siliguri', sans-serif; }
    </style>

    <!-- Organic Chemistry Deep Forest Base -->
    <radialGradient id="chemCosmos" cx="70%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#083321"/>
      <stop offset="50%" stop-color="#041F14"/>
      <stop offset="100%" stop-color="#010D08"/>
    </radialGradient>

    <!-- Emerald Luminous Glow -->
    <linearGradient id="emeraldAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>

    <filter id="chemBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="chemMegaBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#chemCosmos)"/>

  <!-- Glowing Ambient Aura -->
  <circle cx="780" cy="310" r="220" fill="#059669" opacity="0.32" filter="url(#chemMegaBloom)"/>
  <circle cx="950" cy="450" r="160" fill="#0D9488" opacity="0.25" filter="url(#chemMegaBloom)"/>

  <!-- Molecular Crystal Lattice & Benzene Rings (Isometric Floating Array) -->
  <g transform="translate(800, 310)">
    <!-- Giant Central Benzene Ring -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="#34D399" stroke-width="3" filter="url(#chemBloom)"/>
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.7"/>

    <!-- Luminous Atoms / Molecular Vertices -->
    <circle cx="0" cy="-160" r="14" fill="#6EE7B7" filter="url(#chemBloom)"/>
    <circle cx="0" cy="-160" r="5" fill="#FFFFFF"/>

    <circle cx="138" cy="-80" r="14" fill="#34D399" filter="url(#chemBloom)"/>
    <circle cx="138" cy="-80" r="5" fill="#FFFFFF"/>

    <circle cx="138" cy="80" r="14" fill="#2DD4BF" filter="url(#chemBloom)"/>
    <circle cx="138" cy="80" r="5" fill="#FFFFFF"/>

    <circle cx="0" cy="160" r="14" fill="#6EE7B7" filter="url(#chemBloom)"/>
    <circle cx="0" cy="160" r="5" fill="#FFFFFF"/>

    <circle cx="-138" cy="80" r="14" fill="#34D399" filter="url(#chemBloom)"/>
    <circle cx="-138" cy="80" r="5" fill="#FFFFFF"/>

    <circle cx="-138" cy="-80" r="14" fill="#2DD4BF" filter="url(#chemBloom)"/>
    <circle cx="-138" cy="-80" r="5" fill="#FFFFFF"/>

    <!-- Extended Covalent Bonds (Chains branching off) -->
    <line x1="138" y1="-80" x2="250" y2="-140" stroke="#34D399" stroke-width="2.5" stroke-dasharray="8 6"/>
    <circle cx="250" cy="-140" r="10" fill="#FCD34D" filter="url(#chemBloom)"/>
    <circle cx="250" cy="-140" r="3.5" fill="#FFFFFF"/>

    <line x1="-138" y1="-80" x2="-230" y2="-130" stroke="#34D399" stroke-width="2.5" opacity="0.8"/>
    <circle cx="-230" cy="-130" r="9" fill="#38BDF8" filter="url(#chemBloom)"/>

    <line x1="138" y1="80" x2="240" y2="140" stroke="#2DD4BF" stroke-width="2.5" opacity="0.8"/>
    <circle cx="240" cy="140" r="9" fill="#A7F3D0" filter="url(#chemBloom)"/>

    <!-- Orbital Electron Rings in Center -->
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#FDE047" stroke-width="1.8" transform="rotate(45)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#38BDF8" stroke-width="1.8" transform="rotate(-45)" opacity="0.8"/>
    <circle cx="0" cy="0" r="16" fill="#FDE047" filter="url(#chemBloom)"/>
  </g>

  <!-- Flowing Chemical Reaction Wave Curves -->
  <path d="M 0 620 C 350 560, 550 640, 850 580 S 1200 600, 1200 600" fill="none" stroke="#10B981" stroke-width="2" opacity="0.3" filter="url(#chemBloom)"/>

  <!-- Minimal Elegant Typography - NO BOXES, PURE HIND SHILIGURI -->
  <g transform="translate(110, 290)">
    <text x="0" y="0" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="600" fill="#34D399" letter-spacing="4" opacity="0.9">
      রসায়ন বিজ্ঞান • CHEMISTRY
    </text>

    <text x="0" y="95" font-family="'Hind Siliguri', sans-serif" font-size="78" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
      রসায়ন
    </text>

    <text x="0" y="145" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="400" fill="#A7F3D0" opacity="0.75" letter-spacing="1">
      জৈব যৌগ, রাসায়নিক পরিবর্তন ও গণনা
    </text>
  </g>
</svg>
