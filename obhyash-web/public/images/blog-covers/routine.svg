<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;display=swap');
      .bn-text { font-family: 'Hind Siliguri', sans-serif; }
    </style>

    <!-- Deep Oceanic Teal Night -->
    <radialGradient id="routCosmos" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#043236"/>
      <stop offset="50%" stop-color="#021C1F"/>
      <stop offset="100%" stop-color="#010A0C"/>
    </radialGradient>

    <!-- Electric Teal Gradient -->
    <linearGradient id="tealLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <filter id="routBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="routUltraBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#routCosmos)"/>

  <!-- Glowing Core Light -->
  <circle cx="800" cy="335" r="230" fill="#0F766E" opacity="0.3" filter="url(#routUltraBloom)"/>
  <circle cx="800" cy="335" r="140" fill="#2DD4BF" opacity="0.25" filter="url(#routBloom)"/>

  <!-- Cosmic Chronometer & Luminous Orbit Rings of Time -->
  <g transform="translate(800, 335)">
    <!-- Outer Concentric Time Dial -->
    <circle cx="0" cy="0" r="210" fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-dasharray="3 9" opacity="0.5"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#5EEAD4" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="14 10" filter="url(#routBloom)"/>

    <!-- Chronometer Dial Hour Marks (12 Ticks around perimeter) -->
    <line x1="0" y1="-170" x2="0" y2="-155" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="0" y1="170" x2="0" y2="155" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="-170" y1="0" x2="-155" y2="0" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="170" y1="0" x2="155" y2="0" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Inclined Time Ring (Planetary Gyroscope) -->
    <ellipse cx="0" cy="0" rx="220" ry="75" fill="none" stroke="#38BDF8" stroke-width="2" transform="rotate(-30)" opacity="0.7" filter="url(#routBloom)"/>
    <circle cx="190" cy="-90" r="6" fill="#FCD34D" filter="url(#routBloom)"/>

    <!-- Central Precision Watch Hands (Pointing to 10:10 Mastery) -->
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" filter="url(#routBloom)"/>
    <circle cx="0" cy="0" r="4" fill="#0F766E"/>
    <line x1="0" y1="0" x2="-55" y2="-75" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="80" y2="-45" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" filter="url(#routBloom)"/>
  </g>

  <!-- Minimal Elegant Typography - NO BOXES, PURE HIND SHILIGURI -->
  <g transform="translate(110, 290)">
    <text x="0" y="0" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="600" fill="#2DD4BF" letter-spacing="4" opacity="0.9">
      সিলেবাস ও রিভিশন রুটিন • ROUTINE
    </text>

    <text x="0" y="95" font-family="'Hind Siliguri', sans-serif" font-size="78" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
      স্টাডি রুটিন
    </text>

    <text x="0" y="145" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="400" fill="#CCFBF1" opacity="0.75" letter-spacing="1">
      সিলেবাস কভার, মানবণ্টন ও ডেইলি প্ল্যানিং
    </text>
  </g>
</svg>
