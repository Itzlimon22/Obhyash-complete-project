<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;display=swap');
      .bn-text { font-family: 'Hind Siliguri', sans-serif; }
    </style>

    <!-- Deep Emerald & Gold Horizon -->
    <radialGradient id="admDawn" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0A3322"/>
      <stop offset="50%" stop-color="#051C13"/>
      <stop offset="100%" stop-color="#010A07"/>
    </radialGradient>

    <!-- Golden Merit Light -->
    <linearGradient id="meritGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <filter id="admBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="admDeepGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#admDawn)"/>

  <!-- Golden Dawn Horizon Glow -->
  <circle cx="800" cy="335" r="230" fill="#059669" opacity="0.3" filter="url(#admDeepGlow)"/>
  <circle cx="800" cy="335" r="140" fill="#EAB308" opacity="0.22" filter="url(#admBloom)"/>

  <!-- Grand University Colonnade Arch & Laurel of Ascension -->
  <g transform="translate(800, 335)">
    <!-- Monumental Archway Silhouette -->
    <path d="M -160 140 L -160 -40 A 160 160 0 0 1 160 -40 L 160 140" fill="none" stroke="#34D399" stroke-width="2.5" opacity="0.6"/>
    <path d="M -130 140 L -130 -30 A 130 130 0 0 1 130 -30 L 130 140" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
    <line x1="-190" y1="140" x2="190" y2="140" stroke="#34D399" stroke-width="3"/>

    <!-- Radiant Dawn Beams through Arch -->
    <line x1="0" y1="-40" x2="-140" y2="-170" stroke="#FDE047" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-40" x2="0" y2="-190" stroke="#FDE047" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-40" x2="140" y2="-170" stroke="#FDE047" stroke-width="1.5" opacity="0.5"/>

    <!-- Floating Academic Mortarboard of Excellence -->
    <g transform="translate(0, -35) scale(1.3)">
      <polygon points="0,-45 85,0 0,45 -85,0" fill="#064E3B" stroke="url(#meritGold)" stroke-width="2.5" filter="url(#admBloom)"/>
      <path d="M -42 16 Q 0 46, 42 16 L 42 32 Q 0 62, -42 32 Z" fill="#047857" stroke="#FDE047" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4.5" fill="#FDE047"/>
      <path d="M 0 0 C 35 12, 55 22, 70 52" fill="none" stroke="#FDE047" stroke-width="2"/>
      <circle cx="70" cy="52" r="3" fill="#FDE047"/>
    </g>

    <!-- Star of Distinction -->
    <polygon points="0,-160 5,-145 20,-145 8,-135 12,-120 0,-130 -12,-120 -8,-135 -20,-145 -5,-145" fill="#FDE047" filter="url(#admBloom)"/>
  </g>

  <!-- Minimal Elegant Typography - NO BOXES, PURE HIND SHILIGURI -->
  <g transform="translate(110, 290)">
    <text x="0" y="0" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="600" fill="#34D399" letter-spacing="4" opacity="0.9">
      বিশ্ববিদ্যালয় ভর্তি • ADMISSION
    </text>

    <text x="0" y="95" font-family="'Hind Siliguri', sans-serif" font-size="78" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
      ভার্সিটি ভর্তি
    </text>

    <text x="0" y="145" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="400" fill="#A7F3D0" opacity="0.75" letter-spacing="1">
      ঢাবি ক-ইউনিট, গুচ্ছ ও পাবলিক বিশ্ববিদ্যালয় গাইড
    </text>
  </g>
</svg>
