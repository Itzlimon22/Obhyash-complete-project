<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;display=swap');
      .bn-text { font-family: 'Hind Siliguri', sans-serif; }
    </style>

    <!-- Royal Navy Scholarly Background -->
    <radialGradient id="engNavy" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0A224A"/>
      <stop offset="50%" stop-color="#041229"/>
      <stop offset="100%" stop-color="#020814"/>
    </radialGradient>

    <linearGradient id="sapphireGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <filter id="engBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="engDeepGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#engNavy)"/>

  <!-- Celestial Ambient Light -->
  <circle cx="800" cy="335" r="230" fill="#2563EB" opacity="0.28" filter="url(#engDeepGlow)"/>
  <circle cx="800" cy="335" r="140" fill="#38BDF8" opacity="0.25" filter="url(#engBloom)"/>

  <!-- Celestial Astrolabe Rings & Scholarly Glyphs -->
  <g transform="translate(800, 335)">
    <!-- Concentric Celestial Coordinate Rings -->
    <circle cx="0" cy="0" r="210" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.5"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.7"/>

    <!-- Compass Cardinal Ticks -->
    <line x1="0" y1="-220" x2="0" y2="-200" stroke="#93C5FD" stroke-width="2.5"/>
    <line x1="0" y1="200" x2="0" y2="220" stroke="#93C5FD" stroke-width="2.5"/>
    <line x1="-220" y1="0" x2="-200" y2="0" stroke="#93C5FD" stroke-width="2.5"/>
    <line x1="200" y1="0" x2="220" y2="0" stroke="#93C5FD" stroke-width="2.5"/>

    <!-- Monumental Sculpted Latin Letter 'A' (Scholarly Typography) -->
    <text x="0" y="70" font-family="'Times New Roman', Georgia, serif" font-size="220" font-weight="700" fill="url(#sapphireGold)" text-anchor="middle" filter="url(#engBloom)">
      A
    </text>

    <!-- Floating Diacritic Accent Star -->
    <polygon points="0,-130 5,-115 20,-115 8,-105 12,-90 0,-100 -12,-90 -8,-105 -20,-115 -5,-115" fill="#FCD34D" filter="url(#engBloom)"/>
  </g>

  <!-- Minimal Elegant Typography - NO BOXES, PURE HIND SHILIGURI -->
  <g transform="translate(110, 290)">
    <text x="0" y="0" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="600" fill="#60A5FA" letter-spacing="4" opacity="0.9">
      ইংরেজি ১ম ও ২য় পত্র • ENGLISH
    </text>

    <text x="0" y="95" font-family="'Hind Siliguri', sans-serif" font-size="78" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
      ইংরেজি
    </text>

    <text x="0" y="145" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="400" fill="#BFDBFE" opacity="0.75" letter-spacing="1">
      গ্রামার রুলস, মডিফায়ার ও রাইটিং স্কিলস
    </text>
  </g>
</svg>
