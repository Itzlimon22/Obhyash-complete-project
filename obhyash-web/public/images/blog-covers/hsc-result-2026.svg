<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@700;800&amp;family=Hind+Siliguri:wght@600;700&amp;display=swap');
      .title {
        font-family: 'Anek Bangla', 'Hind Siliguri', 'Kohinoor Bangla', sans-serif;
        font-weight: 800;
        text-rendering: geometricPrecision;
      }
      .badge-text {
        font-family: 'Anek Bangla', 'Hind Siliguri', 'Kohinoor Bangla', sans-serif;
        font-weight: 700;
        text-rendering: geometricPrecision;
      }
      .meta {
        font-family: 'Hind Siliguri', 'Kohinoor Bangla', sans-serif;
        font-weight: 600;
        text-rendering: geometricPrecision;
      }
    </style>
  </defs>

  <!-- 1. Pure Crisp Clean White Canvas -->
  <rect width="1200" height="630" fill="#FFFFFF" />

  <!-- 2. Minimalist Subtle Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" />

  <!-- 3. TOP ROW: Left Category Badge & Right Exam Badge -->
  <!-- Top Left: Red Category Pill -->
  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="165" height="42" rx="21" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1.5" />
    <circle cx="22" cy="21" r="5" fill="#DC2626" />
    <text x="36" y="27" class="badge-text" font-size="16" fill="#B91C1C">
      রেজাল্ট আপডেট
    </text>
  </g>

  <!-- Top Right: Exam & Session Pill -->
  <g transform="translate(1130, 70)">
    <g transform="translate(-175, 0)">
      <rect x="0" y="0" width="175" height="42" rx="21" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="87.5" y="27" class="badge-text" font-size="16" fill="#475569" text-anchor="middle">
        এইচএসসি পরীক্ষা ২০২৬
      </text>
    </g>
  </g>

  <!-- 4. CENTER HERO: Main Headline (Centered) -->
  <g transform="translate(600, 265)">
    <!-- Line 1: Black / Dark Slate (Centered) -->
    <text x="0" y="0" class="title" font-size="64" fill="#0F172A" text-anchor="middle">
      এইচএসসি রেজাল্ট ২০২৬
    </text>

    <!-- Line 2: Vibrant Crimson Red (Centered) -->
    <text x="0" y="85" class="title" font-size="50" fill="#DC2626" text-anchor="middle">
      কবে দিবে? প্রকাশের সম্ভাব্য তারিখ
    </text>
  </g>

  <!-- 5. BOTTOM INFO ROW: Centered Key Pills -->
  <g transform="translate(600, 470)">
    <!-- Pill 1: Date (Left of center) -->
    <g transform="translate(-315, 0)">
      <rect x="0" y="0" width="300" height="58" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="24" y="37" class="meta" font-size="20" fill="#DC2626">📅</text>
      <text x="60" y="37" class="badge-text" font-size="19" fill="#1E293B">সম্ভাব্য সময়: ৭-১৫ নভেম্বর</text>
    </g>

    <!-- Pill 2: Method (Right of center) -->
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="300" height="58" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="24" y="36" class="meta" font-size="20" fill="#059669">📱</text>
      <text x="60" y="37" class="badge-text" font-size="19" fill="#1E293B">অনলাইন ও SMS পদ্ধতি</text>
    </g>
  </g>
</svg>
