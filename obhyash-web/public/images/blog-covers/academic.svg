<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;display=swap');
      .bn-text { font-family: 'Hind Siliguri', sans-serif; }
    </style>

    <!-- Deep Emerald Spectrum Background -->
    <radialGradient id="acadCosmos" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#083321"/>
      <stop offset="50%" stop-color="#031F14"/>
      <stop offset="100%" stop-color="#010C07"/>
    </radialGradient>

    <!-- Spectrum Glow Filter -->
    <filter id="acadBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="acadDeepGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#acadCosmos)"/>

  <!-- Ambient Light Aura -->
  <circle cx="800" cy="335" r="230" fill="#059669" opacity="0.28" filter="url(#acadDeepGlow)"/>
  <circle cx="800" cy="335" r="130" fill="#10B981" opacity="0.25" filter="url(#acadBloom)"/>

  <!-- Optical Crystal Prism of Knowledge & Spectral Dispersion -->
  <g transform="translate(800, 335)">
    <!-- Concentric Light Ring -->
    <circle cx="0" cy="0" r="210" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>

    <!-- Incident Pure White Beam of Light from Left -->
    <line x1="-320" y1="40" x2="-45" y2="0" stroke="#FFFFFF" stroke-width="3.5" filter="url(#acadBloom)"/>

    <!-- Optical Equilateral Triangular Prism -->
    <polygon points="0,-120 104,60 -104,60" fill="#064E3B" fill-opacity="0.4" stroke="#6EE7B7" stroke-width="3" filter="url(#acadBloom)"/>
    <polygon points="0,-90 78,45 -78,45" fill="none" stroke="#A7F3D0" stroke-width="1.2" opacity="0.6"/>

    <!-- Refracted Dispersed Spectrum Beams Emerging from Right Face -->
    <!-- Red Ray -->
    <line x1="52" y1="-30" x2="320" y2="-120" stroke="#FB7185" stroke-width="3" opacity="0.85" filter="url(#acadBloom)"/>
    <!-- Amber / Yellow Ray -->
    <line x1="65" y1="-10" x2="330" y2="-70" stroke="#FDE047" stroke-width="3" opacity="0.85" filter="url(#acadBloom)"/>
    <!-- Emerald Ray -->
    <line x1="78" y1="10" x2="340" y2="-20" stroke="#34D399" stroke-width="3" opacity="0.85" filter="url(#acadBloom)"/>
    <!-- Cyan Ray -->
    <line x1="91" y1="30" x2="330" y2="30" stroke="#38BDF8" stroke-width="3" opacity="0.85" filter="url(#acadBloom)"/>
    <!-- Violet Ray -->
    <line x1="104" y1="50" x2="320" y2="80" stroke="#C084FC" stroke-width="3" opacity="0.85" filter="url(#acadBloom)"/>

    <!-- Prism Central Vertex Flare -->
    <circle cx="0" cy="-120" r="6" fill="#FFFFFF" filter="url(#acadBloom)"/>
    <circle cx="104" cy="60" r="5" fill="#FFFFFF"/>
    <circle cx="-104" cy="60" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Minimal Elegant Typography - NO BOXES, PURE HIND SHILIGURI -->
  <g transform="translate(110, 290)">
    <text x="0" y="0" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="600" fill="#34D399" letter-spacing="4" opacity="0.9">
      একাডেমিক মাস্টার গাইড • ACADEMIC
    </text>

    <text x="0" y="95" font-family="'Hind Siliguri', sans-serif" font-size="78" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
      স্টাডি গাইড
    </text>

    <text x="0" y="145" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="400" fill="#A7F3D0" opacity="0.75" letter-spacing="1">
      বোর্ড পরীক্ষা প্রস্তুতি, পড়ার কৌশল ও স্মার্ট নোট
    </text>
  </g>
</svg>
