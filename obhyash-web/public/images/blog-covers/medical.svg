<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;display=swap');
      .bn-text { font-family: 'Hind Siliguri', sans-serif; }
    </style>

    <!-- Deep Surgical Crimson Night -->
    <radialGradient id="medCosmos" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#360613"/>
      <stop offset="50%" stop-color="#1F030B"/>
      <stop offset="100%" stop-color="#0A0104"/>
    </radialGradient>

    <!-- Vital Pulse Gradient -->
    <linearGradient id="vitalPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <filter id="medBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="medUltraBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#medCosmos)"/>

  <!-- Glowing Heartbeat Aura -->
  <circle cx="800" cy="335" r="230" fill="#E11D48" opacity="0.28" filter="url(#medUltraBloom)"/>
  <circle cx="800" cy="335" r="130" fill="#FB7185" opacity="0.25" filter="url(#medBloom)"/>

  <!-- Luminous Medical Cross & Vital Rhythm -->
  <g transform="translate(800, 335)">
    <!-- Elegant Concentric Vital Rings -->
    <circle cx="0" cy="0" r="210" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#FB7185" stroke-width="1.2" opacity="0.5"/>

    <!-- Subtle Architectural Medical Cross Halo -->
    <path d="M -30 -140 L 30 -140 L 30 -30 L 140 -30 L 140 30 L 30 30 L 30 140 L -30 140 L -30 30 L -140 30 L -140 -30 L -30 -30 Z" 
          fill="#4C0519" fill-opacity="0.3" stroke="#F43F5E" stroke-width="1.8" opacity="0.6"/>

    <!-- Cinematic Continuous ECG Cardiac Waveform across the Core -->
    <path d="M -260 0 L -130 0 L -105 -35 L -80 50 L -55 -110 L -30 90 L -10 -20 L 0 0 L 110 0 L 135 -30 L 160 45 L 185 -90 L 210 70 L 230 0 L 260 0" 
          fill="none" stroke="url(#vitalPulse)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#medBloom)"/>

    <!-- Central Luminous Life Pulse Node -->
    <circle cx="-55" cy="-110" r="7" fill="#FFFFFF" filter="url(#medBloom)"/>
    <circle cx="185" cy="-90" r="6" fill="#FFFFFF" filter="url(#medBloom)"/>
  </g>

  <!-- Minimal Elegant Typography - NO BOXES, PURE HIND SHILIGURI -->
  <g transform="translate(110, 290)">
    <text x="0" y="0" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="600" fill="#FB7185" letter-spacing="4" opacity="0.9">
      মেডিকেল ভর্তি প্রস্তুতি • MEDICAL
    </text>

    <text x="0" y="95" font-family="'Hind Siliguri', sans-serif" font-size="78" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
      মেডিকেল ভর্তি
    </text>

    <text x="0" y="145" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="400" fill="#FECDD3" opacity="0.75" letter-spacing="1">
      এমবিবিএস ও বিডিএস প্রশ্নব্যাংক এবং স্ট্র্যাটেজি
    </text>
  </g>
</svg>
