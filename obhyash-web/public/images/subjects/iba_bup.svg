<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="iba_trophy" x1="60" y1="50" x2="140" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047" />
      <stop offset="0.6" stop-color="#EAB308" />
      <stop offset="1" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="iba_shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#iba_shadow)">
    <!-- Analytics Growth Bars (Background) -->
    <rect x="42" y="125" width="16" height="35" rx="3" fill="#FECDD3" opacity="0.8" />
    <rect x="64" y="105" width="16" height="55" rx="3" fill="#FDA4AF" opacity="0.8" />
    <rect x="120" y="90" width="16" height="70" rx="3" fill="#FB7185" opacity="0.8" />
    <rect x="142" y="70" width="16" height="90" rx="3" fill="#F43F5E" opacity="0.8" />
    <!-- Upward Trend Line -->
    <path d="M42,125 L72,105 L128,90 L150,65" fill="none" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Trend Arrow -->
    <polygon points="150,60 156,70 144,68" fill="#E11D48" />

    <!-- Golden Trophy Cup (Hero Center) -->
    <!-- Handles -->
    <path d="M72,65 C48,65 48,105 72,105" fill="none" stroke="#CA8A04" stroke-width="6" stroke-linecap="round" />
    <path d="M72,65 C52,65 52,105 72,105" fill="none" stroke="#FDE047" stroke-width="3" stroke-linecap="round" />

    <path d="M128,65 C152,65 152,105 128,105" fill="none" stroke="#CA8A04" stroke-width="6" stroke-linecap="round" />
    <path d="M128,65 C148,65 148,105 128,105" fill="none" stroke="#FDE047" stroke-width="3" stroke-linecap="round" />

    <!-- Cup Body -->
    <path d="M70,55 L130,55 Q130,110 100,122 Q70,110 70,55 Z" fill="url(#iba_trophy)" stroke="#A16207" stroke-width="2" />
    <!-- Inner Rim -->
    <ellipse cx="100" cy="55" rx="30" ry="7" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />

    <!-- Trophy Stem -->
    <rect x="94" y="122" width="12" height="24" rx="2" fill="#EAB308" stroke="#CA8A04" stroke-width="1.5" />

    <!-- Trophy Base -->
    <polygon points="82,146 118,146 124,168 76,168" fill="#334155" stroke="#1E293B" stroke-width="1.5" />
    <rect x="72" y="168" width="56" height="8" rx="2" fill="#1E293B" />
    <!-- Gold Plaque on base -->
    <rect x="85" y="152" width="30" height="10" rx="1.5" fill="#FDE047" stroke="#CA8A04" stroke-width="1" />
    <text x="100" y="159.5" font-size="6" fill="#854D0E" font-family="sans-serif" font-weight="bold" text-anchor="middle">IBA</text>

    <!-- Star Emblem on Cup -->
    <polygon points="100,75 104,83 113,84 106,90 108,99 100,94 92,99 94,90 87,84 96,83" fill="#FFFFFF" opacity="0.9" />

    <!-- Sparkles -->
    <circle cx="65" cy="50" r="2.5" fill="#FDE047" />
    <circle cx="140" cy="45" r="3" fill="#FDE047" />
  </g>
</svg>
