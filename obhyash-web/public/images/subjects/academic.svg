<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="book1" x1="40" y1="130" x2="150" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="book2" x1="45" y1="110" x2="140" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334155" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="book3" x1="50" y1="90" x2="135" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64748B" />
      <stop offset="1" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="cup" x1="140" y1="80" x2="168" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" />
      <stop offset="1" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="calc" x1="130" y1="140" x2="185" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Paper Sheet at Bottom -->
    <polygon points="40,155 125,185 160,165 75,135" fill="#F8FAFC" />
    <line x1="60" y1="150" x2="100" y2="164" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
    <line x1="65" y1="158" x2="115" y2="175" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

    <!-- Pen in Cup -->
    <rect x="146" y="52" width="6" height="40" rx="2" fill="#FBBF24" transform="rotate(-10 146 52)" />
    <polygon points="144,52 147,44 150,52" fill="#334155" transform="rotate(-10 146 52)" />
    <!-- Ruler in Cup -->
    <rect x="156" y="45" width="8" height="50" rx="1" fill="#FDE047" opacity="0.9" transform="rotate(12 156 45)" />
    <!-- Blue Pen -->
    <rect x="138" y="58" width="5" height="36" rx="2" fill="#3B82F6" transform="rotate(-18 138 58)" />

    <!-- Stationery Cup / Holder -->
    <path d="M136 85 L168 85 L164 124 Q163 128 158 128 L144 128 Q139 128 138 124 Z" fill="url(#cup)" />
    <ellipse cx="152" cy="85" rx="16" ry="4" fill="#22D3EE" />

    <!-- Bottom Book (Orange/Amber) -->
    <!-- Pages block -->
    <polygon points="45,156 128,156 142,142 58,142" fill="#F1F5F9" />
    <polygon points="128,156 145,142 145,148 128,162" fill="#E2E8F0" />
    <!-- Cover -->
    <path d="M38 152 Q38 162 48 162 L132 162 L146 148 L142 144 L48 144 Q38 144 38 152 Z" fill="url(#book1)" />
    <path d="M38 152 Q38 162 48 162 L52 162 Q42 162 42 152 Q42 144 52 144 L48 144 Q38 144 38 152 Z" fill="#B45309" />

    <!-- Middle Book (Dark Slate) -->
    <polygon points="50,136 124,136 136,124 62,124" fill="#F1F5F9" />
    <polygon points="124,136 138,124 138,129 124,141" fill="#CBD5E1" />
    <path d="M44 132 Q44 141 53 141 L126 141 L138 129 L135 126 L53 126 Q44 126 44 132 Z" fill="url(#book2)" />
    <path d="M44 132 Q44 141 53 141 L56 141 Q47 141 47 132 Q47 126 56 126 L53 126 Q44 126 44 132 Z" fill="#0F172A" />

    <!-- Top Book (Steel Slate) -->
    <polygon points="56,118 122,118 132,108 66,108" fill="#FFFFFF" />
    <polygon points="122,118 134,108 134,112 122,122" fill="#E2E8F0" />
    <path d="M50 114 Q50 122 58 122 L124 122 L134 112 L131 109 L58 109 Q50 109 50 114 Z" fill="url(#book3)" />
    <path d="M50 114 Q50 122 58 122 L61 122 Q53 122 53 114 Q53 109 61 109 L58 109 Q50 109 50 114 Z" fill="#334155" />

    <!-- Calculator -->
    <g transform="rotate(-6 155 155)">
      <rect x="130" y="136" width="46" height="36" rx="5" fill="url(#calc)" stroke="#475569" stroke-width="1.5" />
      <!-- Screen -->
      <rect x="135" y="141" width="36" height="9" rx="2" fill="#94A3B8" />
      <text x="166" y="148" font-size="6" fill="#0F172A" font-family="monospace" text-anchor="end" font-weight="bold">128.5</text>
      <!-- Buttons -->
      <circle cx="138" cy="155" r="2" fill="#EF4444" />
      <circle cx="145" cy="155" r="2" fill="#64748B" />
      <circle cx="152" cy="155" r="2" fill="#64748B" />
      <circle cx="159" cy="155" r="2" fill="#3B82F6" />
      <circle cx="166" cy="155" r="2" fill="#3B82F6" />

      <circle cx="138" cy="162" r="2" fill="#94A3B8" />
      <circle cx="145" cy="162" r="2" fill="#94A3B8" />
      <circle cx="152" cy="162" r="2" fill="#94A3B8" />
      <circle cx="159" cy="162" r="2" fill="#10B981" />
      <circle cx="166" cy="162" r="2" fill="#10B981" />
    </g>

    <!-- Mini Pencil on Paper -->
    <rect x="88" y="160" width="30" height="4" rx="1" fill="#F59E0B" transform="rotate(16 88 160)" />
    <polygon points="117,169 123,171 118,173" fill="#1E293B" />
  </g>
</svg>
