<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="trophyBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadowTrophy" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#78350F" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#trophyBg)" stroke="url(#trophyBorder)" stroke-width="3.5" filter="url(#shadowTrophy)" />
  
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- Trophy Illustration -->
  <g transform="translate(50, 48)">
    <!-- Trophy Handles -->
    <path d="M -16 -12 C -28 -12 -28 4 -16 6" stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 16 -12 C 28 -12 28 4 16 6" stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Cup Body -->
    <path d="M -18 -18 L 18 -18 L 14 6 C 10 14 0 16 0 16 C 0 16 -10 14 -14 6 Z" fill="url(#goldGrad)" />
    <!-- Cup Lip -->
    <ellipse cx="0" cy="-18" rx="18" ry="3.5" fill="#FEF08A" />
    <!-- Star on Cup -->
    <polygon points="0,-10 2,-4 8,-4 3,0 5,6 0,2 -5,6 -3,0 -8,-4 -2,-4" fill="#FFFFFF" />

    <!-- Stem -->
    <rect x="-3.5" y="16" width="7" height="8" rx="1" fill="#CA8A04" />
    
    <!-- Base -->
    <rect x="-14" y="24" width="28" height="6" rx="2" fill="#713F12" />
    <rect x="-11" y="21" width="22" height="3" rx="1" fill="#A16207" />
  </g>
</svg>
