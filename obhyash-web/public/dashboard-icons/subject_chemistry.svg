<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="chemBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="chemBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="potionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Base 3D Tile -->
  <rect x="6" y="8" width="88" height="84" rx="26" fill="#064E3B" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#chemBg)" stroke="url(#chemBorder)" stroke-width="3" />
  <path d="M 16 26 C 16 16 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.25" />

  <!-- 3D Erlenmeyer Flask -->
  <g transform="translate(50, 52)">
