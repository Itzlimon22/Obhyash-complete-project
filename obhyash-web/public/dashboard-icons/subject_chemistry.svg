    <path d="M -8 -26 L 8 -26 L 8 -14 L 24 16 C 26 20 22 24 18 24 L -18 24 C -22 24 -26 20 -24 16 L -8 -14 Z" fill="#064E3B" opacity="0.3" />
    
    <!-- Flask Liquid Potion -->
    <path d="M -16 6 L 16 6 L 22 16 C 24 19 21 22 18 22 L -18 22 C -21 22 -24 19 -22 16 Z" fill="url(#potionGrad)" />

    <!-- Flask Glass Body -->
    <path d="M -6 -26 L 6 -26 L 6 -14 L 22 16 C 24 19 21 22 18 22 L -18 22 C -21 22 -24 19 -22 16 L -6 -14 Z" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" fill="none" />
    <rect x="-8" y="-28" width="16" height="4" rx="2" fill="#FFFFFF" />

    <!-- Bubbles -->
    <circle cx="-6" cy="14" r="3" fill="#C084FC" opacity="0.8" />
    <circle cx="6" cy="10" r="2.2" fill="#E879F9" opacity="0.9" />
    <circle cx="-2" cy="-4" r="2" fill="#FFFFFF" opacity="0.8" />
    <circle cx="4" cy="-10" r="1.5" fill="#FFFFFF" opacity="0.8" />
