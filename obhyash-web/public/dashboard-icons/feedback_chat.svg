<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="chatBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="shadowChat" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0C4A6E" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#0C4A6E" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#chatBg)" stroke="url(#chatBorder)" stroke-width="3.5" filter="url(#shadowChat)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Chat Bubble -->
  <g transform="translate(50, 48)">
    <path d="M -18 -16 L 18 -16 C 22 -16 24 -14 24 -10 L 24 6 C 24 10 22 12 18 12 L -6 12 L -16 22 L -16 12 L -18 12 C -22 12 -24 10 -24 6 L -24 -10 C -24 -14 -22 -16 -18 -16 Z" fill="#FFFFFF" />
    <!-- Dots -->
    <circle cx="-10" cy="-2" r="3" fill="#0284C7" />
    <circle cx="0" cy="-2" r="3" fill="#0284C7" />
    <circle cx="10" cy="-2" r="3" fill="#0284C7" />
  </g>
</svg>
