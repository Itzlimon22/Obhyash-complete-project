<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="blogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="blogBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBCFE8" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <filter id="shadowBlog" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#831843" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 3D Base Tile -->
  <rect x="6" y="8" width="88" height="84" rx="26" fill="#831843" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#blogBg)" stroke="url(#blogBorder)" stroke-width="3.5" filter="url(#shadowBlog)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Newspaper / Blog Post Illustration -->
  <g transform="translate(50, 48)">
    <!-- Main Article Sheet -->
    <rect x="-20" y="-18" width="40" height="36" rx="4" fill="#FFFFFF" />
    <!-- Top Image/Banner Header in Article -->
    <rect x="-16" y="-14" width="14" height="12" rx="2" fill="#F472B6" />
    <circle cx="-9" cy="-8" r="2.5" fill="#FEF08A" />

    <!-- Article Header Text Lines -->
    <rect x="2" y="-14" width="14" height="3" rx="1.5" fill="#DB2777" />
    <rect x="2" y="-9" width="10" height="3" rx="1.5" fill="#F472B6" />

    <!-- Body Paragraph Lines -->
    <rect x="-16" y="2" width="32" height="2.5" rx="1.25" fill="#CBD5E1" />
    <rect x="-16" y="7" width="32" height="2.5" rx="1.25" fill="#CBD5E1" />
    <rect x="-16" y="12" width="20" height="2.5" rx="1.25" fill="#CBD5E1" />

    <!-- Mini Star Badge -->
    <polygon points="12,12 13.5,8 17,8 14,5 15,1 12,3 9,1 10,5 7,8 10.5,8" fill="#FBBF24" />
  </g>
</svg>
