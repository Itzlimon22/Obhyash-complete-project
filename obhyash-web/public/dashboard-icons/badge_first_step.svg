<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="rocketShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <linearGradient id="rocketBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="fireTrail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadowRocket" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#082F49" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Base Medallion -->
  <circle cx="100" cy="104" r="82" fill="#082F49" />
  <circle cx="100" cy="98" r="82" fill="url(#rocketShield)" stroke="url(#rocketBorder)" stroke-width="7" filter="url(#shadowRocket)" />
  <circle cx="100" cy="98" r="66" fill="#032541" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Glass Specular Highlight -->
  <path d="M 40 70 C 50 40 85 24 125 24 C 75 35 45 65 40 70 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- 3D Rocket Space Shuttle Centerpiece -->
  <g transform="translate(100, 96) rotate(-35)">
    <!-- Fire Booster Blast -->
    <path d="M -10 32 C -15 50 0 70 0 70 C 0 70 15 50 10 32 Z" fill="url(#fireTrail)" />
    <path d="M -5 32 C -8 44 0 56 0 56 C 0 56 8 44 5 32 Z" fill="#FEF08A" />

    <!-- Rocket Wings -->
    <path d="M -12 16 L -32 30 L -14 34 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5" />
    <path d="M 12 16 L 32 30 L 14 34 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5" />

    <!-- Rocket Body -->
    <path d="M 0 -44 C -18 -10 -16 28 -14 34 L 14 34 C 16 28 18 -10 0 -44 Z" fill="url(#rocketBody)" stroke="#94A3B8" stroke-width="2" />

    <!-- Nose Cone -->
    <path d="M 0 -44 C -10 -26 -14 -12 0 -12 C 14 -12 10 -26 0 -44 Z" fill="#EF4444" />

    <!-- Porthole Window -->
    <circle cx="0" cy="2" r="9" fill="#0284C7" stroke="#E2E8F0" stroke-width="2.5" />
    <circle cx="0" cy="2" r="6" fill="#38BDF8" />
    <circle cx="-2" cy="0" r="2" fill="#FFFFFF" />

    <!-- Exhaust Nozzle -->
    <rect x="-8" y="34" width="16" height="4" rx="2" fill="#475569" />
  </g>
</svg>
