<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="mailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="mailBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="shadowMail" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#075985" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#075985" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#mailBg)" stroke="url(#mailBorder)" stroke-width="3.5" filter="url(#shadowMail)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Mail Envelope Illustration -->
  <g transform="translate(50, 48)">
    <rect x="-22" y="-15" width="44" height="30" rx="6" fill="#FFFFFF" />
    <path d="M -22 -13 L 0 4 L 22 -13 Z" fill="#BAE6FD" />
    <path d="M -22 15 L -6 -1" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 22 15 L 6 -1" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -22 -13 L 0 4 L 22 -13" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
