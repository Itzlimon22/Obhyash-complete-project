<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="mathTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="mathTileBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Compass Metal Gold Legs -->
    <linearGradient id="compassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Compass Silver / Chrome Joint -->
    <linearGradient id="compassChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Pencil Body on Compass Leg -->
    <linearGradient id="compassPencil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Base 3D Tile -->
  <rect x="6" y="8" width="88" height="84" rx="26" fill="#4C1D95" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#mathTileBg)" stroke="url(#mathTileBorder)" stroke-width="3" />
  <path d="M 16 26 C 16 16 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.25" />

  <!-- 3D Geometric Compass & Arc -->
  <g transform="translate(50, 48)">
    <!-- Drawn Geometry Dotted Pencil Arc -->
    <path d="M -22 22 A 28 28 0 0 1 24 18" stroke="#E9D5FF" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Left Compass Needle Leg (Steel Needle Point) -->
    <path d="M -3 -12 L -18 24 L -15 24 L -1 -12 Z" fill="url(#compassGold)" stroke="#78350F" stroke-width="0.6" />
    <!-- Needle Tip Point -->
    <polygon points="-18,24 -15,24 -16.5,29" fill="#F1F5F9" stroke="#64748B" stroke-width="0.5" />

    <!-- Right Compass Pencil Leg (Holding Lead) -->
    <path d="M 3 -12 L 14 12 L 17 12 L 5 -12 Z" fill="url(#compassGold)" stroke="#78350F" stroke-width="0.6" />

    <!-- Mini Pencil Attached to Right Leg -->
    <g transform="translate(15, 12) rotate(24)">
      <!-- Pencil Body -->
      <rect x="-3" y="0" width="6" height="12" rx="1.5" fill="url(#compassPencil)" />
      <!-- Sharpened Tip -->
      <polygon points="-3,12 3,12 0,18" fill="#FDE68A" />
      <polygon points="-1.2,16 1.2,16 0,18" fill="#1E293B" />
      <!-- Metal Collar Ring -->
      <rect x="-3.5" y="-2" width="7" height="3" rx="1" fill="url(#compassChrome)" />
    </g>

    <!-- Top Compass Hinge Head (Turn-screw & Knob) -->
    <!-- Top Turn-knob -->
    <rect x="-2" y="-24" width="4" height="6" rx="1.5" fill="url(#compassChrome)" stroke="#64748B" stroke-width="0.6" />
    <!-- Circular Joint Pivot -->
    <circle cx="0" cy="-14" r="6.5" fill="url(#compassChrome)" stroke="#475569" stroke-width="0.8" />
    <circle cx="0" cy="-14" r="3" fill="url(#compassGold)" />
  </g>

  <!-- Sparkles -->
  <polygon points="76,20 78,16 82,16 79,13 80,9 76,12 72,9 73,13 70,16 74,16" fill="#FEF08A" />
</svg>
