<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="bulbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bulbBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="shadowBulb" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#78350F" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#bulbBg)" stroke="url(#bulbBorder)" stroke-width="3.5" filter="url(#shadowBulb)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Lightbulb Illustration -->
  <g transform="translate(50, 46)">
    <!-- Bulb Glass Dome -->
    <path d="M -16 -6 C -16 -16 16 -16 16 -6 C 16 4 8 10 8 16 L -8 16 C -8 10 -16 4 -16 -6 Z" fill="#FFFFFF" />
    <circle cx="-5" cy="-8" r="4" fill="#FEF08A" opacity="0.8" />
    <!-- Screw Base -->
    <rect x="-6" y="16" width="12" height="4" rx="1.5" fill="#E2E8F0" />
    <rect x="-5" y="20" width="10" height="3" rx="1" fill="#CBD5E1" />
    <ellipse cx="0" cy="24" rx="3" ry="1.5" fill="#94A3B8" />
  </g>
</svg>
