<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="histBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="histBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="shadowHist" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0C4A6E" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#0C4A6E" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#histBg)" stroke="url(#histBorder)" stroke-width="3.5" filter="url(#shadowHist)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Chronometer / Clock Face -->
  <g transform="translate(50, 48)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Clock Hands -->
    <line x1="0" y1="0" x2="0" y2="-11" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="8" y2="0" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#0369A1" />
    <!-- Outer Timer Ticks -->
    <rect x="-1" y="-17" width="2" height="3" fill="#94A3B8" />
    <rect x="14" y="-1" width="3" height="2" fill="#94A3B8" />
    <rect x="-1" y="14" width="2" height="3" fill="#94A3B8" />
    <rect x="-17" y="-1" width="3" height="2" fill="#94A3B8" />
  </g>
</svg>
