<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="speedShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="50%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>
    <linearGradient id="speedBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFFAFE" />
      <stop offset="30%" stop-color="#22D3EE" />
      <stop offset="70%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <filter id="shadowSpeed" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#083344" flood-opacity="0.55" />
    </filter>
  </defs>

  <circle cx="100" cy="104" r="82" fill="#083344" />
  <circle cx="100" cy="98" r="82" fill="url(#speedShield)" stroke="url(#speedBorder)" stroke-width="7" filter="url(#shadowSpeed)" />
  <circle cx="100" cy="98" r="66" fill="#04202C" stroke="#22D3EE" stroke-width="2.5" />

  <!-- Glass Specular Highlight -->
  <path d="M 40 70 C 50 40 85 24 125 24 C 75 35 45 65 40 70 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- 3D Speed Chrono Stopwatch with Lightning -->
  <g transform="translate(100, 96)">
    <!-- Chrono Outer Rim -->
    <circle cx="0" cy="4" r="42" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3" />
    <circle cx="0" cy="4" r="36" fill="#0F172A" />

    <!-- Top Button -->
    <rect x="-6" y="-44" width="12" height="8" rx="2" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
    <path d="M -14 -40 C -14 -48 14 -48 14 -40" stroke="#E2E8F0" stroke-width="3" fill="none" />

    <!-- Ticks & Meter -->
    <circle cx="0" cy="4" r="30" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="8 4" fill="none" opacity="0.6" />

    <!-- 3D Electric Lightning Bolt Overlay -->
    <polygon points="4,-24 -16,4 0,4 -6,28 18,-2 2,-2" fill="#FACC15" stroke="#CA8A04" stroke-width="2" filter="drop-shadow(0 0 8px rgba(250,204,21,0.8))" />
  </g>
</svg>
