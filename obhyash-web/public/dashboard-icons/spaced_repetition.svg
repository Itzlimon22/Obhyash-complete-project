<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="srBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="srBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="shadowSr" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#064E3B" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#022C22" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#srBg)" stroke="url(#srBorder)" stroke-width="3.5" filter="url(#shadowSr)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Flashcards Deck -->
  <g transform="translate(50, 48)">
    <!-- Back Card -->
    <rect x="-14" y="-20" width="28" height="34" rx="4" fill="#A7F3D0" transform="rotate(-12)" />
    <!-- Front Card -->
    <rect x="-14" y="-18" width="28" height="34" rx="4" fill="#FFFFFF" transform="rotate(6)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))" />
    <!-- Lightbulb / Brain Icon on Card -->
    <circle cx="2" cy="-4" r="5" fill="#F59E0B" />
    <path d="M 0 1 L 4 1 L 3 4 L 1 4 Z" fill="#D97706" />
    <circle cx="2" cy="-4" r="2.5" fill="#FEF08A" />
  </g>
</svg>
