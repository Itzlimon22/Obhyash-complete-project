<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Gradient for Mind Maps (Purple & Violet) -->
    <linearGradient id="mmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    
    <linearGradient id="mmBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Central Glowing Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Satellite Node Gradients -->
    <linearGradient id="cyanNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="pinkNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <linearGradient id="greenNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="blueNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Base 3D Tile -->
  <rect x="6" y="9" width="88" height="84" rx="26" fill="#3B0764" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#mmBg)" stroke="url(#mmBorder)" stroke-width="3" />
  
  <!-- Glossy Curve -->
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- Network Connecting Synapse Lines -->
  <!-- Center to Top Left -->
  <path d="M 50 49 Q 36 40 28 32" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <!-- Center to Top Right -->
  <path d="M 50 49 Q 62 38 72 31" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <!-- Center to Bottom Left -->
  <path d="M 50 49 Q 34 58 27 67" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <!-- Center to Bottom Right -->
  <path d="M 50 49 Q 64 60 73 68" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Outer Interconnecting Circuit Arc -->
  <path d="M 28 32 Q 50 19 72 31" stroke="#C084FC" stroke-width="1.8" stroke-dasharray="3 3" fill="none" opacity="0.7" />
  <path d="M 27 67 Q 50 78 73 68" stroke="#C084FC" stroke-width="1.8" stroke-dasharray="3 3" fill="none" opacity="0.7" />

  <!-- Satellite Concept Nodes -->
  <!-- Top Left Node (Cyan) -->
  <g transform="translate(28, 32)">
    <circle cx="0" cy="2" r="9" fill="#0E7490" opacity="0.4" />
    <circle cx="0" cy="0" r="9" fill="url(#cyanNode)" stroke="#CFFAFE" stroke-width="1.8" />
    <circle cx="-2.5" cy="-2.5" r="2.5" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Top Right Node (Pink) -->
  <g transform="translate(72, 31)">
    <circle cx="0" cy="2" r="9.5" fill="#831843" opacity="0.4" />
    <circle cx="0" cy="0" r="9.5" fill="url(#pinkNode)" stroke="#FCE7F3" stroke-width="1.8" />
    <circle cx="-2.5" cy="-2.5" r="2.5" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Bottom Left Node (Emerald) -->
  <g transform="translate(27, 67)">
    <circle cx="0" cy="2" r="8.5" fill="#064E3B" opacity="0.4" />
    <circle cx="0" cy="0" r="8.5" fill="url(#greenNode)" stroke="#D1FAE5" stroke-width="1.8" />
    <circle cx="-2" cy="-2" r="2" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Bottom Right Node (Blue) -->
  <g transform="translate(73, 68)">
    <circle cx="0" cy="2" r="8.5" fill="#1E3A8A" opacity="0.4" />
    <circle cx="0" cy="0" r="8.5" fill="url(#blueNode)" stroke="#DBEAFE" stroke-width="1.8" />
    <circle cx="-2" cy="-2" r="2" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Central Glowing Idea Nucleus / Bulb -->
  <g transform="translate(50, 49)">
    <!-- Glow Ring Behind Center -->
    <circle cx="0" cy="0" r="19" fill="#FDE047" opacity="0.2" />
    <!-- Core Shadow -->
    <circle cx="0" cy="2.5" r="14.5" fill="#4C1D95" opacity="0.4" />
    <!-- Core Base -->
    <circle cx="0" cy="0" r="14.5" fill="url(#coreGrad)" stroke="#FEF08A" stroke-width="2.2" />

    <!-- 3D Lightbulb / Brain Wave Glyph inside -->
    <path d="M -4 -6 C -6 -4 -6 0 -4 3 L -3 5 L 3 5 L 4 3 C 6 0 6 -4 4 -6 C 2 -8 -2 -8 -4 -6 Z" fill="#78350F" />
    <rect x="-2" y="6" width="4" height="1.8" rx="0.8" fill="#78350F" />
    <!-- Filament highlight -->
    <path d="M -2 -3 Q 0 -5 2 -3" stroke="#FEF08A" stroke-width="1" fill="none" stroke-linecap="round" />
  </g>

  <!-- Sparkles -->
  <polygon points="50,16 51.5,12 53,16 57,17.5 53,19 51.5,23 50,19 46,17.5" fill="#FDE047" />
  <polygon points="82,49 83,46 84,49 87,50 84,51 83,54 82,51 79,50" fill="#FDE047" opacity="0.8" />
</svg>
