<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="streak3Shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="streak3Border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="fire3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadowStreak3" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#451A03" flood-opacity="0.55" />
    </filter>
  </defs>

  <circle cx="100" cy="104" r="82" fill="#451A03" />
  <circle cx="100" cy="98" r="82" fill="url(#streak3Shield)" stroke="url(#streak3Border)" stroke-width="7" filter="url(#shadowStreak3)" />
  <circle cx="100" cy="98" r="66" fill="#2E1005" stroke="#FBBF24" stroke-width="2.5" />

  <!-- Glass Specular Highlight -->
  <path d="M 40 70 C 50 40 85 24 125 24 C 75 35 45 65 40 70 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- 3D Flame Core Centerpiece -->
  <g transform="translate(100, 96)">
    <!-- Outer Flame -->
    <path d="M 0 -48 C 16 -24 38 -12 38 18 C 38 40 18 52 0 52 C -18 52 -38 40 -38 18 C -38 -12 -16 -24 0 -48 Z" fill="url(#fire3Grad)" filter="drop-shadow(0 4px 10px rgba(245,158,11,0.5))" />
    <!-- Inner Flame -->
    <path d="M 0 -26 C 10 -10 22 -2 22 20 C 22 36 10 44 0 44 C -10 44 -22 36 -22 20 C -22 -2 -10 -10 0 -26 Z" fill="#FEF08A" />
    <!-- Core Spark -->
    <ellipse cx="0" cy="24" rx="10" ry="14" fill="#FFFFFF" />

    <!-- Number 3 Badge -->
    <g transform="translate(0, 24)">
      <circle cx="0" cy="0" r="14" fill="#78350F" stroke="#FEF08A" stroke-width="2" />
      <text x="0" y="5" font-family="'HindSiliguri', sans-serif" font-weight="900" font-size="14" fill="#FEF08A" text-anchor="middle">৩</text>
    </g>
  </g>
</svg>
