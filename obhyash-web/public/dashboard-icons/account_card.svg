  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#312E81" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="3.5" filter="url(#shadowCard)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Student ID Card / User Profile -->
