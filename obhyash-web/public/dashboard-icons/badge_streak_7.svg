    <filter id="shadowStreak7" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#431407" flood-opacity="0.55" />
    </filter>
  </defs>

  <circle cx="100" cy="104" r="82" fill="#431407" />
  <circle cx="100" cy="98" r="82" fill="url(#streak7Shield)" stroke="url(#streak7Border)" stroke-width="7" filter="url(#shadowStreak7)" />
  <circle cx="100" cy="98" r="66" fill="#2C0C04" stroke="#FB923C" stroke-width="2.5" />

  <!-- Glass Specular Highlight -->
  <path d="M 40 70 C 50 40 85 24 125 24 C 75 35 45 65 40 70 Z" fill="#FFFFFF" opacity="0.3" />

