      <circle cx="0" cy="0" r="15" fill="#7C2D12" stroke="#FFEDD5" stroke-width="2.5" />
      <text x="0" y="6" font-family="'HindSiliguri', sans-serif" font-weight="900" font-size="15" fill="#FEF08A" text-anchor="middle">৭</text>
