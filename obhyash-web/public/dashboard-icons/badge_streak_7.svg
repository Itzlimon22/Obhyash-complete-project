    <path d="M 0 -30 C 14 -14 26 -4 26 22 C 26 38 14 46 0 46 C -14 46 -26 38 -26 22 C -26 -4 -14 -14 0 -30 Z" fill="#FDE047" />
    <ellipse cx="0" cy="24" rx="12" ry="16" fill="#FFFFFF" />

    <!-- Number 7 Badge -->
