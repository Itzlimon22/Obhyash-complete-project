<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="ictBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="ictBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="ictShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#164E63" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base 3D Tile -->
  <rect x="6" y="8" width="88" height="84" rx="26" fill="#164E63" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#ictBg)" stroke="url(#ictBorder)" stroke-width="3" filter="url(#ictShadow)" />
  <path d="M 16 26 C 16 16 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.25" />

  <!-- 3D Microchip / Circuit Core -->
  <g transform="translate(50, 48)">
    <!-- Circuit Pins -->
    <g stroke="#FDE047" stroke-width="2.5" stroke-linecap="round">
      <line x1="-24" y1="-8" x2="-14" y2="-8" />
      <line x1="-24" y1="0" x2="-14" y2="0" />
      <line x1="-24" y1="8" x2="-14" y2="8" />

      <line x1="14" y1="-8" x2="24" y2="-8" />
      <line x1="14" y1="0" x2="24" y2="0" />
      <line x1="14" y1="8" x2="24" y2="8" />

      <line x1="-8" y1="-24" x2="-8" y2="-14" />
      <line x1="0" y1="-24" x2="0" y2="-14" />
      <line x1="8" y1="-24" x2="8" y2="-14" />

      <line x1="-8" y1="14" x2="-8" y2="24" />
      <line x1="0" y1="14" x2="0" y2="24" />
      <line x1="8" y1="14" x2="8" y2="24" />
    </g>

    <!-- Chip Silicon Base -->
    <rect x="-16" y="-16" width="32" height="32" rx="6" fill="url(#chipGrad)" stroke="#38BDF8" stroke-width="2" />
    <!-- Chip Center Node -->
    <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#0284C7" />
    <circle cx="0" cy="0" r="3" fill="#A5F3FC" />
  </g>
</svg>
