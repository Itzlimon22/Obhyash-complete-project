<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <filter id="shadowShield" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#064E3B" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#064E3B" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#shieldBg)" stroke="url(#shieldBorder)" stroke-width="3.5" filter="url(#shadowShield)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Security Shield & Checkmark -->
  <g transform="translate(50, 48)">
    <path d="M 0 -22 L 20 -14 C 20 6 12 18 0 24 C -12 18 -20 6 -20 -14 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M 0 -18 L 16 -11 C 16 5 9 15 0 20 C -9 15 -16 5 -16 -11 Z" fill="url(#shieldBg)" />
    <!-- 3D Golden Checkmark -->
    <path d="M -8 1 L -2 7 L 10 -5" stroke="url(#goldKey)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
