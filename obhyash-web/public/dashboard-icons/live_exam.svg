<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="liveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="liveBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="shadowLive" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#172554" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#liveBg)" stroke="url(#liveBorder)" stroke-width="3.5" filter="url(#shadowLive)" />
  
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- Rocket / Lightning Illustration -->
  <g transform="translate(50, 48) rotate(-45)">
    <!-- Rocket Body -->
    <path d="M 0 -28 C 12 -12 14 14 10 24 L -10 24 C -14 14 -12 -12 0 -28 Z" fill="#FFFFFF" />
    <!-- Rocket Red Nose -->
    <path d="M 0 -28 C 6 -20 8 -12 8 -8 L -8 -8 C -8 -12 -6 -20 0 -28 Z" fill="#EF4444" />
    <!-- Porothole Glass -->
    <circle cx="0" cy="2" r="5.5" fill="#38BDF8" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Fins -->
    <path d="M -10 12 L -20 24 L -8 24 Z" fill="#EF4444" />
    <path d="M 10 12 L 20 24 L 8 24 Z" fill="#EF4444" />
    <!-- Thruster Fire -->
    <path d="M -6 24 C -6 34 0 38 0 38 C 0 38 6 34 6 24 Z" fill="#F59E0B" />
    <path d="M -3 24 C -3 30 0 33 0 33 C 0 30 3 30 3 24 Z" fill="#FEF08A" />
  </g>
</svg>
