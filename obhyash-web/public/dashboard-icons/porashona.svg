<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Gradient for Porashona / Study (Royal Berry & Plum) -->
    <linearGradient id="porashonaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#701A75" />
      <stop offset="100%" stop-color="#4A044E" />
    </linearGradient>
    
    <!-- Outer Border Gradient -->
    <linearGradient id="porashonaBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Golden Bookmark Ribbon -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Glowing Pages Gradient -->
    <linearGradient id="pagesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF4FF" />
    </linearGradient>
  </defs>

  <!-- Base 3D Rounded Square Tile -->
  <rect x="6" y="9" width="88" height="84" rx="26" fill="#3B0764" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#porashonaBg)" stroke="url(#porashonaBorder)" stroke-width="3" />
  
  <!-- Glossy Highlight Curve -->
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.2" />

  <!-- 3D Open Book Illustration -->
  <!-- Book Outer Cover / Spine -->
  <path d="M 18 64 C 32 60 46 64 50 67 C 54 64 68 60 82 64 L 82 69 C 68 65 54 69 50 72 C 46 69 32 65 18 69 Z" fill="#2E1065" />
  
  <!-- Left Pages Stack Shadow -->
  <path d="M 20 62 C 32 58 46 62 50 65 L 50 35 C 46 32 32 28 20 32 Z" fill="#E9D5FF" />
  <!-- Left Top Page -->
  <path d="M 21 60 C 33 56 46 60 49 63 L 49 33 C 46 30 33 26 21 30 Z" fill="url(#pagesGrad)" stroke="#F3E8FF" stroke-width="0.8" />
  
  <!-- Right Pages Stack Shadow -->
  <path d="M 80 62 C 68 58 54 62 50 65 L 50 35 C 54 32 68 28 80 32 Z" fill="#E9D5FF" />
  <!-- Right Top Page -->
  <path d="M 79 60 C 67 56 54 60 51 63 L 51 33 C 54 30 67 26 79 30 Z" fill="url(#pagesGrad)" stroke="#F3E8FF" stroke-width="0.8" />

  <!-- Center Spine Binding Shadow -->
  <path d="M 48.5 32 L 51.5 32 L 51.5 65 L 48.5 65 Z" fill="#C084FC" opacity="0.5" />

  <!-- Page Lines (Text Representation) -->
  <!-- Left page lines -->
  <line x1="26" y1="38" x2="44" y2="40" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
  <line x1="26" y1="44" x2="44" y2="46" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
  <line x1="26" y1="50" x2="38" y2="51.5" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- Right page lines -->
  <line x1="56" y1="40" x2="74" y2="38" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
  <line x1="56" y1="46" x2="74" y2="44" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
  <line x1="56" y1="51.5" x2="68" y2="50" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- Golden Bookmark Ribbon hanging from center -->
  <path d="M 48 33 L 52 33 L 52 69 L 50 67 L 48 69 Z" fill="url(#goldRibbon)" />

  <!-- Floating Graduation Cap / Knowledge Symbol Top Right -->
  <g transform="translate(68, 22) scale(0.65)">
    <path d="M 0 8 L 16 0 L 32 8 L 16 16 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="1.5" />
    <path d="M 6 12 L 6 19 C 6 22 26 22 26 19 L 26 12" fill="#CA8A04" />
    <line x1="28" y1="10" x2="33" y2="18" stroke="#FEF08A" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="33" cy="19" r="1.5" fill="#FEF08A" />
  </g>

  <!-- Sparkle Accents -->
  <polygon points="22,21 23.5,17 25,21 29,22.5 25,24 23.5,28 22,24 18,22.5" fill="#FDE047" />
  <polygon points="78,54 79,51 80,54 83,55 80,56 79,59 78,56 75,55" fill="#FDE047" opacity="0.8" />
</svg>
