<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obhyash Dual-Arrow Rotation & Bounce Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #0c1f0a 0%, #071500 50%, #030a01 100%);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .header-bar {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    p.subtitle {
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 14px;
      color: #94a3b8;
    }

    /* Phone Mockup Frame */
    .phone-wrapper {
      position: relative;
      width: 320px;
      height: 640px;
      background: #071500; /* Deepest Green */
      border-radius: 46px;
      box-shadow: 
        0 0 0 10px #0e240b,
        0 0 0 12px #183814,
        0 30px 80px rgba(0, 0, 0, 0.9),
        0 0 60px rgba(7, 21, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island / Notch */
    .phone-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 24px;
      background: #040c00;
      border-radius: 20px;
      z-index: 50;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
    }

    .island-lens {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #071500;
      border: 1px solid #10b981;
    }

    /* Mobile Status Bar */
    .phone-status {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
      z-index: 40;
      pointer-events: none;
    }

    /* Screen Stage */
    .screen-content {
      position: relative;
      width: 100%;
      height: 100%;
      background: #071500; /* Deepest Green */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient Glow Behind Icon */
    .ambient-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(16, 185, 129, 0.1) 45%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      transform: scale(0.6);
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ambient-glow.active {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Splash Stage Container */
    .splash-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    /* Dual Arrow Icon Stage */
    .arrows-stage {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: -10px;
    }

    .arrow-part {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      will-change: transform, opacity;
    }

    .arrow-part img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.6));
    }

    /* Lock Flash Pulse */
    .lock-pulse {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, transparent 70%);
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
      z-index: 25;
    }

    /* Text Stage */
    .text-stage {
      margin-top: 24px;
      text-align: center;
      font-family: 'Hind Siliguri', sans-serif;
      opacity: 0;
      transform: translateY(14px);
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #a7f3d0;
      letter-spacing: 0.3px;
      margin-top: 5px;
      opacity: 0.85;
    }

    /* Home Screen Behind Splash (Transitions in after animation) */
    .home-view {
      position: absolute;
      inset: 0;
      background: #0a0a0c;
      z-index: 10;
      opacity: 0;
      transform: scale(1.04);
      transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 60px 20px 20px;
    }

    .home-view.active {
      opacity: 1;
      transform: scale(1);
    }

    .home-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .home-title {
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .card-dummy {
      background: #141418;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-dummy-line {
      height: 10px;
      background: #27272a;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    /* Keyframes for Arrow 1 (Bounces in from top-left) */
    @keyframes arrow1BounceIn {
      0% {
        opacity: 0;
        transform: translate(-70px, -70px) scale(0.6);
      }
      65% {
        opacity: 1;
        transform: translate(8px, 8px) scale(1.06);
      }
      85% {
        transform: translate(-3px, -3px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1.0);
      }
    }

    /* Keyframes for Arrow 2 (Bounces in from bottom-right) */
    @keyframes arrow2BounceIn {
      0% {
        opacity: 0;
        transform: translate(70px, 70px) scale(0.6);
      }
      65% {
        opacity: 1;
        transform: translate(-8px, -8px) scale(1.06);
      }
      85% {
        transform: translate(3px, 3px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1.0);
      }
    }

    /* Combined 360 Degree Spin after parts are in place */
    @keyframes spin360 {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .animating #arrow1 {
      animation: arrow1BounceIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animating #arrow2 {
      animation: arrow2BounceIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animating.spinning .arrows-stage {
      animation: spin360 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    .splash-stage.fade-out {
      opacity: 0;
      transform: scale(1.08);
      filter: blur(4px);
      transition: all 0.5s ease-in-out;
      pointer-events: none;
    }

    /* Controls Bar */
    .controls {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 12px;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn-replay {
      background: #ffffff;
      color: #071500;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.3);
    }

    .btn-replay:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .btn-replay:active {
      transform: translateY(1px);
    }

    .speed-btn {
      background: #11280d;
      color: #94a3b8;
      border: 1px solid #1a3d14;
      padding: 8px 14px;
      font-size: 12px;
    }

    .speed-btn.active {
      background: #10b981;
      color: #042f1f;
      border-color: #10b981;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="badge">✨ DUAL-ARROW ROTATION & BOUNCE</div>
    <h1>লোগোর দুটি অ্যারো রোটেট ও বাউন্স অ্যানিমেশন</h1>
    <p class="subtitle">Deepest Green ব্যাকগ্রাউন্ডে দুটি হোয়াইট অ্যারো ঘুরে এসে বাউন্স করে ফিক্স হবে</p>
  </div>

  <!-- Mobile Mockup -->
  <div class="phone-wrapper">
    <div class="phone-island">
      <div class="island-lens"></div>
    </div>
    <div class="phone-status">
      <span>9:41</span>
      <span>📶 5G 🔋</span>
    </div>

    <div class="screen-content" id="screen">
      <!-- Splash Animation Stage -->
      <div class="splash-stage" id="splash">
        <div class="arrows-stage">
          <!-- Arrow Part 1 (White & Red) -->
          <div class="arrow-part" id="arrow1">
            <img src="/obhyash_arrow_part1.svg" alt="Arrow Part 1">
          </div>

          <!-- Arrow Part 2 (White & Red) -->
          <div class="arrow-part" id="arrow2">
            <img src="/obhyash_arrow_part2.svg" alt="Arrow Part 2">
          </div>
        </div>
      </div>

      <!-- Home View Transition Mockup -->
      <div class="home-view" id="homeView">
        <div class="home-header">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 28px; height: 28px; border-radius: 8px; overflow: hidden; background: #071500;">
              <img src="/obhyash_logo.svg" style="width: 100%; height: 100%;" />
            </div>
            <span class="home-title">অভ্যাস ড্যাশবোর্ড</span>
          </div>
          <div style="width: 24px; height: 24px; border-radius: 50%; background: #27272a;"></div>
        </div>

        <div class="card-dummy">
          <div class="card-dummy-line" style="width: 60%; background: #10b981;"></div>
          <div class="card-dummy-line" style="width: 90%;"></div>
          <div class="card-dummy-line" style="width: 40%;"></div>
        </div>

        <div class="card-dummy" style="flex: 1;">
          <div class="card-dummy-line" style="width: 75%;"></div>
          <div class="card-dummy-line" style="width: 50%;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-replay" onclick="playAnimation()">
      🔁 অ্যানিমেশন আবার দেখো (Replay)
    </button>
    <div style="display: flex; gap: 6px;">
      <button class="btn speed-btn" onclick="setSpeed(0.5, this)">0.5x ধীরগতি</button>
      <button class="btn speed-btn active" onclick="setSpeed(1, this)">1.0x স্বাভাবিক</button>
      <button class="btn speed-btn" onclick="setSpeed(1.5, this)">1.5x দ্রুত</button>
    </div>
  </div>

  <script>
    let speed = 1.0;
    let timeoutIds = [];

    function clearAllTimeouts() {
      timeoutIds.forEach(id => clearTimeout(id));
      timeoutIds = [];
    }

    function setSpeed(val, btn) {
      speed = val;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      playAnimation();
    }

    function playAnimation() {
      clearAllTimeouts();

      const screen = document.getElementById('screen');
      const splash = document.getElementById('splash');
      const homeView = document.getElementById('homeView');
      const arrow1 = document.getElementById('arrow1');
      const arrow2 = document.getElementById('arrow2');
      const stage = document.querySelector('.arrows-stage');

      // Reset
      screen.classList.remove('animating', 'spinning');
      splash.classList.remove('fade-out');
      homeView.classList.remove('active');

      // Force Reflow
      void screen.offsetWidth;

      // Dynamic Timing based on speed
      arrow1.style.animationDuration = (0.65 / speed) + 's';
      arrow2.style.animationDuration = (0.65 / speed) + 's';
      stage.style.animationDuration = (0.8 / speed) + 's';

      // Step 1: Trigger bounce into place
      screen.classList.add('animating');

      // Step 2: Once locked in place, rotate 360 degrees
      const spinStart = 650 / speed;
      const t1 = setTimeout(() => {
        screen.classList.add('spinning');
      }, spinStart);
      timeoutIds.push(t1);

      // Step 3: Finish and transition to app
      const finishTime = 1600 / speed;
      const t2 = setTimeout(() => {
        splash.classList.add('fade-out');
        homeView.classList.add('active');
      }, finishTime);
      timeoutIds.push(t2);
    }

    // Auto play on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(playAnimation, 250);
    });
  </script>
</body>
</html>
