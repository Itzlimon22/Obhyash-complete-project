<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Outer Shield Gradient (Amethyst Violet & Platinum) -->
    <linearGradient id="amethystShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <linearGradient id="platinumBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E9D5FF" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <linearGradient id="cosmicGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="bigShadowTitan" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#3B0764" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3B0764" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base 3D Crest Shadow -->
  <path d="M 100 12 L 176 46 C 176 116 142 168 100 188 C 58 168 24 116 24 46 Z" fill="#2E1065" />

  <!-- Outer Shield Frame with Platinum/Amethyst Border -->
  <path d="M 100 8 L 176 42 C 176 112 142 164 100 184 C 58 164 24 112 24 42 Z" 
        fill="url(#amethystShield)" 
        stroke="url(#platinumBorder)" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#bigShadowTitan)" />

  <!-- Inner Inset Shield -->
  <path d="M 100 22 L 162 50 C 162 106 134 148 100 166 C 66 148 38 106 38 50 Z" 
        fill="#3B0764" 
        stroke="#9333EA" 
        stroke-width="3" />

  <!-- Top Glass Highlight Specular -->
  <path d="M 100 22 L 162 50 C 162 76 150 102 130 114 C 100 86 64 66 38 50 Z" 
        fill="#FFFFFF" 
        opacity="0.35" />

  <!-- Center Metallic Medallion -->
  <circle cx="100" cy="100" r="46" fill="#581C87" stroke="#E9D5FF" stroke-width="4" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
  <circle cx="100" cy="100" r="37" fill="#2E1065" />

  <!-- Titan Winged Crest & Cosmic Crystal -->
  <g transform="translate(100, 100)">
    <!-- Wings (Left & Right) -->
    <path d="M -9 -9 C -27 -27 -36 5 -9 18 Z" fill="#C084FC" stroke="#FFFFFF" stroke-width="1.8" />
    <path d="M 9 -9 C 27 -27 36 5 9 18 Z" fill="#C084FC" stroke="#FFFFFF" stroke-width="1.8" />
    
    <!-- Central Octagon Diamond Crystal -->
    <polygon points="0,-27 16,-11 16,11 0,27 -16,11 -16,-11" fill="url(#cosmicGem)" stroke="#FFFFFF" stroke-width="2.2" />
    <!-- Diamond Inner Facets -->
    <polygon points="0,-27 8,-6 0,9 -8,-6" fill="#FFFFFF" opacity="0.65" />
    <polygon points="0,27 8,9 0,-6 -8,9" fill="#581C87" opacity="0.45" />
    
    <!-- Sparkle Stars -->
    <polygon points="0,-33 2,-28 7,-28 3,-25 5,-20 0,-23 -5,-20 -3,-25 -7,-28 -2,-28" fill="#FFFFFF" />
  </g>
</svg>
