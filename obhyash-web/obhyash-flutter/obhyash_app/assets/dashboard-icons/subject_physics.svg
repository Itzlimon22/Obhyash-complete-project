<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="phyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="phyBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="phyShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#082F49" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base 3D Tile -->
  <rect x="6" y="8" width="88" height="84" rx="26" fill="#075985" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#phyBg)" stroke="url(#phyBorder)" stroke-width="3" filter="url(#phyShadow)" />
  <path d="M 16 26 C 16 16 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.25" />

  <!-- Atomic Orbit Rings -->
  <g transform="translate(50, 48)">
    <!-- Diagonal Ring 1 -->
    <ellipse cx="0" cy="0" rx="28" ry="10" transform="rotate(-30)" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" fill="none" />
    <!-- Diagonal Ring 2 -->
    <ellipse cx="0" cy="0" rx="28" ry="10" transform="rotate(30)" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" fill="none" />
    <!-- Horizontal Ring -->
    <ellipse cx="0" cy="0" rx="28" ry="10" stroke="#BAE6FD" stroke-width="2" opacity="0.75" fill="none" />

    <!-- Quantum Core Sparkle -->
    <circle cx="0" cy="0" r="10" fill="#0369A1" />
    <!-- 3D Lightning Energy Bolt -->
    <path d="M 2 -18 L -8 1 L 0 1 L -2 18 L 8 -1 L 0 -1 Z" fill="url(#boltGrad)" stroke="#B45309" stroke-width="0.8" />
    <!-- Electrons -->
    <circle cx="-22" cy="-11" r="3.5" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.8" />
    <circle cx="22" cy="11" r="3.5" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.8" />
  </g>
</svg>
