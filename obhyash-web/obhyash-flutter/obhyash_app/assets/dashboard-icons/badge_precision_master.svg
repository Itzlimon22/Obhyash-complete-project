<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="targetShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="targetBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="30%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <filter id="shadowTarget" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#022C22" flood-opacity="0.55" />
    </filter>
  </defs>

  <circle cx="100" cy="104" r="82" fill="#022C22" />
  <circle cx="100" cy="98" r="82" fill="url(#targetShield)" stroke="url(#targetBorder)" stroke-width="7" filter="url(#shadowTarget)" />
  <circle cx="100" cy="98" r="66" fill="#031F18" stroke="#34D399" stroke-width="2.5" />

  <!-- Glass Specular Highlight -->
  <path d="M 40 70 C 50 40 85 24 125 24 C 75 35 45 65 40 70 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- 3D Target Bullseye with Arrow Centerpiece -->
  <g transform="translate(100, 98)">
    <circle cx="0" cy="0" r="44" fill="#DC2626" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="20" fill="#DC2626" />
    <circle cx="0" cy="0" r="9" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />

    <!-- 3D Gold Dart Arrow Through Bullseye -->
    <g transform="rotate(-40)">
      <rect x="-3" y="-36" width="6" height="50" rx="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
      <polygon points="0,-46 -6,-34 6,-34" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
      <!-- Arrow Fletching Fins -->
      <polygon points="0,14 -12,28 -3,28" fill="#38BDF8" />
      <polygon points="0,14 12,28 3,28" fill="#38BDF8" />
    </g>

    <polygon points="12,-18 14,-14 18,-14 15,-11 16,-7 12,-9 8,-7 9,-11 6,-14 10,-14" fill="#FFFFFF" />
  </g>
</svg>
