<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="sageShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="sageBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" />
      <stop offset="30%" stop-color="#A78BFA" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>
    <filter id="shadowSage" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2E1065" flood-opacity="0.55" />
    </filter>
  </defs>

  <circle cx="100" cy="104" r="82" fill="#2E1065" />
  <circle cx="100" cy="98" r="82" fill="url(#sageShield)" stroke="url(#sageBorder)" stroke-width="7" filter="url(#shadowSage)" />
  <circle cx="100" cy="98" r="66" fill="#1C0B3B" stroke="#A78BFA" stroke-width="2.5" />

  <!-- Glass Specular Highlight -->
  <path d="M 40 70 C 50 40 85 24 125 24 C 75 35 45 65 40 70 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- 3D Open Tome & Glowing Brain Centerpiece -->
  <g transform="translate(100, 96)">
    <!-- Book Pages Base -->
    <path d="M 0 16 C 18 8 38 10 46 16 L 46 36 C 38 30 18 28 0 36 C -18 28 -38 30 -46 36 L -46 16 C -38 10 -18 8 0 16 Z" fill="#78350F" stroke="#FDE047" stroke-width="2" />
    <path d="M 0 10 C 18 2 38 4 44 10 L 44 28 C 38 22 18 20 0 28 C -18 20 -38 22 -44 28 L -44 10 C -38 4 -18 2 0 10 Z" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />

    <!-- 3D Glowing Wisdom Brain / Orb -->
    <g transform="translate(0, -10)">
      <circle cx="0" cy="0" r="22" fill="#A855F7" filter="drop-shadow(0 0 12px rgba(192,132,252,0.8))" />
      <path d="M -14 -8 C -18 -8 -20 0 -16 8 C -20 14 -12 18 -6 14 C -2 18 6 18 10 14 C 16 18 22 10 18 4 C 20 -4 14 -10 6 -8 C 4 -16 -8 -16 -14 -8 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" />
      <path d="M 0 -14 L 0 14" stroke="#7C3AED" stroke-width="1.8" />
    </g>
  </g>
</svg>
