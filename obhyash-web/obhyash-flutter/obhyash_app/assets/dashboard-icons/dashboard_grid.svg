<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="dashBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="tileGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadowDash" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#064E3B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 3D Base Tile -->
  <rect x="6" y="8" width="88" height="84" rx="26" fill="#064E3B" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#dashBg)" stroke="url(#dashBorder)" stroke-width="3.5" filter="url(#shadowDash)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Dashboard Grid Tiles -->
  <g transform="translate(50, 48)">
    <!-- Top-Left Tile (Gold Active) -->
    <rect x="-20" y="-20" width="18" height="18" rx="5" fill="url(#tileGold)" />
    <circle cx="-11" cy="-11" r="3.5" fill="#FFFFFF" />

    <!-- Top-Right Tile (Crisp White) -->
    <rect x="2" y="-20" width="18" height="18" rx="5" fill="#FFFFFF" />
    <rect x="6" y="-16" width="10" height="3" rx="1.5" fill="#6EE7B7" />
    <rect x="6" y="-10" width="7" height="3" rx="1.5" fill="#6EE7B7" />

    <!-- Bottom-Left Tile (Crisp White) -->
    <rect x="-20" y="2" width="18" height="18" rx="5" fill="#FFFFFF" />
    <circle cx="-11" cy="11" r="4" fill="#38BDF8" />

    <!-- Bottom-Right Tile (Crisp White) -->
    <rect x="2" y="2" width="18" height="18" rx="5" fill="#FFFFFF" />
    <line x1="6" y1="16" x2="16" y2="6" stroke="#EC4899" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
