<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>
    <filter id="shadowShield" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#4C0519" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#4C0519" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#shieldBg)" stroke="url(#shieldBorder)" stroke-width="3.5" filter="url(#shadowShield)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Sword & Ruby Shield -->
  <g transform="translate(50, 48)">
    <!-- Shield Shape -->
    <path d="M -18 -16 L 18 -16 L 18 4 C 18 16 0 24 0 24 C 0 24 -18 16 -18 4 Z" fill="#FACC15" />
    <path d="M -14 -12 L 14 -12 L 14 3 C 14 13 0 20 0 20 C 0 20 -14 13 -14 3 Z" fill="#E11D48" />
    <!-- Center Emblem Star -->
    <polygon points="0,-6 2,-1 8,-1 3,3 5,9 0,5 -5,9 -3,3 -8,-1 -2,-1" fill="#FEF08A" />
  </g>
</svg>
