<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="legendShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="legendBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="shadowLegend" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#451A03" flood-opacity="0.55" />
    </filter>
  </defs>

  <circle cx="100" cy="104" r="82" fill="#451A03" />
  <circle cx="100" cy="98" r="82" fill="url(#legendShield)" stroke="url(#legendBorder)" stroke-width="7" filter="url(#shadowLegend)" />
  <circle cx="100" cy="98" r="66" fill="#381903" stroke="#FDE047" stroke-width="2.5" />

  <!-- Glass Specular Highlight -->
  <path d="M 40 70 C 50 40 85 24 125 24 C 75 35 45 65 40 70 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- 3D Gold Trophy Cup Centerpiece -->
  <g transform="translate(100, 96)">
    <!-- Trophy Handles -->
    <path d="M -26 -16 C -42 -16 -40 10 -20 16" stroke="url(#trophyGold)" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 26 -16 C 42 -16 40 10 20 16" stroke="url(#trophyGold)" stroke-width="5" fill="none" stroke-linecap="round" />

    <!-- Trophy Cup Body -->
    <path d="M -24 -24 L 24 -24 L 20 12 C 16 26 0 32 0 32 C 0 32 -16 26 -20 12 Z" fill="url(#trophyGold)" stroke="#A16207" stroke-width="2" />
    <!-- Trophy Stem & Base -->
    <rect x="-6" y="32" width="12" height="12" fill="#CA8A04" />
    <polygon points="-18,48 18,48 14,42 -14,42" fill="url(#trophyGold)" stroke="#854D0E" stroke-width="1.5" />

    <!-- Center Ruby Star -->
    <polygon points="0,-16 4,-6 14,-6 6,0 9,10 0,4 -9,10 -6,0 -14,-6 -4,-6" fill="#EF4444" stroke="#FFFFFF" stroke-width="1" />
  </g>
</svg>
