<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="targetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="targetBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <filter id="shadowTarget" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#064E3B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base 3D Rounded Square Badge -->
  <rect x="6" y="8" width="88" height="84" rx="26" fill="#02503A" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#targetBg)" stroke="url(#targetBorder)" stroke-width="3.5" filter="url(#shadowTarget)" />
  
  <!-- Glossy Highlight Curve -->
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- Target & Bullseye -->
  <g transform="translate(50, 48)">
    <!-- Outer White Ring -->
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="28" fill="#E2E8F0" opacity="0.4" />
    
    <!-- Red Outer Ring -->
    <circle cx="0" cy="0" r="21" fill="#EF4444" />
    <circle cx="0" cy="0" r="21" fill="#B91C1C" opacity="0.25" />
    
    <!-- Middle White Ring -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
    
    <!-- Bullseye Gold/Yellow Center -->
    <circle cx="0" cy="0" r="7" fill="#F59E0B" />
    <circle cx="-2" cy="-2" r="2.5" fill="#FEF08A" opacity="0.8" />

    <!-- Arrow in Bullseye -->
    <path d="M -12 -12 L 0 0" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
    <polygon points="-16,-10 -10,-16 -6,-6" fill="#3B82F6" />
    <polygon points="-18,-12 -12,-18 -8,-8" fill="#60A5FA" opacity="0.6" />
  </g>
</svg>
