<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Gradient for Revision Sheet -->
    <linearGradient id="revBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    
    <linearGradient id="revBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Golden Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Sheet Gradients -->
    <linearGradient id="sheetFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>

    <linearGradient id="sheetBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
  </defs>

  <!-- Base 3D Tile -->
  <rect x="6" y="9" width="88" height="84" rx="26" fill="#312E81" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#revBg)" stroke="url(#revBorder)" stroke-width="3" />
  
  <!-- Glossy Curve -->
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- Back Sheet (Rotated slightly) -->
  <g transform="translate(48, 50) rotate(-8) translate(-48, -50)">
    <rect x="29" y="27" width="38" height="48" rx="7" fill="url(#sheetBack)" stroke="#A5B4FC" stroke-width="1.2" />
    <line x1="35" y1="36" x2="57" y2="36" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    <line x1="35" y1="42" x2="53" y2="42" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Front Sheet -->
  <g transform="translate(49, 51) rotate(4) translate(-49, -51)">
    <!-- Drop Shadow of Front Sheet -->
    <rect x="30" y="27" width="40" height="50" rx="8" fill="#3730A3" opacity="0.35" />
    <rect x="28" y="25" width="40" height="50" rx="8" fill="url(#sheetFront)" stroke="#C7D2FE" stroke-width="1.4" />
    
    <!-- Header banner in sheet -->
    <rect x="33" y="30" width="16" height="5" rx="2.5" fill="#6366F1" />
    
    <!-- Text Lines -->
    <line x1="33" y1="40" x2="60" y2="40" stroke="#6366F1" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />
    <line x1="33" y1="46" x2="56" y2="46" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
    <line x1="33" y1="52" x2="61" y2="52" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
    <line x1="33" y1="58" x2="48" y2="58" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
    
    <!-- Mini checkmark -->
    <path d="M 33 65 L 36 68 L 42 62" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Dynamic Glowing 3D Lightning Bolt Overlay -->
  <!-- Shadow of bolt -->
  <path d="M 58 24 L 41 47 L 51 47 L 43 73 L 67 43 L 55 43 Z" fill="#78350F" opacity="0.4" />
  <!-- Main Bolt -->
  <path d="M 57 22 L 40 45 L 50 45 L 42 71 L 66 41 L 54 41 Z" fill="url(#boltGrad)" stroke="#FEF08A" stroke-width="1.2" />

  <!-- Speed Energy Streaks -->
  <path d="M 22 42 L 17 42" stroke="#FDE047" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 25 50 L 19 50" stroke="#FDE047" stroke-width="2.2" stroke-linecap="round" />

  <!-- Sparkles -->
  <polygon points="73,26 74.5,22 76,26 80,27.5 76,29 74.5,33 73,29 69,27.5" fill="#FEF08A" />
  <polygon points="26,67 27,64 28,67 31,68 28,69 27,72 26,69 23,68" fill="#FDE047" opacity="0.9" />
</svg>
