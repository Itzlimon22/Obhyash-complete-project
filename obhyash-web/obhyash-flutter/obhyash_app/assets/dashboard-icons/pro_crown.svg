<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="crownBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="crownBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shadowCrown" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3B0764" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#3B0764" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#crownBg)" stroke="url(#crownBorder)" stroke-width="3.5" filter="url(#shadowCrown)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Crown Illustration -->
  <g transform="translate(50, 48)">
    <!-- Crown Base Body -->
    <path d="M -22 14 L 22 14 L 20 -10 L 10 0 L 0 -16 L -10 0 L -20 -10 Z" fill="url(#goldCrown)" />
    
    <!-- Crown Jewels / Spheres -->
    <circle cx="-20" cy="-10" r="3" fill="#38BDF8" />
    <circle cx="0" cy="-16" r="4" fill="#EF4444" />
    <circle cx="20" cy="-10" r="3" fill="#38BDF8" />

    <!-- Crown Base Band -->
    <rect x="-22" y="14" width="44" height="6" rx="2" fill="#CA8A04" />
    <!-- Embedded gems in band -->
    <circle cx="-12" cy="17" r="1.5" fill="#EF4444" />
    <circle cx="0" cy="17" r="1.5" fill="#38BDF8" />
    <circle cx="12" cy="17" r="1.5" fill="#EF4444" />
  </g>
</svg>
