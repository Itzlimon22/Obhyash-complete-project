<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deepest Midnight Forest Emerald Background -->
    <linearGradient id="deepestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C12" />
      <stop offset="40%" stop-color="#01120B" />
      <stop offset="100%" stop-color="#000805" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Infinity Loop 1: Crisp Pure White & Platinum -->
    <linearGradient id="whiteRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F8FAFC" />
      <stop offset="80%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Infinity Loop 2: Deep Crimson / Ruby Accent -->
    <linearGradient id="deepRedRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="30%" stop-color="#E11D48" />
      <stop offset="70%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Emerald Jade Glow Loop -->
    <linearGradient id="emeraldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Red Energy Core Glow -->
    <radialGradient id="redCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="30%" stop-color="#F43F5E" />
      <stop offset="70%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows for 3D Overlaps -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="coreGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#deepestBg)" stroke="url(#squircleBorder)" stroke-width="3" />
  <rect width="512" height="512" rx="116" fill="url(#ambientGlow)" />

  <!-- Background Decorative Precision Tech Ring (Subtle) -->
  <circle cx="256" cy="256" r="170" stroke="#059669" stroke-width="1.2" stroke-opacity="0.2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="140" stroke="#10B981" stroke-width="1" stroke-opacity="0.12" />

  <!-- ====================================================================== -->
  <!-- 3D INFINITY MÖBIUS LOOP OF HABIT + BENGALI 'অ' (OBHYASH) MONOGRAM     -->
  <!-- ====================================================================== -->
  <g filter="url(#ribbonShadow)">

    <!-- 1. Under-Layer: Deep Red Arc (Left Loop Foundation of 'অ') -->
    <path d="M 190 320 C 120 320 90 270 90 216 C 90 156 140 120 200 120 C 250 120 280 155 305 190 L 335 235 C 365 280 400 320 440 320 C 470 320 490 295 490 256 C 490 205 450 180 400 180" 
          stroke="url(#deepRedRibbon)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.95" />

    <!-- 2. Mid-Layer: Emerald Wave ('অ' Head Curl & Infinity Bridge) -->
    <path d="M 120 210 C 120 170 150 144 195 144 C 242 144 278 180 310 226 L 338 266 C 368 308 402 334 442 334 C 476 334 496 308 496 264 C 496 210 454 172 396 172 C 342 172 300 210 266 256" 
          stroke="url(#emeraldRibbon)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 3. Top-Layer: Solid Pure White Möbius Ribbon (The Spine & Letterform 'অ') -->
    <!-- Continuous graceful ribbon weaving over the red and emerald bridges -->
    <path d="M 160 160 C 130 160 112 184 112 216 C 112 258 145 298 202 298 C 265 298 312 238 350 190 C 382 148 416 126 450 126 C 484 126 502 152 502 186 C 502 230 466 276 408 276 C 345 276 295 214 256 168 C 228 135 195 116 156 116 C 118 116 84 146 84 198 C 84 262 134 326 214 326 C 298 326 364 246 414 186" 
          stroke="url(#whiteRibbon)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 4. Bengali 'অ' Vertical Stem & Right Wing Anchor (Pure White + Platinum) -->
    <path d="M 374 126 L 374 386" 
          stroke="url(#whiteRibbon)" 
          stroke-width="28" 
          stroke-linecap="round" />

    <!-- Top Horizontal Matra Header (Sleek aerodynamic bar) -->
    <path d="M 280 126 L 440 126" 
          stroke="url(#whiteRibbon)" 
          stroke-width="24" 
          stroke-linecap="round" />

    <!-- 5. Central Deep Red Catalyst Node (Inner Spark) -->
    <circle cx="256" cy="256" r="18" fill="url(#redCoreGlow)" filter="url(#coreGlowFilter)" />
    <circle cx="256" cy="256" r="10" fill="#FFFFFF" />

    <!-- 6. Specular Glass Highlights (3D Lustre) -->
    <path d="M 145 154 C 175 140 215 150 250 185" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <path d="M 374 140 L 374 240" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8" />
    <path d="M 430 148 C 455 148 472 165 472 190" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.75" />

    <!-- Sparkle Flare on Top Stem -->
    <polygon points="374,116 377,124 385,126 377,128 374,136 371,128 363,126 371,124" fill="#FFFFFF" />
  </g>

  <!-- Bottom Brand Text (Subtle Minimalist Accent) -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="'HindSiliguri', 'Outfit', sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#FFFFFF">OBHYASH</text>
  <text x="256" y="475" 
        text-anchor="middle" 
        font-family="'HindSiliguri', sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#10B981">অভ্যাস • নিরন্তর প্রস্তুতি</text>
</svg>
