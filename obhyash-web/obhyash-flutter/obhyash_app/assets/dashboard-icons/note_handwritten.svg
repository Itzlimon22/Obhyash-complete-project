<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Gradient for Handwritten (Crimson & Rose) -->
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    
    <linearGradient id="hwBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Luxury Gold Nib Gradient -->
    <linearGradient id="goldNib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FCD34D" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Notepad Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF1F2" />
    </linearGradient>
  </defs>

  <!-- Base 3D Tile -->
  <rect x="6" y="9" width="88" height="84" rx="26" fill="#4C0519" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#hwBg)" stroke="url(#hwBorder)" stroke-width="3" />
  
  <!-- Glossy Curve -->
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- Notepad Sheet (Tilted slightly) -->
  <g transform="translate(46, 52) rotate(-5) translate(-46, -52)">
    <!-- Shadow -->
    <rect x="23" y="25" width="46" height="54" rx="7" fill="#881337" opacity="0.4" />
    <!-- Pad Body -->
    <rect x="21" y="23" width="46" height="54" rx="7" fill="url(#padGrad)" stroke="#FECDD3" stroke-width="1.2" />

    <!-- Spiral Rings on Left -->
    <circle cx="25" cy="29" r="2" fill="#E11D48" />
    <circle cx="25" cy="37" r="2" fill="#E11D48" />
    <circle cx="25" cy="45" r="2" fill="#E11D48" />
    <circle cx="25" cy="53" r="2" fill="#E11D48" />
    <circle cx="25" cy="61" r="2" fill="#E11D48" />
    <circle cx="25" cy="69" r="2" fill="#E11D48" />

    <line x1="20" y1="29" x2="25" y2="29" stroke="#9F1239" stroke-width="1.4" />
    <line x1="20" y1="37" x2="25" y2="37" stroke="#9F1239" stroke-width="1.4" />
    <line x1="20" y1="45" x2="25" y2="45" stroke="#9F1239" stroke-width="1.4" />
    <line x1="20" y1="53" x2="25" y2="53" stroke="#9F1239" stroke-width="1.4" />
    <line x1="20" y1="61" x2="25" y2="61" stroke="#9F1239" stroke-width="1.4" />
    <line x1="20" y1="69" x2="25" y2="69" stroke="#9F1239" stroke-width="1.4" />

    <!-- Handwritten Wave Lines (Simulating cursive notes) -->
    <path d="M 31 34 Q 35 32 39 34 T 47 34 T 55 34 T 61 34" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 31 42 Q 36 40 41 42 T 51 42 T 59 42" stroke="#FDA4AF" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <path d="M 31 50 Q 37 48 43 50 T 53 50 T 62 50" stroke="#FDA4AF" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <path d="M 31 58 Q 35 56 39 58 T 47 58 T 54 58" stroke="#FDA4AF" stroke-width="1.6" stroke-linecap="round" fill="none" />
    
    <!-- Heart / star highlight badge on note -->
    <polygon points="56,64 57.5,61 59,64 62,65 59,66 57.5,69 56,66 53,65" fill="#F43F5E" />
  </g>

  <!-- 3D Luxury Fountain Pen Nib Overlay Drawing -->
  <g transform="translate(64, 38) rotate(42)">
    <!-- Shadow -->
    <path d="M -7 -28 L 7 -28 L 6 0 L 0 14 L -6 0 Z" fill="#4C0519" opacity="0.35" transform="translate(3, 3)" />
    <!-- Nib Body -->
    <path d="M -7 -28 L 7 -28 L 6 0 L 0 14 L -6 0 Z" fill="url(#goldNib)" stroke="#FFFBEB" stroke-width="1" />
    <!-- Nib Center Inscription / Vent Hole -->
    <circle cx="0" cy="-4" r="2.2" fill="#78350F" />
    <line x1="0" y1="-2" x2="0" y2="13" stroke="#78350F" stroke-width="1" />
    <!-- Nib Metal Grip Accent -->
    <rect x="-8" y="-30" width="16" height="4" rx="1.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8" />
  </g>

  <!-- Sparkle Accents -->
  <polygon points="76,21 77.5,17 79,21 83,22.5 79,24 77.5,28 76,24 72,22.5" fill="#FDE047" />
  <polygon points="21,68 22.5,65 24,68 27,69.5 24,71 22.5,74 21,71 18,69.5" fill="#FDE047" opacity="0.8" />
</svg>
