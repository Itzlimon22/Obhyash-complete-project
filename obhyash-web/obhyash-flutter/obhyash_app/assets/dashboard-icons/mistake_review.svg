<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="mistakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="mistakeBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <filter id="shadowMistake" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#7C2D12" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#mistakeBg)" stroke="url(#mistakeBorder)" stroke-width="3.5" filter="url(#shadowMistake)" />
  
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- Repeat / Refresh Circular Arrows -->
  <g transform="translate(50, 48)">
    <circle cx="0" cy="0" r="18" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="75 35" />
    <!-- Arrowhead 1 -->
    <polygon points="12,-16 22,-14 18,-24" fill="#FFFFFF" />
    <!-- Center Alert Mark -->
    <rect x="-2" y="-9" width="4" height="11" rx="2" fill="#FEF08A" />
    <circle cx="0" cy="7" r="2.5" fill="#FEF08A" />
  </g>
