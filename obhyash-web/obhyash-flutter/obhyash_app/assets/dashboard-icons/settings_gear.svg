<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="gearBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="gearBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadowGear" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#1E293B" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#gearBg)" stroke="url(#gearBorder)" stroke-width="3.5" filter="url(#shadowGear)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Mechanical Gear -->
  <g transform="translate(50, 48)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" />
    <!-- Teeth -->
    <rect x="-4" y="-24" width="8" height="8" rx="2" fill="#FFFFFF" />
    <rect x="-4" y="16" width="8" height="8" rx="2" fill="#FFFFFF" />
    <rect x="-24" y="-4" width="8" height="8" rx="2" fill="#FFFFFF" />
    <rect x="16" y="-4" width="8" height="8" rx="2" fill="#FFFFFF" />
    <!-- Diagonal teeth -->
    <rect x="-4" y="-24" width="8" height="8" rx="2" fill="#FFFFFF" transform="rotate(45)" />
    <rect x="-4" y="16" width="8" height="8" rx="2" fill="#FFFFFF" transform="rotate(45)" />
    <rect x="-24" y="-4" width="8" height="8" rx="2" fill="#FFFFFF" transform="rotate(45)" />
    <rect x="16" y="-4" width="8" height="8" rx="2" fill="#FFFFFF" transform="rotate(45)" />
    <!-- Center Hole -->
    <circle cx="0" cy="0" r="8" fill="#475569" />
  </g>
</svg>
