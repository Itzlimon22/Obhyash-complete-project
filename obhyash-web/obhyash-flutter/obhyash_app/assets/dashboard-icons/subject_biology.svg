<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="bioTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="bioTileBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BBF7D0" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    
    <!-- 3D Strand 1 Gradient -->
    <linearGradient id="dnaStrand1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- 3D Strand 2 Gradient -->
    <linearGradient id="dnaStrand2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Base Pair Rungs -->
    <linearGradient id="rungCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="rungRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <filter id="bioTileShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#14532D" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base 3D Tile -->
  <rect x="6" y="8" width="88" height="84" rx="26" fill="#14532D" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#bioTileBg)" stroke="url(#bioTileBorder)" stroke-width="3" filter="url(#bioTileShadow)" />
  <path d="M 16 26 C 16 16 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.25" />

  <!-- 3D DNA Helix -->
  <g transform="translate(50, 48) rotate(-22)">
    <!-- Base Pair Connecting Rungs -->
    <!-- Top Rung -->
    <line x1="-16" y1="-22" x2="0" y2="-22" stroke="url(#rungRose)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="-22" x2="16" y2="-22" stroke="url(#rungCyan)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Mid-Upper Rung -->
    <line x1="-10" y1="-11" x2="0" y2="-11" stroke="url(#rungCyan)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="-11" x2="10" y2="-11" stroke="url(#rungRose)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Center Node Cross -->
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />

    <!-- Mid-Lower Rung -->
    <line x1="-10" y1="11" x2="0" y2="11" stroke="url(#rungRose)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="11" x2="10" y2="11" stroke="url(#rungCyan)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Bottom Rung -->
    <line x1="-16" y1="22" x2="0" y2="22" stroke="url(#rungCyan)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="22" x2="16" y2="22" stroke="url(#rungRose)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Left Backbone Strand Wave -->
    <path d="M -16 -24 C -6 -12 6 -4 0 0 C -6 4 6 12 16 24" stroke="url(#dnaStrand1)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Right Backbone Strand Wave -->
    <path d="M 16 -24 C 6 -12 -6 -4 0 0 C 6 4 -6 12 -16 24" stroke="url(#dnaStrand2)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- 3D Spherical Nodes on DNA Strands -->
    <circle cx="-16" cy="-24" r="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1" />
    <circle cx="16" cy="-24" r="4" fill="#FEF08A" stroke="#CA8A04" stroke-width="1" />
    
    <circle cx="16" cy="24" r="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1" />
    <circle cx="-16" cy="24" r="4" fill="#FEF08A" stroke="#CA8A04" stroke-width="1" />
  </g>

  <!-- Sparkle -->
  <polygon points="78,22 80,18 84,18 81,15 82,11 78,14 74,11 75,15 72,18 76,18" fill="#FEF08A" />
</svg>
