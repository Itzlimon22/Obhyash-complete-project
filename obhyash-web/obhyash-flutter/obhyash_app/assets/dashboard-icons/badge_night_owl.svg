<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Outer Deep Space Purple Gradient -->
    <linearGradient id="owlShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Bevel Gold/Violet Border -->
    <linearGradient id="owlBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="30%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <!-- Moon Glow Gradient -->
    <linearGradient id="moonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Owl Body Gradient -->
    <linearGradient id="owlBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <filter id="shadowOwl" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2E1065" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2E1065" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 3D Base Outer Medallion -->
  <circle cx="100" cy="104" r="82" fill="#2E1065" />
  <circle cx="100" cy="98" r="82" fill="url(#owlShield)" stroke="url(#owlBorder)" stroke-width="7" filter="url(#shadowOwl)" />

  <!-- Inner Night Sky Orb -->
  <circle cx="100" cy="98" r="66" fill="#1E1035" stroke="#A855F7" stroke-width="2.5" />

  <!-- Glass Specular Highlight -->
  <path d="M 40 70 C 50 40 85 24 125 24 C 75 35 45 65 40 70 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- Background Stars -->
  <circle cx="68" cy="62" r="2" fill="#FDE047" />
  <circle cx="138" cy="58" r="2.5" fill="#FFFFFF" />
  <circle cx="148" cy="85" r="1.5" fill="#FDE047" />
  <polygon points="65,95 67,90 72,92 68,96 70,101 65,97 60,100 62,95 58,92 63,91" fill="#FFFFFF" opacity="0.7" transform="scale(0.5) translate(65, 85)" />

  <!-- 3D Crescent Moon & Night Owl Centerpiece -->
  <g transform="translate(100, 96)">
    <!-- 3D Crescent Moon -->
    <path d="M 16 -42 C -18 -42 -42 -16 -42 18 C -42 46 -22 68 8 68 C -14 56 -24 32 -24 12 C -24 -16 -4 -36 16 -42 Z" 
          fill="url(#moonGold)" 
          stroke="#CA8A04" 
          stroke-width="2.5" 
          filter="drop-shadow(0 4px 8px rgba(0,0,0,0.35))" />

    <!-- Owl Wings & Silhouette on Moon Branch -->
    <!-- Owl Body -->
    <ellipse cx="6" cy="12" rx="20" ry="24" fill="url(#owlBody)" stroke="#818CF8" stroke-width="2" />
    <path d="M -6 0 C -6 18 18 18 18 0 C 14 -10 -2 -10 -6 0 Z" fill="#E0E7FF" opacity="0.9" />

    <!-- Owl Face Mask -->
    <circle cx="-2" cy="-4" r="10" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5" />
    <circle cx="14" cy="-4" r="10" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5" />

    <!-- Eyes (Glowing Amber Gold) -->
    <circle cx="-2" cy="-4" r="6" fill="#F59E0B" />
    <circle cx="-2" cy="-4" r="3" fill="#1E1B4B" />
    <circle cx="-4" cy="-6" r="1.5" fill="#FFFFFF" />

    <circle cx="14" cy="-4" r="6" fill="#F59E0B" />
    <circle cx="14" cy="-4" r="3" fill="#1E1B4B" />
    <circle cx="12" cy="-6" r="1.5" fill="#FFFFFF" />

    <!-- Owl Beak -->
    <polygon points="6,2 3,9 9,9" fill="#F59E0B" stroke="#B45309" stroke-width="1" />

    <!-- Owl Ear Tufts -->
    <polygon points="-12,-16 -4,-28 -2,-12" fill="#4F46E5" />
    <polygon points="24,-16 16,-28 14,-12" fill="#4F46E5" />

    <!-- Perch branch with talons -->
    <path d="M -22 36 C -5 32 20 34 38 42" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="34" r="2.5" fill="#F59E0B" />
    <circle cx="5" cy="34" r="2.5" fill="#F59E0B" />
    <circle cx="12" cy="34" r="2.5" fill="#F59E0B" />
  </g>
</svg>
