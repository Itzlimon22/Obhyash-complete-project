<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="bellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="bellBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <filter id="shadowBell" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#713F12" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="6" y="8" width="88" height="84" rx="26" fill="#713F12" />
  <rect x="6" y="6" width="88" height="84" rx="26" fill="url(#bellBg)" stroke="url(#bellBorder)" stroke-width="3.5" filter="url(#shadowBell)" />
  <path d="M 16 28 C 16 18 24 10 36 10 L 64 10 C 30 14 16 34 16 54 Z" fill="#FFFFFF" opacity="0.22" />

  <!-- 3D Bell Illustration -->
  <g transform="translate(50, 48)">
    <!-- Bell Dome -->
    <path d="M -4 -16 C -4 -20 4 -20 4 -16 C 4 -12 16 -4 16 12 L -16 12 C -16 -4 -4 -12 -4 -16 Z" fill="#FFFFFF" />
    <!-- Bell Bottom Rim -->
    <rect x="-20" y="12" width="40" height="6" rx="3" fill="#FEF08A" />
    <!-- Clapper -->
    <circle cx="0" cy="20" r="4.5" fill="#FEF08A" />
  </g>
</svg>
