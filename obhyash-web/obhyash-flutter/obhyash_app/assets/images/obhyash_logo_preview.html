<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obhyash App Logo Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030705;
      color: #FFFFFF;
      font-family: 'Hind Siliguri', 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF, #A7F3D0, #FB7185);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: #94A3B8;
      font-size: 15px;
      margin-top: 6px;
    }
    .logo-stage {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 32px;
      max-width: 900px;
    }
    .card {
      background: #08110D;
      border: 1px solid #162C22;
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.7);
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #34D399;
      margin-top: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .main-logo {
      width: 320px;
      height: 320px;
    }
    .medium-logo {
      width: 160px;
      height: 160px;
    }
    .small-logo {
      width: 80px;
      height: 80px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>অভ্যাস (Obhyash) • The Infinity Loop of Habit</h1>
    <p>Deepest Midnight Forest Green Background • Pure White • Deep Crimson • Emerald Accents</p>
  </div>

  <div class="logo-stage">
    <div class="card">
      <img src="obhyash_logo.svg" alt="Obhyash App Icon 512px" class="main-logo">
      <div class="card-title">Large App Icon (512x512)</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 24px;">
      <div class="card">
        <img src="obhyash_logo.svg" alt="Obhyash App Icon 160px" class="medium-logo">
        <div class="card-title">Home Screen (160x160)</div>
      </div>
      <div class="card">
        <img src="obhyash_logo.svg" alt="Obhyash App Icon 80px" class="small-logo">
        <div class="card-title">Dock / Favicon (80x80)</div>
      </div>
    </div>
  </div>
</body>
</html>
