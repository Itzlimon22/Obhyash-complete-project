<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Obhyash (অভ্যাস) - Brand Logo Preview</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #090e0b;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 8px;
      color: #c5f724;
      font-size: 28px;
    }
    p {
      color: #94a3b8;
      margin-top: 0;
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1000px;
      width: 100%;
    }
    .card {
      background: #131c17;
      border: 1px solid #1f3328;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-title {
      font-size: 15px;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .logo-container {
      width: 180px;
      height: 180px;
    }
    .logo-sm {
      width: 72px;
      height: 72px;
    }
  </style>
</head>
<body>

  <h1>Obhyash (অভ্যাস) Logo Variations</h1>
  <p>Isometric Origami Ribbon Design for Obhyash Education App</p>

  <div class="grid">
    <div class="card">
      <div class="card-title">Main App Icon (512x512)</div>
      <div class="logo-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
          <defs>
            <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
              <stop offset="0%" stop-color="#0E2D1F" />
              <stop offset="60%" stop-color="#061911" />
              <stop offset="100%" stop-color="#020B07" />
            </radialGradient>
            <linearGradient id="facetTop" x1="20%" y1="0%" x2="80%" y2="100%">
              <stop offset="0%" stop-color="#F2FF59" />
              <stop offset="100%" stop-color="#C5F724" />
            </linearGradient>
            <linearGradient id="facetBottom" x1="80%" y1="100%" x2="20%" y2="0%">
              <stop offset="0%" stop-color="#E8FF42" />
              <stop offset="100%" stop-color="#B2F219" />
            </linearGradient>
            <linearGradient id="facetLeft" x1="100%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#B2F219" />
              <stop offset="100%" stop-color="#72D612" />
            </linearGradient>
            <linearGradient id="innerShadow1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#092B1B" />
              <stop offset="100%" stop-color="#04150D" />
            </linearGradient>
            <linearGradient id="innerShadow2" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#0D3521" />
              <stop offset="100%" stop-color="#05180E" />
            </linearGradient>
            <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="-2" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
            </filter>
          </defs>
          <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
          <circle cx="256" cy="256" r="140" fill="#80E61A" opacity="0.12" filter="blur(40px)" />
          <g>
            <path d="M 256,136 L 356,236 L 306,286 L 256,236 Z" fill="url(#innerShadow1)" />
            <path d="M 256,376 L 156,276 L 206,226 L 256,276 Z" fill="url(#innerShadow2)" />
            <path d="M 198,162 C 186,146 160,154 142,180 L 116,218 C 100,240 100,272 116,294 L 174,374 C 188,394 212,398 230,384 L 282,342 L 194,254 Z" fill="url(#facetLeft)" filter="url(#foldShadow)" />
            <path d="M 230,384 L 304,384 C 328,384 350,370 362,350 L 396,294 C 412,268 406,238 384,222 L 318,174 L 256,236 L 312,292 L 282,342 Z" fill="url(#facetBottom)" />
            <path d="M 204,136 C 214,126 232,120 256,120 L 326,120 C 350,120 372,134 384,154 L 404,188 C 418,212 412,240 392,256 L 338,298 L 256,216 L 336,156 L 242,156 C 222,156 208,148 204,136 Z" fill="url(#facetTop)" filter="url(#foldShadow)" />
            <path d="M 256,216 L 306,266 L 256,316 L 206,266 Z" fill="#D6FF38" opacity="0.95" />
          </g>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Small App Icon Badge (72x72)</div>
      <div class="logo-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
          <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
          <g>
            <path d="M 256,136 L 356,236 L 306,286 L 256,236 Z" fill="url(#innerShadow1)" />
            <path d="M 256,376 L 156,276 L 206,226 L 256,276 Z" fill="url(#innerShadow2)" />
            <path d="M 198,162 C 186,146 160,154 142,180 L 116,218 C 100,240 100,272 116,294 L 174,374 C 188,394 212,398 230,384 L 282,342 L 194,254 Z" fill="url(#facetLeft)" />
            <path d="M 230,384 L 304,384 C 328,384 350,370 362,350 L 396,294 C 412,268 406,238 384,222 L 318,174 L 256,236 L 312,292 L 282,342 Z" fill="url(#facetBottom)" />
            <path d="M 204,136 C 214,126 232,120 256,120 L 326,120 C 350,120 372,134 384,154 L 404,188 C 418,212 412,240 392,256 L 338,298 L 256,216 L 336,156 L 242,156 C 222,156 208,148 204,136 Z" fill="url(#facetTop)" />
            <path d="M 256,216 L 306,266 L 256,316 L 206,266 Z" fill="#D6FF38" />
          </g>
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
