<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gst_grad" x1="40" y1="50" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8" />
      <stop offset="1" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="gst_shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#gst_shadow)">
    <!-- Connected Network Lines in background -->
    <line x1="60" y1="90" x2="100" y2="60" stroke="#C7D2FE" stroke-width="2.5" stroke-dasharray="4 3" />
    <line x1="100" y1="60" x2="140" y2="90" stroke="#C7D2FE" stroke-width="2.5" stroke-dasharray="4 3" />
    <line x1="60" y1="130" x2="100" y2="155" stroke="#C7D2FE" stroke-width="2.5" stroke-dasharray="4 3" />
    <line x1="100" y1="155" x2="140" y2="130" stroke="#C7D2FE" stroke-width="2.5" stroke-dasharray="4 3" />

    <!-- Center Main Campus Dome Building -->
    <!-- Dome Base -->
    <rect x="75" y="95" width="50" height="70" rx="4" fill="url(#gst_grad)" stroke="#3730A3" stroke-width="2" />
    <!-- Pillars on facade -->
    <rect x="83" y="115" width="6" height="50" fill="#E0E7FF" rx="1" />
    <rect x="97" y="115" width="6" height="50" fill="#E0E7FF" rx="1" />
    <rect x="111" y="115" width="6" height="50" fill="#E0E7FF" rx="1" />
    <!-- Dome Roof -->
    <path d="M72,95 C72,65 128,65 128,95 Z" fill="#4338CA" />
    <circle cx="100" cy="55" r="5" fill="#FBBF24" />
    <line x1="100" y1="60" x2="100" y2="70" stroke="#FBBF24" stroke-width="2" />

    <!-- Left Satellite Campus Tower -->
    <rect x="38" y="110" width="30" height="55" rx="3" fill="#6366F1" stroke="#3730A3" stroke-width="1.5" />
    <polygon points="36,110 53,88 70,110" fill="#4F46E5" />
    <circle cx="53" cy="84" r="3" fill="#FDE047" />
    <!-- Windows -->
    <rect x="44" y="120" width="6" height="10" rx="1" fill="#FEF08A" />
    <rect x="56" y="120" width="6" height="10" rx="1" fill="#FEF08A" />
    <rect x="44" y="136" width="6" height="10" rx="1" fill="#FEF08A" />
    <rect x="56" y="136" width="6" height="10" rx="1" fill="#FEF08A" />

    <!-- Right Satellite Campus Tower -->
    <rect x="132" y="110" width="30" height="55" rx="3" fill="#6366F1" stroke="#3730A3" stroke-width="1.5" />
    <polygon points="130,110 147,88 164,110" fill="#4F46E5" />
    <circle cx="147" cy="84" r="3" fill="#FDE047" />
    <!-- Windows -->
    <rect x="138" y="120" width="6" height="10" rx="1" fill="#FEF08A" />
    <rect x="150" y="120" width="6" height="10" rx="1" fill="#FEF08A" />
    <rect x="138" y="136" width="6" height="10" rx="1" fill="#FEF08A" />
    <rect x="150" y="136" width="6" height="10" rx="1" fill="#FEF08A" />

    <!-- Base Plinth / Steps -->
    <rect x="30" y="165" width="140" height="12" rx="3" fill="#312E81" />

    <!-- Network Hub Node Badges (GST 24 Cluster universities indicator) -->
    <g transform="translate(100, 165)">
      <circle cx="0" cy="0" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
      <text x="0" y="4" font-size="9" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" text-anchor="middle">24</text>
    </g>
  </g>
</svg>
