<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="vkha_grad" x1="40" y1="60" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F43F5E" />
      <stop offset="1" stop-color="#BE123C" />
    </linearGradient>
    <filter id="vkha_shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#vkha_shadow)">
    <!-- University Pillars & Pediment (Background) -->
    <!-- Triangular Pediment -->
    <polygon points="100,45 165,80 35,80" fill="#FCE7F3" stroke="#DB2777" stroke-width="2" />
    <!-- Pediment inner crest -->
    <circle cx="100" cy="67" r="7" fill="#F43F5E" />

    <!-- Architrave / Entablature -->
    <rect x="30" y="80" width="140" height="10" rx="2" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5" />

    <!-- Columns (Pillars) -->
    <rect x="42" y="90" width="14" height="60" rx="2" fill="#FDF2F8" stroke="#F472B6" stroke-width="1.5" />
    <rect x="76" y="90" width="14" height="60" rx="2" fill="#FDF2F8" stroke="#F472B6" stroke-width="1.5" />
    <rect x="110" y="90" width="14" height="60" rx="2" fill="#FDF2F8" stroke="#F472B6" stroke-width="1.5" />
    <rect x="144" y="90" width="14" height="60" rx="2" fill="#FDF2F8" stroke="#F472B6" stroke-width="1.5" />

    <!-- Base Steps -->
    <rect x="25" y="150" width="150" height="12" rx="2" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5" />
    <rect x="18" y="162" width="164" height="12" rx="3" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5" />

    <!-- Open Literature Book in Front -->
    <g transform="translate(0, 10)">
      <path d="M100,128 C85,122 55,122 45,128 L45,162 C55,156 85,156 100,162 Z" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5" />
      <path d="M100,128 C115,122 145,122 155,128 L155,162 C145,156 115,156 100,162 Z" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5" />
      <line x1="100" y1="128" x2="100" y2="162" stroke="#BE123C" stroke-width="2" />
      <!-- Book Lines -->
      <line x1="55" y1="135" x2="88" y2="135" stroke="#FDA4AF" stroke-width="1.5" stroke-linecap="round" />
      <line x1="55" y1="143" x2="90" y2="143" stroke="#FDA4AF" stroke-width="1.5" stroke-linecap="round" />
      <line x1="55" y1="151" x2="82" y2="151" stroke="#FDA4AF" stroke-width="1.5" stroke-linecap="round" />

      <line x1="110" y1="135" x2="145" y2="135" stroke="#FDA4AF" stroke-width="1.5" stroke-linecap="round" />
      <line x1="110" y1="143" x2="145" y2="143" stroke="#FDA4AF" stroke-width="1.5" stroke-linecap="round" />
      <line x1="118" y1="151" x2="145" y2="151" stroke="#FDA4AF" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Feather Quill Pen -->
    <path d="M125,120 Q145,95 160,80 Q155,100 138,125 L135,130 Z" fill="#FB7185" />
    <path d="M135,130 L132,135 L138,132 Z" fill="#881337" />
  </g>
</svg>
