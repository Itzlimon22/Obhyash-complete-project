<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="med_scope" x1="80" y1="50" x2="150" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2E8F0" />
      <stop offset="0.5" stop-color="#94A3B8" />
      <stop offset="1" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="med_lens" x1="100" y1="90" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="med_plant" x1="45" y1="120" x2="75" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EA580C" />
      <stop offset="1" stop-color="#C2410C" />
    </linearGradient>
    <filter id="med_shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#med_shadow)">
    <!-- Medical Books Stack at Bottom Left -->
    <polygon points="120,155 170,155 185,142 135,142" fill="#E2E8F0" />
    <path d="M115,150 Q115,162 125,162 L175,162 L188,145 L184,140 L125,140 Q115,140 115,150 Z" fill="#0284C7" />
    <path d="M120,162 Q120,172 130,172 L178,172 L190,158 L185,154 L130,154 Q120,154 120,162 Z" fill="#F59E0B" />

    <!-- Terracotta Specimen Plant Pot (Biology Lab) -->
    <path d="M48,135 L76,135 L71,170 Q70,174 65,174 L59,174 Q54,174 53,170 Z" fill="url(#med_plant)" />
    <ellipse cx="62" cy="135" rx="14" ry="4" fill="#F97316" />
    <!-- Leaves -->
    <path d="M62,135 C50,118 40,105 52,95 C62,105 63,122 62,135 Z" fill="#22C55E" />
    <path d="M62,135 C68,115 80,100 85,110 C82,125 72,132 62,135 Z" fill="#16A34A" />
    <path d="M62,135 C58,110 65,85 75,88 C76,105 68,122 62,135 Z" fill="#4ADE80" />

    <!-- Laboratory Microscope (Hero Center) -->
    <!-- Base Plate -->
    <path d="M90,172 Q88,178 98,178 L148,178 Q158,178 156,172 L144,164 Q142,160 135,160 L108,160 Q101,160 99,164 Z" fill="#334155" />
    <ellipse cx="123" cy="160" rx="14" ry="4" fill="#0284C7" />

    <!-- Curved Arm Stand -->
    <path d="M136,160 Q150,140 146,105 Q144,80 130,70 L120,70 Q132,85 132,105 Q134,135 124,155 Z" fill="url(#med_scope)" />

    <!-- Coarse Adjustment Knob -->
    <circle cx="140" cy="115" r="8" fill="#64748B" stroke="#334155" stroke-width="2" />
    <circle cx="140" cy="115" r="4" fill="#CBD5E1" />

    <!-- Stage Platform -->
    <rect x="94" y="132" width="38" height="6" rx="2" fill="#1E293B" />
    <!-- Slide Glass -->
    <rect x="100" y="130" width="24" height="3" rx="1" fill="#38BDF8" opacity="0.8" />
    <!-- Stage Clips -->
    <rect x="97" y="130" width="4" height="2" rx="0.5" fill="#CBD5E1" />
    <rect x="123" y="130" width="4" height="2" rx="0.5" fill="#CBD5E1" />

    <!-- Objective Lenses & Revolving Nosepiece -->
    <path d="M102,108 L122,108 L118,115 L106,115 Z" fill="#475569" />
    <!-- Lenses pointing down -->
    <rect x="108" y="115" width="6" height="11" rx="1" fill="url(#med_lens)" />
    <rect x="116" y="115" width="5" height="8" rx="1" fill="#94A3B8" />

    <!-- Optical Tube -->
    <g transform="rotate(-20 114 85)">
      <rect x="108" y="55" width="14" height="42" rx="3" fill="url(#med_scope)" stroke="#64748B" stroke-width="1.5" />
      <!-- Eyepiece / Ocular Lens -->
      <rect x="105" y="42" width="20" height="14" rx="2" fill="#1E293B" />
      <rect x="107" y="38" width="16" height="5" rx="1.5" fill="#0284C7" />
    </g>

    <!-- DNA Helix / Sparkle Accents -->
    <circle cx="168" cy="65" r="2.5" fill="#38BDF8" />
    <circle cx="178" cy="80" r="3" fill="#F59E0B" />
    <circle cx="162" cy="92" r="2" fill="#34D399" />
  </g>
</svg>
