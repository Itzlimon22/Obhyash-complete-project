<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="tab_body" x1="50" y1="40" x2="150" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#475569" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="tab_screen" x1="60" y1="50" x2="140" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" />
      <stop offset="1" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="tab_bar" x1="70" y1="150" x2="130" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="mcq_shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#mcq_shadow)">
    <!-- Slanted / 3D Isometric Tablet -->
    <g transform="rotate(-8 100 105)">
      <!-- Tablet Outer Shadow/Side Bezel -->
      <rect x="52" y="32" width="96" height="136" rx="14" fill="#0F172A" />
      <!-- Tablet Main Frame -->
      <rect x="50" y="30" width="96" height="136" rx="14" fill="url(#tab_body)" stroke="#64748B" stroke-width="2" />

      <!-- Screen -->
      <rect x="58" y="38" width="80" height="120" rx="8" fill="url(#tab_screen)" stroke="#CBD5E1" stroke-width="1.5" />

      <!-- Top Header Card / Question Banner -->
      <rect x="64" y="46" width="68" height="26" rx="4" fill="#C084FC" opacity="0.35" />
      <rect x="68" y="52" width="42" height="4" rx="2" fill="#7E22CE" />
      <rect x="68" y="59" width="30" height="3" rx="1.5" fill="#9333EA" opacity="0.7" />

      <!-- Big Question Mark Badge -->
      <circle cx="120" cy="59" r="8" fill="#7E22CE" />
      <text x="120" y="63" font-size="11" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" text-anchor="middle">?</text>

      <!-- MCQ Option 1 (Checked Option) -->
      <rect x="64" y="79" width="68" height="14" rx="3" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.2" />
      <circle cx="72" cy="86" r="4" fill="#22C55E" />
      <polyline points="70,86 71.5,88 74,84" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="80" y="84" width="46" height="3.5" rx="1.5" fill="#15803D" />

      <!-- MCQ Option 2 -->
      <rect x="64" y="97" width="68" height="14" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <circle cx="72" cy="104" r="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
      <rect x="80" y="102.5" width="42" height="3" rx="1.5" fill="#64748B" />

      <!-- MCQ Option 3 -->
      <rect x="64" y="115" width="68" height="14" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <circle cx="72" cy="122" r="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
      <rect x="80" y="120.5" width="48" height="3" rx="1.5" fill="#64748B" />

      <!-- Bottom Progress Bar -->
      <rect x="64" y="137" width="68" height="5" rx="2.5" fill="#CBD5E1" />
      <rect x="64" y="137" width="48" height="5" rx="2.5" fill="url(#tab_bar)" />
      <circle cx="112" cy="139.5" r="3.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1" />

      <!-- Left / Right Pagination Chevrons -->
      <polyline points="63,90 61,92 63,94" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
      <polyline points="133,90 135,92 133,94" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Stylus Pen resting on right side -->
    <g transform="rotate(25 158 120)">
      <rect x="150" y="60" width="6" height="75" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
      <polygon points="150,135 153,144 156,135" fill="#334155" />
      <circle cx="153" cy="65" r="2" fill="#3B82F6" />
    </g>
  </g>
</svg>
