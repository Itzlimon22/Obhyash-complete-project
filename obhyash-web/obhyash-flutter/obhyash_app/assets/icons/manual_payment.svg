<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background / Phone Gradients -->
    <linearGradient id="phoneGrad" x1="28" y1="16" x2="100" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="36" y1="24" x2="92" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Send Money / Origami Arrow Facets (Google Play / bKash style) -->
    <linearGradient id="wingTop" x1="42" y1="46" x2="88" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="wingRight" x1="88" y1="34" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wingFold" x1="42" y1="46" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="wingUnder" x1="58" y1="56" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Golden Taka / Checkmark Badge -->
    <linearGradient id="badgeGrad" x1="74" y1="74" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="badgeShadow" x="66" y="68" width="56" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Smartphone Base Frame -->
  <rect x="26" y="14" width="76" height="100" rx="16" fill="url(#phoneGrad)"/>
  <rect x="27" y="15" width="74" height="98" rx="15" stroke="#334155" stroke-width="2"/>

  <!-- Phone Screen -->
  <rect x="32" y="22" width="64" height="84" rx="10" fill="url(#screenGrad)"/>

  <!-- Screen Grid / Signal / Network dots subtle glow -->
  <circle cx="64" cy="18" r="1.75" fill="#475569"/>
  <path d="M46 29C46 29 54 27 64 27C74 27 82 29 82 29" stroke="#065F46" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic Send-Money Origami Paperplane (Faceted like bKash/Play Store logo) -->
  <!-- Under fold shadow -->
  <path d="M58 56L68 76L64 54Z" fill="url(#wingUnder)"/>
  
  <!-- Left Main Wing -->
  <path d="M42 46L88 34L58 56Z" fill="url(#wingTop)"/>

  <!-- Right/Lower Wing -->
  <path d="M88 34L68 76L58 56Z" fill="url(#wingRight)"/>

  <!-- Center Crease Highlight -->
  <path d="M42 46L58 56L68 76Z" fill="url(#wingFold)"/>

  <!-- Trx Paper Trail / Motion Dash Lines -->
  <path d="M38 60L46 54" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
  <path d="M42 68L50 62" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>

  <!-- Floating Verified Taka (৳) & Trx Seal Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="94" cy="94" r="20" fill="url(#badgeGrad)"/>
    <circle cx="94" cy="94" r="18.5" stroke="#FEF08A" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Bengali Taka (৳) Symbol or Verification Checkmark -->
    <path d="M86 94.5L91.5 100L102 88.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
