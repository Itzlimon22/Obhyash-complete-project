<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Outer Shield Gradient (Rich Gold & Flame Amber) -->
    <linearGradient id="goldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <filter id="bigShadowWarrior" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#78350F" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base 3D Crest Shadow -->
  <path d="M 100 12 L 176 46 C 176 116 142 168 100 188 C 58 168 24 116 24 46 Z" fill="#451A03" />

  <!-- Outer Shield Frame with Gold Border -->
  <path d="M 100 8 L 176 42 C 176 112 142 164 100 184 C 58 164 24 112 24 42 Z" 
        fill="url(#goldShield)" 
        stroke="url(#goldBorder)" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#bigShadowWarrior)" />

  <!-- Inner Inset Shield -->
  <path d="M 100 22 L 162 50 C 162 106 134 148 100 166 C 66 148 38 106 38 50 Z" 
        fill="#78350F" 
        stroke="#CA8A04" 
        stroke-width="3" />

  <!-- Top Glass Highlight Specular -->
  <path d="M 100 22 L 162 50 C 162 76 150 102 130 114 C 100 86 64 66 38 50 Z" 
        fill="#FFFFFF" 
        opacity="0.35" />

  <!-- Center Metallic Medallion -->
  <circle cx="100" cy="100" r="46" fill="#B45309" stroke="#FEF08A" stroke-width="4" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
  <circle cx="100" cy="100" r="37" fill="#451A03" />

  <!-- Flaming Warrior Crest -->
  <g transform="translate(100, 100)">
    <!-- Back Fiery Aura -->
    <path d="M 0 -30 C 16 -18 24 -4 22 14 C 20 26 0 30 0 30 C 0 30 -20 26 -22 14 C -24 -4 -16 -18 0 -30 Z" fill="url(#flameGrad)" />
    
    <!-- Greatsword Blade (Vertical) -->
    <polygon points="-4.5,-35 4.5,-35 5.5,18 -5.5,18" fill="#FFFFFF" />
    <polygon points="0,-42 4.5,-35 -4.5,-35" fill="#FEF08A" />
    <line x1="0" y1="-38" x2="0" y2="18" stroke="#CA8A04" stroke-width="1.8" />
    
    <!-- Sword Crossguard -->
    <rect x="-16" y="18" width="32" height="5.5" rx="2" fill="#FEF08A" />
    <!-- Sword Grip & Pommel -->
    <rect x="-3.5" y="23.5" width="7" height="9" rx="1" fill="#78350F" />
    <circle cx="0" cy="35" r="4" fill="#FEF08A" />
    <!-- Ruby Gem in Guard -->
    <circle cx="0" cy="20.5" r="2.5" fill="#EF4444" />
  </g>
</svg>
