<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Outer Shield Gradient (Silver & Electric Cyan) -->
    <linearGradient id="silverShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#BAE6FD" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <filter id="bigShadowScout" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#082F49" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#082F49" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base 3D Crest Shadow -->
  <path d="M 100 12 L 176 46 C 176 116 142 168 100 188 C 58 168 24 116 24 46 Z" fill="#082F49" />

  <!-- Outer Shield Frame with Silver/Cyan Border -->
  <path d="M 100 8 L 176 42 C 176 112 142 164 100 184 C 58 164 24 112 24 42 Z" 
        fill="url(#silverShield)" 
        stroke="url(#silverBorder)" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#bigShadowScout)" />

  <!-- Inner Inset Shield -->
  <path d="M 100 22 L 162 50 C 162 106 134 148 100 166 C 66 148 38 106 38 50 Z" 
        fill="#075985" 
        stroke="#0284C7" 
        stroke-width="3" />

  <!-- Top Glass Highlight Specular -->
  <path d="M 100 22 L 162 50 C 162 76 150 102 130 114 C 100 86 64 66 38 50 Z" 
        fill="#FFFFFF" 
        opacity="0.35" />

  <!-- Center Metallic Medallion -->
  <circle cx="100" cy="100" r="46" fill="#0369A1" stroke="#BAE6FD" stroke-width="4" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
  <circle cx="100" cy="100" r="37" fill="#0C4A6E" />

  <!-- Dual Crossed Scout Blades -->
  <g transform="translate(100, 100)">
    <!-- Blade 1 (Diagonal Left) -->
    <g transform="rotate(-45)">
      <polygon points="-3,-28 3,-28 4,16 -4,16" fill="url(#bladeGrad)" />
      <polygon points="0,-35 3,-28 -3,-28" fill="#FFFFFF" />
      <rect x="-9" y="16" width="18" height="4.5" rx="1.5" fill="#38BDF8" />
      <rect x="-3" y="20.5" width="6" height="9" rx="1" fill="#BAE6FD" />
      <circle cx="0" cy="31" r="3" fill="#38BDF8" />
    </g>
    <!-- Blade 2 (Diagonal Right) -->
    <g transform="rotate(45)">
      <polygon points="-3,-28 3,-28 4,16 -4,16" fill="url(#bladeGrad)" />
      <polygon points="0,-35 3,-28 -3,-28" fill="#FFFFFF" />
      <rect x="-9" y="16" width="18" height="4.5" rx="1.5" fill="#38BDF8" />
      <rect x="-3" y="20.5" width="6" height="9" rx="1" fill="#BAE6FD" />
      <circle cx="0" cy="31" r="3" fill="#38BDF8" />
    </g>
    <!-- Center Crystal Jewel -->
    <polygon points="0,-10 9,0 0,10 -9,0" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2.5" />
    <!-- Sparkle Stars -->
    <polygon points="0,-18 2,-14 6,-14 3,-11 4,-7 0,-9 -4,-7 -3,-11 -6,-14 -2,-14" fill="#FFFFFF" />
  </g>
</svg>
