<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Outer Shield Gradient (Mythic Crimson Ruby & Gold) -->
    <linearGradient id="legendShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="40%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="imperialGoldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="diamondCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="bigShadowLegend" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4C0519" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Radiant Golden Halo Rays -->
  <g transform="translate(100, 100)" opacity="0.45" stroke="#FDE047" stroke-width="2.5" stroke-dasharray="4 8">
    <circle cx="0" cy="0" r="76" />
    <line x1="0" y1="-84" x2="0" y2="-75" />
    <line x1="60" y1="-60" x2="53" y2="-53" />
    <line x1="84" y1="0" x2="75" y2="0" />
    <line x1="60" y1="60" x2="53" y2="53" />
    <line x1="0" y1="84" x2="0" y2="75" />
    <line x1="-60" y1="60" x2="-53" y2="53" />
    <line x1="-84" y1="0" x2="-75" y2="0" />
    <line x1="-60" y1="-60" x2="-53" y2="-53" />
  </g>

  <!-- Base 3D Crest Shadow -->
  <path d="M 100 12 L 178 46 C 178 118 144 172 100 192 C 56 172 22 118 22 46 Z" fill="#4C0519" />

  <!-- Outer Shield Frame with Imperial Gold 3D Border -->
  <path d="M 100 8 L 178 42 C 178 114 144 168 100 188 C 56 168 22 114 22 42 Z" 
        fill="url(#legendShield)" 
        stroke="url(#imperialGoldBorder)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#bigShadowLegend)" />

  <!-- Inner Inset Shield -->
  <path d="M 100 22 L 164 50 C 164 108 136 150 100 168 C 64 150 36 108 36 50 Z" 
        fill="#881337" 
        stroke="#EAB308" 
        stroke-width="3.5" />

  <!-- Top Glass Highlight Specular -->
  <path d="M 100 22 L 164 50 C 164 76 152 104 132 116 C 100 86 64 66 36 50 Z" 
        fill="#FFFFFF" 
        opacity="0.38" />

  <!-- Golden Laurel Wreath Leaves (Left & Right) -->
  <g transform="translate(100, 100)" fill="#FACC15">
    <!-- Left Leaves -->
    <path d="M -38 15 C -50 7 -48 -16 -36 -27 C -40 -15 -34 -2 -25 4 Z" opacity="0.9" />
    <path d="M -44 -2 C -52 -13 -48 -30 -36 -36 C -38 -25 -32 -15 -25 -9 Z" opacity="0.85" />
    <!-- Right Leaves -->
    <path d="M 38 15 C 50 7 48 -16 36 -27 C 40 -15 34 -2 25 4 Z" opacity="0.9" />
    <path d="M 44 -2 C 52 -13 48 -30 36 -36 C 38 -25 32 -15 25 -9 Z" opacity="0.85" />
  </g>

  <!-- Center Metallic Medallion -->
  <circle cx="100" cy="100" r="46" fill="#9F1239" stroke="#FEF08A" stroke-width="4" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.4))" />
  <circle cx="100" cy="100" r="37" fill="#4C0519" />

  <!-- Imperial Mythic Crown & Diamond Jewels -->
  <g transform="translate(100, 100)">
    <!-- Crown Body -->
    <path d="M -24 15 L 24 15 L 22 -11 L 11 2 L 0 -20 L -11 2 L -22 -11 Z" fill="url(#diamondCrown)" stroke="#FFFBEB" stroke-width="2" />
    
    <!-- Large Radiant Diamond Jewels on Peaks -->
    <circle cx="0" cy="-20" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8" />
    <circle cx="-22" cy="-11" r="4" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="22" cy="-11" r="4" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Crown Base Velvet Band with Gems -->
    <rect x="-24" y="15" width="48" height="7.5" rx="2" fill="#EAB308" stroke="#FFFBEB" stroke-width="1" />
    <circle cx="-15" cy="18.5" r="2.2" fill="#38BDF8" />
    <circle cx="0" cy="18.5" r="2.8" fill="#EF4444" />
    <circle cx="15" cy="18.5" r="2.8" fill="#38BDF8" />

    <!-- Top Sparkle Star -->
    <polygon points="0,-30 2.5,-25 8,-25 3.5,-21 5.5,-16 0,-19 -5.5,-16 -3.5,-21 -8,-25 -2.5,-25" fill="#FFFFFF" />
  </g>
</svg>
