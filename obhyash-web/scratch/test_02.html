iv><div class=\"ln\">১৯৭১ সালের এই দিনে জাতির পিতা বঙ্গবন্ধু শেখ মুজিবুর রহমান বাংলাদেশের স্বাধীনতা ঘোষণা করেন।</div><div class=\"ln\">অন্যদিকে, ১৬ই ডিসেম্বর হলো &#39;বিজয় দিবস&#39;, ৭ই মার্চ ঐতিহাসিক ভাষণ দিবস এবং ১৭ই এপ্রিল &#39;মুজিবনগর দিবস&#39; হিসেবে পালিত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৬</span>নিউইয়র্কের ম্যাডিসন স্কয়ারে বাংলাদেশের জন্য গান গেয়েছেন?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> বব ডিলান<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> অ্যালেন গিনসবার্গ</div><div class=\"op\"><b>গ.</b> জেয়াস বেজ</div><div class=\"op\"><b>ঘ.</b> জন টেলার</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৯৭১ সালের ১ আগস্ট নিউইয়র্কের ম্যাডিসন স্কয়ার গার্ডেনে বাংলাদেশের স্বাধীনতা যুদ্ধের সমর্থনে এবং শরণার্থীদের সাহায্যার্থে ঐতিহাসিক &quot;কনসার্ট ফর বাংলাদেশ&quot; অনুষ্ঠিত হয়।</div><div class=\"ln\">জর্জ হ্যারিসন এবং পণ্ডিত রবি শঙ্করের উদ্যোগে আয়োজিত এই কনসার্টে বিখ্যাত মার্কিন লোকসংগীত শিল্পী বব ডিলান (Bob Dylan) বাংলাদেশের জন্য গান গেয়েছিলেন।</div><div class=\"ln\">অন্যদিকে, অ্যালেন গিনসবার্গ বাংলাদেশের মুক্তিযুদ্ধের পটভূমিতে তাঁর বিখ্যাত &quot;সেপ্টেম্বর অন যশোর রোড&quot; কবিতাটি রচনা করেছিলেন।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৭</span>জাংশন প্রান্টারের সৃষ্ট অভ্যন্তরীণ বিভব পার্থক্য কত?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> 0-1 V</div><div class=\"op\"><b>খ.</b> 0.1-0.3 V</div><div class=\"op ok\"><b>গ.</b> 0.3-0.7 V<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> 2-4 V</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> একটি p-n জাংশন ডায়োড তৈরি করার পর জাংশন অঞ্চলে একটি বিভব প্রাচীর বা অভ্যন্তরীণ বিভব পার্থক্য (Potential barrier) সৃষ্টি হয়।</div><div class=\"ln\">ব্যবহৃত অর্ধপরিবাহী ভেদে এই বিভবের মান ভিন্ন হয়।</div><div class=\"ln\">জার্মেনিয়াম (Ge) ডায়োডের জন্য এই বিভব প্রাচীর প্রায় 0.3 V এবং সিলিকন (Si) ডায়োডের জন্য এটি প্রায় 0.7 V হয়।</div><div class=\"ln\">সুতরাং, জাংশন প্রান্তরে সৃষ্ট অভ্যন্তরীণ বিভব পার্থক্য সাধারণত ০.৩ থেকে ০.৭ ভোল্ট (0.3-0.7 V) সীমার মধ্যে থাকে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৮</span>কোন মতবাদ কেমিঅসমোটিক মডেলের ভিত্তিতে প্রতিষ্ঠিত?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Ion exchange theory</div><div class=\"op\"><b>খ.</b> Diffusion theory</div><div class=\"op\"><b>গ.</b> Lundegarth theory</div><div class=\"op smo ok\"><b>ঘ.</b> Proton-Anion co-transport theory<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> উদ্ভিদ শারীরতত্ত্বে খনিজ লবণ পরিশোষণের সক্রিয় শোষণ মতবাদগুলোর মধ্যে অন্যতম হলো &quot;প্রোটন-অ্যানায়ন কো-ট্রান্সপোর্ট মতবাদ&quot; (Proton-Anion co-transport theory)।</div><div class=\"ln\">এই মতবাদটি বিজ্ঞানী পিটার মিচেল (Peter Mitchell, 1961)-এর নোবেলজয়ী &quot;কেমিঅসমোটিক মডেল&quot; (Chemiosmotic model)-এর ওপর ভিত্তি করে প্রতিষ্ঠিত।</div><div class=\"ln\">এই মডেল অনুযায়ী কোষঝিল্লির ভেতরের দিক থেকে বাইরে প্রোটন (H+) পাম্প করার মাধ্যমে সৃষ্ট ইলেক্ট্রোকেমিক্যাল গ্রেডিয়েন্ট বা প্রোটন মোটিভ ফোর্সের প্রভাবে অ্যানায়ন ও ক্যাটায়ন কো-ট্রান্সপোর্টার প্রোটিনের মাধ্যমে কোষে প্রবেশ করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৯</span>কোন উদ্ভিদে marginal অমরবিন্যাস দেখা যায়?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> শিম (Lablab purpureus)<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>খ.</b> জবা (Hibiscus rosa-sinensis)</div><div class=\"op\"><b>গ.</b> শশা (Cucumis sativus)</div><div class=\"op\"><b>ঘ.</b> পদ্ম (Nelumbo nucifera)</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> একপ্রকোষ্ঠবিশিষ্ট ডিম্বাশয়ের একপ্রান্ত বা কিনারা ঘেঁষে ডিম্বক উৎপন্ন হলে তাকে একপ্রান্তীয় বা মার্জিনাল (Marginal) অমরবিন্যাস বলে।</div><div class=\"ln\">ফ্যাব্যাসি (Fabaceae) গোত্রের উদ্ভিদ যেমন— শিম (Lablab purpureus) এবং মটরশুঁটিতে এই অমরবিন্যাস দেখা যায়।</div><div class=\"ln\">অন্যান্য অপশনগুলোর মধ্যে: জবা (Hibiscus rosa-sinensis)-তে অক্ষীয় (Axile), শশা (Cucumis sativus)-তে বহুপ্রান্তীয় (Parietal) এবং পদ্ম (Nelumbo nucifera)-তে গাত্রীয় (Superficial) অমরবিন্যাস দেখা যায়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬০</span>ট্রান্সফরমার ও জেনারেটরের আবিষ্কার করা হয়েছে-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> তড়িৎ আবেশের ভিত্তিতে</div><div class=\"op\"><b>খ.</b> চৌম্বক আবেশের ভিত্তিতে</div><div class=\"op smo ok\"><b>গ.</b> তড়িৎ-চৌম্বক আবেশের ভিত্তিতে<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> কোনোটিই নয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মাইকেল ফ্যারাডে কর্তৃক আবিষ্কৃত &quot;তড়িৎ-চৌম্বক আবেশ&quot; (Electromagnetic Induction) নীতির ওপর ভিত্তি করে ট্রান্সফরমার ও জেনারেটর আবিষ্কার ও তৈরি করা হয়েছে।</div><div class=\"ln\">জেনারেটরে চৌম্বক ক্ষেত্রে কুন্ডলী ঘোরানোর মাধ্যমে যান্ত্রিক শক্তিকে তড়িৎ শক্তিতে রূপান্তরিত করা হয় এবং ট্রান্সফরমারে পারস্পরিক আবেশের (Mutual induction) নীতি ব্যবহার করে দিকপরিবর্তী প্রবাহের বিভব হ্রাস বা বৃদ্ধি করা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬১</span>পরিবাহিতার একক নিচের কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ওহম</div><div class=\"op ok\"><b>খ.</b> সিমেন্স<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> কুলম্ব</div><div class=\"op\"><b>ঘ.</b> অ্যাম্পিয়ার</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> তড়িৎ পরিবাহিতা (Conductance) হলো রোধের (Resistance) বিপরীত রাশি।</div><div class=\"ln\">অর্থাৎ, পরিবাহিতা, <span class=\"m\" data-t=\"G = \\frac{1}{R}\"></span>।</div><div class=\"ln\">যেহেতু রোধের একক ওহম <span class=\"nw\">(<span class=\"m\" data-t=\"\\Omega\"></span>)</span>, তাই পরিবাহিতার একক হলো ওহম<span class=\"m\" data-t=\"^{-1}\"></span> <span class=\"nw\">(<span class=\"m\" data-t=\"\\Omega^{-1}\"></span>)</span>, যাকে আন্তর্জাতিক একক পদ্ধতিতে &#39;সিমেন্স&#39; (Siemens, S) বলা হয়।</div><div class=\"ln\">অন্য অপশনগুলোর মধ্যে ওহম হলো রোধের একক, কুলম্ব হলো আধানের একক এবং অ্যাম্পিয়ার হলো তড়িৎ প্রবাহের একক।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬২</span>বেবি পাউডারে থাকা অ্যান্টিসেপ্টিক কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> স্টেরাইল অ্যালকোহল</div><div class=\"op ok\"><b>খ.</b> বোরিক এসিড পাউডার<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> টেলক</div><div class=\"op\"><b>ঘ.</b> জিংক অক্সাইড</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> এইচএসসি রসায়ন দ্বিতীয় পত্রের (কর্মমুখী রসায়ন) মূল বইয়ের তথ্যমতে, বেবি পাউডারে অ্যান্টিসেপ্টিক হিসেবে বোরিক এসিড <span class=\"nw\">(<span class=\"m\" data-t=\"H_3BO_3\"></span>)</span> পাউডার ব্যবহার করা হয়।</div><div class=\"ln\">এটি শিশুর সংবেদনশীল ত্বকে ব্যাকটেরিয়ার আক্রমণ ও র্যাশ প্রতিরোধ করে।</div><div class=\"ln\">অন্যদিকে, টেলক (Talc) হলো পাউডারের মূল ভিত্তি (Base) এবং জিংক অক্সাইড বা জিংক স্টিয়ারেট পাউডারকে ত্বকে লেগে থাকতে সাহায্য করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৩</span>কৌণিক বেগের দিক, ঘূর্ণনশীল বস্তুর তলের কী বরাবর হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> সমান্তরাল</div><div class=\"op\"><b>খ.</b> সমতল</div><div class=\"op ok\"><b>গ.</b> উলম্ব<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> যেকোনো দিকে</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> কৌণিক বেগ (Angular velocity) একটি অক্ষীয় ভেক্টর (Axial vector)।</div><div class=\"ln\">ডানহাতি স্ক্রু নিয়ম (Right-hand screw rule) অনুসারে, কোনো ঘূর্ণনশীল বস্তুর কৌণিক বেগের দিক সর্বদা ঘূর্ণন তলের সাথে লম্ব বা উলম্ব (Perpendicular) বরাবর অক্ষ বরাবর ক্রিয়া করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৪</span>সরিষাতে কোন প্রকারের ডিম্বক দেখা যায়?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> বক্রমুখী<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> অধোমুখী</div><div class=\"op\"><b>গ.</b> পার্শ্বমুখী</div><div class=\"op\"><b>ঘ.</b> উর্ধমুখী</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল ও আবুল হাসান স্যারের উদ্ভিদবিজ্ঞান বইয়ের তথ্যমতে, সরিষা (Mustard) এবং কালকাসুন্দা উদ্ভিদের ডিম্বক বক্রমুখী (Campylotropous) প্রকৃতির হয়।</div><div class=\"ln\">এই ধরনের ডিম্বকের ডিম্বকদেহটি কিছুটা বেঁকে অবস্থান করে, যার ফলে ডিম্বকরন্ধ্র ও ডিম্বকমূল একই সরলরেখায় থাকে না।</div><div class=\"ln\">অন্যান্য অপশনের মধ্যে: গোলমরিচ ও পানে ঊর্ধ্বমুখী; ছোলা, মটর ও রেড়ীতে অধোমুখী; এবং পোস্ত ও খুদিপানায় পার্শ্বমুখী ডিম্বক দেখা যায়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৫</span>&#39;মোদের গরব মোদের আশা, আ মরি বাংলা ভাষা&#39; - গানটির রচয়িতা কে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> রবীন্দ্রনাথ ঠাকুর</div><div class=\"op ok\"><b>খ.</b> অতুল প্রসাদ সেন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> কবি জসীম উদ্দীন</div><div class=\"op\"><b>ঘ.</b> কাজী নজরুল ইসলাম।</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> &#39;মোদের গরব মোদের আশা, আ মরি বাংলা ভাষা&#39;— এই কালজয়ী দেশাত্মবোধক গানটির রচয়িতা এবং সুরকার হলেন অতুল প্রসাদ সেন।</div><div class=\"ln\">বাংলা ভাষা আন্দোলনের সময় এই গানটি বাঙালিদের মনে গভীর দেশপ্রেম ও ভাষার প্রতি মমত্ববোধ জাগ্রত করতে অত্যন্ত গুরুত্বপূর্ণ ভূমিকা পালন করেছিল।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৬</span>কোন প্রাণিতে Coelenteron নামক গ্যাস্ট্রো-ভ্যাসকুলার গহ্বর দেখা যায় না?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> হাইড্রা (Hydra vulgaris)</div><div class=\"op smo ok\"><b>খ.</b> স্পঞ্জ (Spongilla officinalis)<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> জেলিফিশ (Aurelia aurita)</div><div class=\"op smo\"><b>ঘ.</b> সাগর কলম (Pennatula sulcate)</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> সিলেন্টারন (Coelenteron) বা গ্যাস্ট্রো-ভ্যাসকুলার গহ্বর হলো নিডারিয়া (Cnidaria) পর্বের প্রাণীদের একটি অনন্য বৈশিষ্ট্য।</div><div class=\"ln\">উদ্দীপকের হাইড্রা (Hydra vulgaris), জেলিফিশ (Aurelia aurita) এবং সাগর কলম (Pennatula sulcata) নিডারিয়া পর্বের অন্তর্ভুক্ত হওয়ায় এদের দেহে সিলেন্টারন উপস্থিত থাকে।</div><div class=\"ln\">অন্যদিকে, স্পঞ্জ (Spongilla officinalis) পরিফেরা (Porifera) পর্বের প্রাণী।</div><div class=\"ln\">পরিফেরা পর্বের প্রাণীদের দেহের অভ্যন্তরীণ গহ্বরকে স্পঞ্জোসিল (Spongocoel) বলা হয়, সিলেন্টারন নয়।</div><div class=\"ln\">তাই স্পঞ্জে সিলেন্টারন দেখা যায় না।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৭</span>কোনটির মাধ্যমে লোবিউলে শ্বসন বায়ু প্রবেশ করে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> সেগমেন্টাল ব্রঙ্কাস</div><div class=\"op\"><b>খ.</b> সেকেন্ডারি ব্রঙ্কাস</div><div class=\"op ok\"><b>গ.</b> প্রান্তীয় ব্রঙ্কিওল<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> শ্বসন ব্রঙ্কিওল</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল স্যারের মানব শারীরতত্ত্ব (শ্বসন ও শ্বাসক্রিয়া) অধ্যায় অনুযায়ী, ফুসফুসের প্রতিটি লোবিউলে (lobule) একটি করে প্রান্তীয় ব্রঙ্কিওল (Terminal bronchiole) প্রবেশ করে শ্বসন বায়ু সরবরাহ করে।</div><div class=\"ln\">প্রান্তীয় ব্রঙ্কিওল পরবর্তীতে শ্বসন ব্রঙ্কিওলে (Respiratory bronchiole) বিভক্ত হয়, যা অ্যালভিওলার নালী ও অ্যালভিওলিতে উন্মুক্ত হয়।</div><div class=\"ln\">সুতরাং, লোবিউলে শ্বসন বায়ু প্রবেশ করার মাধ্যম হলো প্রান্তীয় ব্রঙ্কিওল।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৮</span>নিচের কোন গ্যাসটির আন্তঃআণবিক আকর্ষণ বল তুলনামূলকভাবে কম?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Ar</div><div class=\"op\"><b>খ.</b> O₂</div><div class=\"op\"><b>গ.</b> Ne</div><div class=\"op ok\"><b>ঘ.</b> He<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> অপোলার অণু এবং নিষ্ক্রিয় গ্যাসসমূহের মধ্যে অত্যন্ত দুর্বল ভ্যান ডার ওয়ালস আকর্ষণ বল (লন্ডন বল) কাজ করে।</div><div class=\"ln\">এই আকর্ষণ বলের মান পরমাণু বা অণুর আকার এবং ইলেকট্রন সংখ্যার ওপর নির্ভর করে।</div><div class=\"ln\">পরমাণুর আকার যত ছোট হয় এবং ইলেকট্রন সংখ্যা যত কম হয়, তার পোলারাইজেবিলিটি তত কম হয় এবং আন্তঃআণবিক আকর্ষণ বলও তত হ্রাস পায়।</div><div class=\"ln\">He, Ne, Ar এবং O₂-এর মধ্যে হিলিয়াম (He) পরমাণুর আকার সবচেয়ে ছোট এবং এতে মাত্র ২টি ইলেকট্রন থাকায় এর আন্তঃআণবিক আকর্ষণ বল সবচেয়ে কম।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৯</span>CrO₅ যৌগে Cr যুক্ত এর জারণ সংখ্যা কত?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> +10</div><div class=\"op\"><b>খ.</b> +8</div><div class=\"op ok\"><b>গ.</b> +6<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> +5</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> CrO₅ (ক্রোমিয়াম পেন্টাঅক্সাইড) যৌগের গঠনটি প্রজাপতির মতো (butterfly structure)।</div><div class=\"ln\">এই গঠনে একটি অক্সিজেন পরমাণু সাধারণ অক্সাইড হিসেবে থাকে (জারণ সংখ্যা -২) এবং বাকি চারটি অক্সিজেন পরমাণু দুটি পারঅক্সাইড শিকল (-O-O-) গঠন করে যুক্ত থাকে (প্রতিটি পারঅক্সাইড অক্সিজেনের জারণ সংখ্যা -১)।</div><div class=\"ln\">ধরি, Cr এর জারণ সংখ্যা = x</div><div class=\"ln\">তাহলে, x + 1(-2) + 4(-1) = 0</div><div class=\"ln\">বা, x - 2 - 4 = 0</div><div class=\"ln\">বা, x = +6</div><div class=\"ln\">অতএব, CrO₅ যৌগে Cr এর প্রকৃত জারণ সংখ্যা হলো +6।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭০</span>বলের মাত্রা কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> MLT²</div><div class=\"op\"><b>খ.</b> MLT⁻¹</div><div class=\"op\"><b>গ.</b> MLT</div><div class=\"op ok\"><b>ঘ.</b> MLT⁻²<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> আমরা জানি, বল (F) = ভর (m) × ত্বরণ (a)।</div><div class=\"ln\">ভরের মাত্রা = M</div><div class=\"ln\">ত্বরণের মাত্রা = LT⁻² (যেহেতু ত্বরণ = বেগ/সময় = দৈর্ঘ্য/সময়²)</div><div class=\"ln\">অতএব, বলের মাত্রা [F] = M × LT⁻² = MLT⁻²।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭১</span>নিচের কোনটি এক প্রকার সমসত্ত্ব প্রবতাণ?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> অ্যামোনিয়া উৎপাদন</div><div class=\"op ok\"><b>খ.</b> সুক্রোজের আর্দ্রবিশ্লেষণ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> অসম্পৃক্ত চর্বি থেকে ডালডা</div><div class=\"op smo\"><b>ঘ.</b> অসওয়াল্ড পদ্ধতিতে নাইট্রিক এসিড উৎপাদন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাজারী ও নাগ স্যারের রসায়ন দ্বিতীয় পত্র বই অনুসারে, যে প্রভাবন প্রক্রিয়ায় বিক্রিয়ক ও প্রভাবক একই ভৌত অবস্থায় (phase) থাকে, তাকে সমসত্ত্ব প্রভাবন (Homogeneous catalysis) বলে।</div><div class=\"ln\">সুক্রোজের আর্দ্রবিশ্লেষণে বিক্রিয়ক সুক্রোজের জলীয় দ্রবণ এবং প্রভাবক খনিজ এসিড (<span class=\"m\" data-t=\"H^+\"></span> আয়ন) উভয়ই তরল বা জলীয় অবস্থায় থাকে।</div><div class=\"ln\">তাই এটি একটি সমসত্ত্ব প্রভাবন।</div><div class=\"ln\">অন্যদিকে, অ্যামোনিয়া উৎপাদন (হেবার পদ্ধতি), অসম্পৃক্ত চর্বি থেকে ডালডা প্রস্তুতকরণ এবং অসওয়াল্ড পদ্ধতিতে নাইট্রিক এসিড উৎপাদনে বিক্রিয়ক ও প্রভাবক ভিন্ন ভৌত অবস্থায় থাকে, যা অসমসত্ত্ব প্রভাবনের উদাহরণ।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭২</span>মুক্তিযুদ্ধকালীন বাংলাদেশের রাষ্ট্রপতি ছিলেন কে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> সৈয়দ নজরুল ইসলাম</div><div class=\"op smo ok\"><b>খ.</b> বঙ্গবন্ধু শেখ মুজিবুর রহমান<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> তাজউদ্দিন আহমেদ</div><div class=\"op\"><b>ঘ.</b> খন্দকার মোশতাক আহমেদ</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৯৭১ সালের ১০ এপ্রিল গঠিত এবং ১৭ এপ্রিল শপথ গ্রহণকারী বাংলাদেশের প্রথম অস্থায়ী সরকার (মুজিবনগর সরকার)-এর রাষ্ট্রপতি ছিলেন জাতির পিতা বঙ্গবন্ধু শেখ মুজিবুর রহমান।</div><div class=\"ln\">তাঁর অনুপস্থিতিতে উপ-রাষ্ট্রপতি সৈয়দ নজরুল ইসলাম অস্থায়ী রাষ্ট্রপতির দায়িত্ব পালন করেন এবং তাজউদ্দীন আহমদ প্রধানমন্ত্রীর দায়িত্ব পালন করেন।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৩</span>প্রমাণ তাপমাত্রা কত?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ০° সেন্টিগ্রেড<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ২৭৩° সেন্টিগ্রেড</div><div class=\"op\"><b>গ.</b> ২৮৩ কেলভিন</div><div class=\"op\"><b>ঘ.</b> কোনোটিই নয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> রসায়ন ও পদার্থবিজ্ঞান বইয়ের মানদণ্ড অনুযায়ী, প্রমাণ তাপমাত্রা ও চাপ (STP - Standard Temperature and Pressure) বলতে ০° সেন্টিগ্রেড বা সেলসিয়াস (যা কেলভিন স্কেলে ২৭৩.১৫ K বা সংক্ষেপে ২৭৩ K) তাপমাত্রা এবং ১ বায়ুমণ্ডলীয় চাপকে (1 atm বা 101.325 kPa) বোঝায়।</div><div class=\"ln\">সুতরাং, প্রমাণ তাপমাত্রা হলো ০° সেন্টিগ্রেড।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৪</span>জাল পাসপোর্ট শনাক্তকরণে ব্যবহৃত রশ্মি কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> গামা রে</div><div class=\"op ok\"><b>খ.</b> আট্রাভায়োলেট রে<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ইনফারেড রে</div><div class=\"op\"><b>ঘ.</b> এক্স রে</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> জাল পাসপোর্ট, জাল আইডি কার্ড এবং জাল টাকা বা ব্যাংক নোট শনাক্তকরণে অতিবেগুনী রশ্মি বা আল্ট্রাভায়োলেট রে (UV Ray) ব্যবহৃত হয়।</div><div class=\"ln\">পাসপোর্টে বা নোটে ফসফর নামক এক প্রকার রাসায়নিক পদার্থ দিয়ে বিশেষ নিরাপত্তা সুতা বা নকশা করা থাকে, যা সাধারণ আলোতে দেখা যায় না।</div><div class=\"ln\">কিন্তু এর ওপর UV রশ্মি আপতিত হলে তা প্রতিপ্রভা (fluorescence) সৃষ্টি করে উজ্জ্বলভাবে দৃশ্যমান হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৫</span>টেপ রেকর্ডিং এর ফিতা তৈরিতে কোনটি ব্যবহৃত হয়?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> টিকোনাল<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ডিকালয়</div><div class=\"op\"><b>গ.</b> অ্যালিনিকো</div><div class=\"op\"><b>ঘ.</b> স্টালয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> এইচএসসি পদার্থবিজ্ঞান (আমির হোসেন / ইসহাক স্যার) বইয়ের চৌম্বকত্ব অধ্যায় অনুসারে, স্থায়ী চৌম্বক তৈরিতে অ্যালিনিকো (Alnico) এবং টিকোনাল (Ticonal) ব্যবহৃত হয়।</div><div class=\"ln\">টেপ রেকর্ডারের ফিতা (Magnetic recording tape) তৈরিতে অত্যন্ত উচ্চ ধারণশীলতা ও সহনশীলতাসম্পন্ন চৌম্বক পদার্থ হিসেবে &#39;টিকোনাল&#39; (Ticonal - Titanium, Cobalt, Nickel, Aluminum এর সংকর ধাতু) ব্যবহৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৬</span>নিচের কোনটি Procambium থেকে সৃষ্টি হয় না?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Xylem</div><div class=\"op\"><b>খ.</b> Phloem</div><div class=\"op ok\"><b>গ.</b> Cortex<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Cambium</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> উদ্ভিদের ভাজক টিস্যুর প্রোক্যাম্বিয়াম (Procambium) থেকে জাইলেম (Xylem), ফ্লোয়েম (Phloem) এবং ক্যাম্বিয়াম (Cambium) অর্থাৎ পরিবহন কলাতন্ত্র (Vascular tissue system) সৃষ্টি হয়।</div><div class=\"ln\">অন্যদিকে, কর্টেক্স (Cortex) গ্রাউন্ড মেরিস্টেম (Ground Meristem) বা ভিত্তি ভাজক টিস্যু থেকে উৎপন্ন হয়।</div><div class=\"ln\">সুতরাং, কর্টেক্স প্রোক্যাম্বিয়াম থেকে সৃষ্টি হয় না।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৭</span>নিচে দেয়া নমুনায় কোনটি ইলেকট্রোফাইল?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> NH₃</div><div class=\"op\"><b>খ.</b> H₂O</div><div class=\"op\"><b>গ.</b> R-OH</div><div class=\"op ok\"><b>ঘ.</b> AlCl₃<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ইলেকট্রোফাইল বা ইলেকট্রন-আকর্ষী বিকারক হলো ইলেকট্রন ঘাটতিযুক্ত অণু বা আয়ন।</div><div class=\"ln\"><span class=\"m\" data-t=\"AlCl_3\"></span> (অ্যালুমিনিয়াম ক্লোরাইড) এর কেন্দ্রীয় অ্যালুমিনিয়াম পরমাণুর যোজ্যতা স্তরে মাত্র ৬টি ইলেকট্রন থাকায় এর অষ্টক অপূর্ণ থাকে, তাই এটি একটি নিষ্ক্রিয় ইলেকট্রোফাইল (লুইস এসিড)।</div><div class=\"ln\">অপরদিকে <span class=\"m\" data-t=\"NH_3\"></span>, <span class=\"m\" data-t=\"H_2O\"></span> এবং <span class=\"m\" data-t=\"R-OH\"></span> এর কেন্দ্রীয় পরমাণুতে মুক্তজোড় ইলেকট্রন থাকায় এরা নিউক্লিওফাইল (কেন্দ্রাকর্ষী বিকারক) হিসেবে কাজ করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৮</span>LPG সিলিন্ডারে ভরার পূর্বে তীব্র গন্ধযুক্ত কোন পদার্থটি যোগ করা হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> মিথেন</div><div class=\"op ok\"><b>খ.</b> মারক্যাপটান<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> সালফার</div><div class=\"op\"><b>ঘ.</b> প্রোপেন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> এলপিজি (LPG) বা তরলীকৃত পেট্রোলিয়াম গ্যাস মূলত প্রোপেন ও বিউটেনের মিশ্রণ, যা প্রাকৃতিকভাবে সম্পূর্ণ গন্ধহীন।</div><div class=\"ln\">সিলিন্ডার থেকে গ্যাস লিক হলে তা সহজে সনাক্ত করে দুর্ঘটনা এড়ানোর জন্য এতে তীব্র ও কটু গন্ধযুক্ত ইথাইল মারক্যাপটান <span class=\"nw\">(<span class=\"m\" data-t=\"C_2H_5SH\"></span>)</span> নামক সালফার যৌগ যোগ করা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৯</span>মার্কনিকভের নীতি অনুযায়ী প্রোপিন ও HBr এর বিক্রিয়ার উৎপাদ নিচের কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> 1-ব্রোমোপ্রোপেন</div><div class=\"op ok\"><b>খ.</b> 2-ব্রোমোপ্রোপেন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> 1-ব্রোমোপ্রোপিন</div><div class=\"op\"><b>ঘ.</b> 2-ব্রোমোপ্রোপিন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মার্কনিকভের নীতি অনুসারে, অপ্রতিসম অ্যালকিন (যেমন- প্রোপিন, <span class=\"m\" data-t=\"CH_3-CH=CH_2\"></span>) এর সাথে অপ্রতিসম বিকারক (যেমন- <span class=\"m\" data-t=\"HBr\"></span>) এর বিক্রিয়ায় বিকারকের ঋণাত্মক অংশ <span class=\"nw\">(<span class=\"m\" data-t=\"Br^-\"></span>)</span> দ্বিবন্ধনযুক্ত কার্বন দুটির মধ্যে যেটিতে হাইড্রোজেন সংখ্যা কম (অর্থাৎ ২ নং কার্বন) তার সাথে যুক্ত হয়।</div><div class=\"ln\">ফলে প্রধান উৎপাদ (প্রায় ৯০%) হিসেবে ২-ব্রোমোপ্রোপেন <span class=\"nw\">(<span class=\"m\" data-t=\"CH_3-CH(Br)-CH_3\"></span>)</span> উৎপন্ন হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮০</span>Interphase এর কোন উপপর্যায়ে ক্রোমোসোমাল DNA এর অনুলিপন (replication) ঘটে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Gap-2 phase</div><div class=\"op ok\"><b>খ.</b> Synthesis phase<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> Gap-1 phase</div><div class=\"op\"><b>ঘ.</b> M. phase</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> কোষ চক্রের ইন্টারফেজ (Interphase) দশার তিনটি উপপর্যায় রয়েছে: <span class=\"m\" data-t=\"G_1\"></span> (Gap-1), S (Synthesis) এবং <span class=\"m\" data-t=\"G_2\"></span> (Gap-2)।</div><div class=\"ln\">এর মধ্যে S বা সিন্থেসিস (Synthesis) উপপর্যায়ে ক্রোমোসোমাল DNA-এর অনুলিপন বা রেপ্লিকেশন (Replication) ঘটে।</div><div class=\"ln\"><span class=\"m\" data-t=\"G_1\"></span> পর্যায়ে প্রয়োজনীয় প্রোটিন ও RNA তৈরি হয় এবং <span class=\"m\" data-t=\"G_2\"></span> পর্যায়ে কোষটি বিভাজনের চূড়ান্ত প্রস্তুতি নেয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮১</span>হৃদপিণ্ডের অস্বাভাবিক বা অনিয়ত স্পন্দন-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Ischemia</div><div class=\"op\"><b>খ.</b> Heart attack</div><div class=\"op ok\"><b>গ.</b> Arrhythmia<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Heart failure</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হৃদপিণ্ডের স্বাভাবিক ছন্দময় স্পন্দনের বিচ্যুতি বা অস্বাভাবিক ও অনিয়মিত স্পন্দনকে অ্যারিথমিয়া (Arrhythmia) বলা হয়।</div><div class=\"ln\">মানুষের স্বাভাবিক হৃদস্পন্দন প্রতি মিনিটে ৭০-৮০ বার।</div><div class=\"ln\">এই স্পন্দন যদি খুব দ্রুত (Tachycardia), খুব ধীর (Bradycardia) কিংবা অনিয়মিত হয়, তবে তাকে অ্যারিথমিয়া বলে।</div><div class=\"ln\">অন্যদিকে, Ischemia হলো হৃদপেশিতে রক্তস্বল্পতা, Heart attack হলো হৃদপেশিতে রক্তপ্রবাহ বন্ধ হয়ে যাওয়া এবং Heart failure হলো হৃদপিণ্ডের পর্যাপ্ত রক্ত পাম্প করতে না পারার অবস্থা।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮২</span>CCl₄ দ্বারা দূষিত পানিকে বিশুদ্ধকরণে ব্যবহৃত হয় কোনটি?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> আয়রন ন্যানো কণা<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> সালফার ন্যানো কণা</div><div class=\"op\"><b>গ.</b> কার্বন ন্যানো কণা</div><div class=\"op\"><b>ঘ.</b> ফুলারিন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> কার্বন টেট্রাক্লোরাইড <span class=\"nw\">(<span class=\"m\" data-t=\"CCl_4\"></span>)</span> দ্বারা দূষিত পানিকে বিশুদ্ধকরণে আয়রন ন্যানো কণা (Iron nanoparticles) ব্যবহৃত হয়।</div><div class=\"ln\">আয়রন ন্যানো কণা অত্যন্ত ক্ষুদ্র ও অতিমাত্রায় সক্রিয় হওয়ায় এটি ক্লোরিনেটেড হাইড্রোকার্বনকে (যেমন- <span class=\"m\" data-t=\"CCl_4\"></span>) বিজারণের মাধ্যমে দ্রুত ক্ষতিকর প্রভাবমুক্ত ও বিষমুক্ত করে নিরাপদ যৌগে পরিণত করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৩</span>Which one is correct?</div><div class=\"opts\"><div class=\"op smo\"><b>ক.</b> Mr. Karim is blind about his son&#39;s fault.</div><div class=\"op smo\"><b>খ.</b> Mr. Karim is blind for his son&#39;s fault.</div><div class=\"op smo\"><b>গ.</b> Mr. Karim is blind of his son&#39;s fault.</div><div class=\"op smo ok\"><b>ঘ.</b> Mr. Karim is blind to his son&#39;s fault.<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The appropriate preposition after &#39;blind&#39; is &#39;to&#39; when it means &#39;unwilling or unable to appreciate or understand something&#39; (কারও দোষের প্রতি অন্ধ বা উদাসীন থাকা)।</div><div class=\"ln\">Example: &#39;He is blind to his own faults.&#39; On the other hand, &#39;blind of&#39; is used to denote physical blindness in one or both eyes (e.g., &#39;He is blind of one eye&#39;). Therefore, option (ঘ) is the correct sentence.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৪</span>Recombinant DNA শনাক্তকরণে কোন পদ্ধতি ব্যবহৃত হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> DNA cloning</div><div class=\"op\"><b>খ.</b> Gene therapy</div><div class=\"op\"><b>গ.</b> DNA profile</div><div class=\"op ok\"><b>ঘ.</b> Genetic probe<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> রিকম্বিনেন্ট DNA (rDNA) বা কাঙ্ক্ষিত জিন শনাক্তকরণের জন্য &#39;জেনেটিক প্রোব&#39; (Genetic probe) বা DNA প্রোব ব্যবহার করা হয়।</div><div class=\"ln\">প্রোব হলো তেজস্ক্রিয় আইসোটোপ বা ফ্লুরোসেন্ট ডাই দ্বারা চিহ্নিত একটি নির্দিষ্ট একসূত্রক DNA বা RNA অণু, যা পরিপূরক ক্ষার জোড় সৃষ্টির মাধ্যমে কাঙ্ক্ষিত জিনকে খুঁজে বের করে ও শনাক্ত করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৫</span>নিচের কোন RNA তে এন্টিকোডন ফাঁস থাকে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> mRNA</div><div class=\"op ok\"><b>খ.</b> tRNA<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> rRNA</div><div class=\"op\"><b>ঘ.</b> gRNA</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> tRNA (transfer RNA)-এর ক্লোভার লিফ (Cloverleaf) ত্রিমাত্রিক গঠনে কয়েকটি ফাঁস বা লুপ (Loop) থাকে।</div><div class=\"ln\">এর মধ্যে অন্যতম হলো এন্টিকোডন ফাঁস (Anticodon loop)।</div><div class=\"ln\">এই ফাঁসের মাথায় তিনটি ক্ষারকের সমন্বয়ে গঠিত এন্টিকোডন থাকে, যা প্রোটিন সংশ্লেষণের সময় mRNA-এর নির্দিষ্ট কোডনের সাথে পরিপূরক হিসেবে যুক্ত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৬</span>DNA, RNA এর গঠনে কোন বন্ধন বিদ্যমান?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ধাতব বন্ধন</div><div class=\"op ok\"><b>খ.</b> হাইড্রোজেন বন্ধন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> আয়নিক বন্ধন</div><div class=\"op\"><b>ঘ.</b> সমদ্বিশেষ সমযোজী বন্ধন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> DNA এবং RNA-এর গঠনে নাইট্রোজেনাস ক্ষারকগুলোর মধ্যে হাইড্রোজেন বন্ধন (Hydrogen bond) বিদ্যমান থাকে।</div><div class=\"ln\">DNA-এর দ্বিসূত্রক কাঠামোতে এডেনিন (A) ও থাইমিন (T) দুটি হাইড্রোজেন বন্ধন দ্বারা এবং সাইটোসিন (C) ও গুয়ানিন (G) তিনটি হাইড্রোজেন বন্ধন দ্বারা যুক্ত থাকে।</div><div class=\"ln\">RNA-এর ক্ষেত্রেও একসূত্রক চেইনের বিভিন্ন ভাঁজে হাইড্রোজেন বন্ধন তৈরি হতে পারে।</div><div class=\"note\">সূত্র: আবুল হাসান, জীববিজ্ঞান ১ম পত্র</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৭</span>দুটি পেপটাইড শিকল কোন বন্ধন দ্বারা যুক্ত?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> সমযোজী</div><div class=\"op\"><b>খ.</b> গ্লাইকোসাইডিক</div><div class=\"op ok\"><b>গ.</b> H-বন্ধন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> পেপটাইড বন্ধন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> প্রোটিনের সেকেন্ডারি গঠনে (যেমন: আলফা-হেলিক্স বা বিটা-প্লিটেড শিট) দুটি পেপটাইড শিকল বা একই শিকলের বিভিন্ন অংশ পরস্পরের সাথে হাইড্রোজেন বন্ধন (H-bond) দ্বারা যুক্ত থাকে।</div><div class=\"ln\">তবে পেপটাইড শিকলের ভেতরের অ্যামিনো অ্যাসিডগুলো পরস্পরের সাথে পেপটাইড বন্ধন দ্বারা যুক্ত থাকে।</div><div class=\"note\">সূত্র: আবুল হাসান, জীববিজ্ঞান ১ম পত্র</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৮</span>বিনা প্রমাণে কোনো কিছু মেনে নেওয়াকে বলে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ধারণা</div><div class=\"op ok\"><b>খ.</b> স্বীকার্য<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> নীতি</div><div class=\"op\"><b>ঘ.</b> বিষয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পদার্থবিজ্ঞানের পরিভাষা অনুযায়ী, কোনো বৈজ্ঞানিক তত্ত্বের ভিত্তি হিসেবে বিনা প্রমাণে যে সত্যগুলোকে ধরে নেওয়া বা মেনে নেওয়া হয়, সেগুলোকে স্বীকার্য (Postulate) বলে।</div><div class=\"ln\">যেমন- আইনস্টাইনের আপেক্ষিকতার স্বীকার্য।</div><div class=\"note\">সূত্র: ড. শাহজাহান তপন, পদার্থবিজ্ঞান ১ম পত্র</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৯</span>&#39;Once in a blue mood&#39; means-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> always</div><div class=\"op ok\"><b>খ.</b> very rarely<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> hourly</div><div class=\"op\"><b>ঘ.</b> nearly</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ইংরেজি idiom &#39;Once in a blue moon&#39; (প্রশ্নে অসাবধানতাবশত &#39;mood&#39; ছাপা হয়েছে) এর অর্থ হলো &#39;খুবই কদাচিৎ&#39; বা &#39;খুবই বিরল ঘটনা&#39;।</div><div class=\"ln\">তাই এর সঠিক সমার্থক অর্থ প্রকাশকারী শব্দগুচ্ছ হলো &#39;very rarely&#39;।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯০</span>জননাঙ্গের কোন অংশ গুপ্তানুর প্রধান পুষ্টি পদার্থ ফ্রকটোজ ক্ষরণ করে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ভাসা ডিফারেন্সিয়া</div><div class=\"op\"><b>খ.</b> এপিডিডিমিস</div><div class=\"op\"><b>গ.</b> ভাস ডিফারেন্স</div><div class=\"op ok\"><b>ঘ.</b> সেমিনাল ভেসিকল<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পুরুষ জননতন্ত্রের সেমিনাল ভেসিকল (Seminal vesicle) থেকে একটি ক্ষারীয় ও চটচটে তরল নিঃসৃত হয়, যাতে প্রচুর পরিমাণে ফ্রুক্টোজ (Fructose) থাকে।</div><div class=\"ln\">এই ফ্রুক্টোজ শুক্রাণুর প্রধান পুষ্টি উপাদান হিসেবে কাজ করে এবং শুক্রাণুকে সচল রাখার জন্য শক্তি যোগায়।</div><div class=\"note\">সূত্র: গাজী আজমল, জীববিজ্ঞান ২য় পত্র</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯১</span>He died ___ poison.</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> by<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> on</div><div class=\"op\"><b>গ.</b> to</div><div class=\"op\"><b>ঘ.</b> with</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> Appropriate preposition-এর নিয়ম অনুযায়ী, কোনো বিষক্রিয়া (poison), সহিংসতা (violence), বা দুর্ঘটনার মাধ্যমে মারা গেলে &#39;die by&#39; ব্যবহৃত হয়।</div><div class=\"ln\">যেমন: &#39;He died by poison&#39; (তিনি বিষপানে মারা গেছেন)।</div><div class=\"ln\">অন্যান্য ক্ষেত্রে: রোগে মারা গেলে &#39;die of&#39; (e.g., die of cholera), দেশের জন্য বা মহৎ উদ্দেশ্যে মারা গেলে &#39;die for&#39; (e.g., die for the country), এবং অতিরিক্ত খাওয়া বা আঘাতের কারণে মারা গেলে &#39;die from&#39; (e.g., die from overeating) ব্যবহৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯২</span><span class=\"m\" data-t=\"H_2(g) + I_2(g) \\rightarrow 2HI(g)\"></span> বিক্রিয়াটি কত তাপমাত্রায় সংঘটিত হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> <span class=\"m\" data-t=\"2000^\\circ\\text{C}\"></span></div><div class=\"op ok\"><b>খ.</b> <span class=\"m\" data-t=\"4500^\\circ\\text{C}\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> <span class=\"m\" data-t=\"1200^\\circ\\text{C}\"></span></div><div class=\"op\"><b>ঘ.</b> <span class=\"m\" data-t=\"3000^\\circ\\text{C}\"></span></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাজারী ও নাগ স্যারের রসায়ন দ্বিতীয় পত্রের রাসায়নিক পরিবর্তন অধ্যায় অনুযায়ী, হাইড্রোজেন ও আয়োডিনের বিক্রিয়ায় হাইড্রোজেন আয়োডাইড <span class=\"nw\">(<span class=\"m\" data-t=\"H_2 + I_2 \\rightleftharpoons 2HI\"></span>)</span> উৎপাদনের বিক্রিয়াটি মূলত <span class=\"m\" data-t=\"450^\\circ\\text{C}\"></span> (বা <span class=\"m\" data-t=\"723\\text{ K}\"></span>) তাপমাত্রায় সংঘটিত হয়।</div><div class=\"ln\">মেডিকেল ভর্তি পরীক্ষার প্রশ্নব্যাংকে মুদ্রণজনিত ত্রুটির কারণে <span class=\"m\" data-t=\"450^\\circ\\text{C}\"></span>-কে অনেক সময় <span class=\"m\" data-t=\"4500^\\circ\\text{C}\"></span> হিসেবে দেখানো হয়েছে, যা অপশন (খ)-তে বিদ্যমান।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৩</span>দেহ রক্তচাপ নিয়ন্ত্রণ করে কোন অঙ্গাণু?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> হৃৎপিণ্ড</div><div class=\"op\"><b>খ.</b> মস্তিষ্ক</div><div class=\"op ok\"><b>গ.</b> বৃক্ক<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> ফুসফুস</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল স্যারের জীববিজ্ঞান ২য় পত্র (মানব শারীরতত্ত্ব) অনুযায়ী, মানবদেহের দীর্ঘমেয়াদি রক্তচাপ নিয়ন্ত্রণে বৃক্ক (Kidney) প্রধান ভূমিকা পালন করে।</div><div class=\"ln\">রক্তচাপ কমে গেলে বৃক্কের জাক্সটাগ্লোমেরুলার অ্যাপারেটাস থেকে &#39;রেনিন&#39; (Renin) নামক এনজাইম ক্ষরিত হয়।</div><div class=\"ln\">রেনিন রক্তে এনজিওটেনসিনোজেনকে এনজিওটেনসিন-I এবং পরবর্তীতে এনজিওটেনসিন-II-এ রূপান্তরিত করে, যা রক্তনালিকে সংকুচিত করে এবং অ্যালডোস্টেরন হরমোন ক্ষরণের মাধ্যমে সোডিয়াম ও পানি পুনঃশোষণ বাড়িয়ে রক্তচাপ স্বাভাবিক অবস্থায় ফিরিয়ে আনে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৪</span>কোন আয়নের প্রভাবে মাইটোকন্ড্রিয়ার নিষ্ক্রিয় ATP-ase এনজাইম সক্রিয় হয়ে অ্যাসিটাইলকোলিন ক্ষরণ করে?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ক্যালসিয়াম<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> সোডিয়াম</div><div class=\"op\"><b>গ.</b> পটাশিয়াম</div><div class=\"op\"><b>ঘ.</b> ক্লোরাইড</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> জীববিজ্ঞান ২য় পত্রের সমন্বয় ও নিয়ন্ত্রণ অধ্যায় অনুযায়ী, সিন্যাপসের মধ্য দিয়ে স্নায়ু উদ্দীপনা প্রেরণের সময় অ্যাকশন পটেনশিয়াল প্রিসিন্যাপটিক নবে পৌঁছালে ক্যালসিয়াম <span class=\"nw\">(<span class=\"m\" data-t=\"Ca^{2+}\"></span>)</span> চ্যানেল উন্মুক্ত হয়।</div><div class=\"ln\">বহিঃকোষীয় স্থান থেকে <span class=\"m\" data-t=\"Ca^{2+}\"></span> আয়ন প্রিসিন্যাপটিক নবে প্রবেশ করে মাইটোকন্ড্রিয়ার নিষ্ক্রিয় ATP-ase এনজাইমকে সক্রিয় করে তোলে।</div><div class=\"ln\">এই এনজাইম ATP ভেঙে শক্তি উৎপন্ন করে, যা নিউরোট্রান্সমিটার (অ্যাসিটাইলকোলিন) সমৃদ্ধ সিন্যাপটিক ভেসিকলগুলোকে প্রিসিন্যাপটিক পর্দার সাথে যুক্ত হতে এবং এক্সোসাইটোসিস প্রক্রিয়ায় অ্যাসিটাইলকোলিন ক্ষরণ করতে সাহায্য করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৫</span>অপারেশন জ্যাকপটে নৌ-কম্যান্ডারদের অভিযানে নামার চূড়ান্ত সাংকেতিক নির্দেশ হিসেবে স্বাধীন বাংলা বেতার কেন্দ্র থেকে &#39;আমি তোমায় যত শুনিয়েছিলাম গান&#39; বাজানো হয়। এই গানটির গায়ক কে ছিলেন?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> আরতি মুখোপাধ্যায়</div><div class=\"op\"><b>খ.</b> সন্ধ্যা মুখোপাধ্যায়</div><div class=\"op ok\"><b>গ.</b> পংকজ মল্লিক<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> আলতাফ মাহমুদ</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৯৭১ সালের ১৫ আগস্ট মহান মুক্তিযুদ্ধ চলাকালীন নৌ-কমান্ডোদের পরিচালিত ঐতিহাসিক &#39;অপারেশন জ্যাকপট&#39;-এর অভিযানের সংকেত হিসেবে আকাশবাণী কলকাতা কেন্দ্র থেকে দুটি গান বাজানো হয়েছিল।</div><div class=\"ln\">প্রথম সংকেত হিসেবে সন্ধ্যা মুখোপাধ্যায়ের গাওয়া &#39;আমার পুতুল আজকে যাবে শ্বশুরবাড়ি&#39; গানটি বাজিয়ে ২৪ ঘণ্টার মধ্যে অভিযানের প্রস্তুতি নেওয়ার নির্দেশ দেওয়া হয়।</div><div class=\"ln\">এরপর দ্বিতীয় ও চূড়ান্ত সংকেত হিসেবে পংকজ মল্লিকের গাওয়া রবীন্দ্রসংগীত &#39;আমি তোমায় যত শুনিয়েছিলাম গান&#39; বাজিয়ে তাৎক্ষণিক আক্রমণের নির্দেশ দেওয়া হয়েছিল।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৬</span>He was wise enough to accept the offer. Here &#39;enough&#39; is</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Verb</div><div class=\"op\"><b>খ.</b> Preposition</div><div class=\"op ok\"><b>গ.</b> Adverb<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Adjective</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> In English grammar, when &#39;enough&#39; is used to modify an adjective or an adverb, it is placed after that word and functions as an Adverb. In the sentence &#39;He was wise enough...&#39;, &#39;enough&#39; modifies the adjective &#39;wise&#39;. Therefore, &#39;enough&#39; is an Adverb. (Note: If &#39;enough&#39; is placed before a noun, e.g., &#39;enough money&#39;, it functions as an Adjective).</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৭</span>লবণ সেতুতে নিচের কোনটি ব্যবহৃত হয় না?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> <span class=\"m\" data-t=\"NH_4Cl\"></span></div><div class=\"op\"><b>খ.</b> <span class=\"m\" data-t=\"NH_4NO_3\"></span></div><div class=\"op\"><b>গ.</b> <span class=\"m\" data-t=\"KCl\"></span></div><div class=\"op ok\"><b>ঘ.</b> <span class=\"m\" data-t=\"ZnSO_4\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> লবণ সেতুতে (Salt Bridge) সাধারণত নিষ্ক্রিয় তড়িৎবিশ্লেষ্য পদার্থ যেমন <span class=\"m\" data-t=\"KCl\"></span>, <span class=\"m\" data-t=\"KNO_3\"></span>, <span class=\"m\" data-t=\"NH_4NO_3\"></span>, <span class=\"m\" data-t=\"NH_4Cl\"></span> ইত্যাদি ব্যবহার করা হয়, যাদের ক্যাটায়ন ও অ্যানায়নের গতিবেগ প্রায় সমান।</div><div class=\"ln\"><span class=\"m\" data-t=\"ZnSO_4\"></span> লবণ সেতুতে ব্যবহৃত হয় না; এটি ড্যানিয়েল কোষের অ্যানোড অর্ধ-কোষের তড়িৎবিশ্লেষ্য হিসেবে ব্যবহৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৮</span>Synonym for &#39;courteous&#39; is-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> intelligent</div><div class=\"op\"><b>খ.</b> well off</div><div class=\"op ok\"><b>গ.</b> polite<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> kindness</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> &#39;Courteous&#39; একটি Adjective যার অর্থ ভদ্র, নম্র বা শিষ্টাচারসম্পন্ন।</div><div class=\"ln\">এর সমার্থক শব্দ (Synonym) হলো &#39;polite&#39; (ভদ্র)।</div><div class=\"ln\">অন্যান্য অপশনগুলোর মধ্যে &#39;intelligent&#39; অর্থ বুদ্ধিমান, &#39;well off&#39; অর্থ স্বচ্ছল/ধনী এবং &#39;kindness&#39; একটি Noun যার অর্থ দয়া।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৯</span>কোন যৌগের আর্দ্রবিশ্লেষণ ঘটে না?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> <span class=\"m\" data-t=\"CCl_4\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> <span class=\"m\" data-t=\"NCl_3\"></span></div><div class=\"op\"><b>গ.</b> <span class=\"m\" data-t=\"SiCl_4\"></span></div><div class=\"op\"><b>ঘ.</b> <span class=\"m\" data-t=\"AlCl_3\"></span></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> কার্বন টেট্রাক্লোরাইড <span class=\"nw\">(<span class=\"m\" data-t=\"CCl_4\"></span>)</span> আর্দ্রবিশ্লেষিত হয় না।</div><div class=\"ln\">কারণ কার্বন ২য় পর্যায়ের মৌল হওয়ায় এর যোজ্যতা স্তরে কোনো ফাঁকা d-অরবিটাল নেই।</div><div class=\"ln\">ফলে পানির অক্সিজেনের মুক্তজোড় ইলেকট্রন গ্রহণ করার মতো কোনো খালি অরবিটাল <span class=\"m\" data-t=\"CCl_4\"></span>-এর কার্বন পরমাণুতে থাকে না।</div><div class=\"ln\">অন্যদিকে <span class=\"m\" data-t=\"SiCl_4\"></span>, <span class=\"m\" data-t=\"NCl_3\"></span>, এবং <span class=\"m\" data-t=\"AlCl_3\"></span> যৌগে কেন্দ্রীয় পরমাণু বা ক্লোরিনে ফাঁকা d-অরবিটাল থাকায় এদের আর্দ্রবিশ্লেষণ ঘটে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১০০</span>গ্রীস্মকালে দোলক ঘড়ি-</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ধীরে চলে<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> দ্রুত চলে</div><div class=\"op\"><b>গ.</b> তারের দৈর্ঘ্য কমে যায়</div><div class=\"op\"><b>ঘ.</b> দোলনকাল অপরিবর্তিত থাকে</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গ্রীষ্মকালে তাপমাত্রা বৃদ্ধির ফলে দোলক ঘড়ির ববের ঝুলন তারের কার্যকরী দৈর্ঘ্য <span class=\"nw\">(<span class=\"m\" data-t=\"L\"></span>)</span> বৃদ্ধি পায়।</div><div class=\"ln\">সরল দোলকের দোলনকালের সূত্রানুসারে,</div><div class=\"dm m\" data-d=\"1\" data-t=\"T = 2\\pi \\sqrt{\\frac{L}{g}}\"></div><div class=\"ln\">, অর্থাৎ দোলনকাল কার্যকরী দৈর্ঘ্যের বর্গমূলের সমানুপাতিক <span class=\"nw\">(<span class=\"m\" data-t=\"T \\propto \\sqrt{L}\"></span>)</span>।</div><div class=\"ln\">দৈর্ঘ্য <span class=\"nw\">(<span class=\"m\" data-t=\"L\"></span>)</span> বৃদ্ধি পাওয়ায় দোলনকাল <span class=\"nw\">(<span class=\"m\" data-t=\"T\"></span>)</span> বৃদ্ধি পায়।</div><div class=\"ln\">দোলনকাল বৃদ্ধি পাওয়ার অর্থ হলো প্রতিটি দোলন সম্পন্ন করতে ঘড়িটি বেশি সময় নেয়, ফলে দোলক ঘড়িটি ধীরে চলে (lose time/runs slow)।</div></div></div>"];
const SETTINGS = {"title":"মেডিকেল ভর্তি মডেল টেস্ট ০২","subtitle":"রসায়ন, পদার্থ, জীববিজ্ঞান, ইংরেজি ও সাধারণ জ্ঞান • MCQ সমাধান শীট","hasHeader":true,"pageOffset":0,"playStoreUrl":"https://play.google.com/store/apps/details?id=com.obhyash.app","websiteUrl":"https://www.obhyash.com","headerLeftText":"অ্যাপ ইনস্টল করো","headerLeftUrl":"https://play.google.com/store/apps/details?id=com.obhyash.app","headerRightText":"","footerLeftPrefix":"আনলিমিটেড এক্সাম দাও","footerSiteText":"www.obhyash.com","footerLeftUrl":"https://www.obhyash.com","footerLeftSuffix":"এ","footerPagePrefix":"পৃষ্ঠা","useBanglaDigits":true};
const BN = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

function renderMath(root) {
  root.querySelectorAll('.m').forEach(el => {
    try {
      katex.render(el.dataset.t, el, {
        displayMode: !!el.dataset.d,
        throwOnError: false,
        strict: 'ignore',
        output: 'html'
      });
    } catch(e) {
      el.textContent = el.dataset.t;
    }
  });
}

const M = document.getElementById('measure');
CARDS.forEach(h => {
  const d = document.createElement('div');
  d.innerHTML = h;
  M.appendChild(d.firstChild);
});

renderMath(M);

window.READY = false;

// Dynamic Programming Pagination
const GAP = 14;
const U_FULL = 1123 - 40 - 72; // = 1011

function paginate(h, hdr) {
  const n = h.length;
  const INF = [1e9, 0, 0];
  const pre = [0];
  for (const x of h) pre.push(pre[pre.length - 1] + x);
  const hh = (i, j) => (j > i ? pre[j] - pre[i] + GAP * (j - i - 1) : 0);

  const best = Array.from({ length: n + 1 }, () => [...INF]);
  best[0] = [0, 0, 0];
  const bp = Array(n + 1).fill(null);

  for (let i = 0; i < n; i++) {
    if (best[i][0] === 1e9) continue;
    const p = best[i][0];
    const U = U_FULL - (p === 0 && hdr ? 156 : 44);
    let a = 1;
    while (i + a <= n && hh(i, i + a) <= U) {
      let b = 0;
      while (i + a + b <= n && (b === 0 || hh(i + a, i + a + b) <= U)) {
        const j = i + a + b;
        const cand = [
          p + 1,
          best[i][1] + p * (a + b),
          best[i][2] + Math.abs(hh(i, i + a) - hh(i + a, j))
        ];
        if (
          cand[0] < best[j][0] ||
          (cand[0] === best[j][0] && cand[1] < best[j][1]) ||
          (cand[0] === best[j][0] && cand[1] === best[j][1] && cand[2] < best[j][2])
        ) {
          best[j] = cand;
          bp[j] = [i, a, b];
        }
        b++;
      }
      a++;
    }
  }

  const plan = [];
  let j = n;
  while (j > 0) {
    const entry = bp[j];
    if (!entry) break;
    const [i, a, b] = entry;
    plan.push([
      Array.from({ length: a }, (_, idx) => i + idx),
      Array.from({ length: b }, (_, idx) => i + a + idx)
    ]);
    j = i;
  }
  return plan.reverse();
}

window.build = function(plan, off, hdr) {
  const root = document.getElementById('root');
  root.innerHTML = '';
  
  plan.forEach((pl, k) => {
    const p = document.createElement('div');
    p.className = 'page';
    let top = 40;
    
    if (hdr && k === 0) {
      top = 196;
      p.innerHTML = `<div class="hdr">
        <div class="t">${SETTINGS.title}</div>
        <div class="s">${SETTINGS.subtitle}</div>
        <div class="bar"></div>
      </div>`;
    } else {
      top = 80;
      const leftIconSvg = SETTINGS.showHeaderLeftIcon !== false 
        ? '<svg viewBox="0 0 24 24"><path d="M3.6 1.6c-.3.3-.5.8-.5 1.4v18c0 .6.2 1.1.5 1.4l.1.1L13.8 12.4v-.2L3.7 1.5z" fill="#00a0ff"/><path d="M17.2 15.8l-3.4-3.4v-.2l3.4-3.4.1.1 4 2.3c1.1.6 1.1 1.7 0 2.3l-4 2.2z" fill="#ffc400"/><path d="M17.3 15.7L13.8 12.3 3.6 22.4c.4.4 1 .4 1.7.1z" fill="#f43249"/><path d="M17.3 8.9L5.3 2.1c-.7-.4-1.3-.3-1.7.1l10.2 10.1z" fill="#00e676"/></svg>'
        : '';
      const leftTagOpen = SETTINGS.headerLeftUrl 
        ? ('<a href="' + SETTINGS.headerLeftUrl + '">') 
        : '<div style="position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;color:#0f4c5c;font-size:15px;font-weight:bold;">';
      const leftTagClose = SETTINGS.headerLeftUrl ? '</a>' : '</div>';
      const rightText = SETTINGS.headerRightText || SETTINGS.title;
      const leftText = SETTINGS.headerLeftText || 'অ্যাপ ইনস্টল করো';

      p.innerHTML = `<div class="rh">
        ${leftTagOpen}
          ${leftIconSvg}
          <span>${leftText}</span>
        ${leftTagClose}
        <div class="nm">${rightText}</div>
      </div>`;
    }

    [[pl[0], 40], [pl[1], 410]].forEach(([ids, x]) => {
      const c = document.createElement('div');
      c.className = 'col';
      c.style.left = x + 'px';
      c.style.top = top + 'px';
      ids.forEach(i => c.appendChild(M.children[i].cloneNode(true)));
      p.appendChild(c);
    });

    const f = document.createElement('div');
    f.className = 'foot';
    const footerUrl = SETTINGS.footerLeftUrl || 'https://www.obhyash.com';
    const footerPrefix = SETTINGS.footerLeftPrefix || 'আনলিমিটেড এক্সাম দাও';
    const siteText = SETTINGS.footerSiteText || 'www.obhyash.com';
    const footerSuffix = SETTINGS.footerLeftSuffix || 'এ';
    const pagePrefix = SETTINGS.footerPagePrefix || 'পৃষ্ঠা';
    const pageNumStr = SETTINGS.useBanglaDigits !== false ? BN(off + k + 1) : String(off + k + 1);

    f.innerHTML = `<a href="${footerUrl}">${footerPrefix} <span class="site">${siteText}</span> ${footerSuffix}</a><div class="pg">${pagePrefix} <i>${pageNumStr}</i></div>`;
    p.appendChild(f);
    root.appendChild(p);
  });
};

window.overflow = function() {
  const bad = [];
  document.querySelectorAll('#root .card').forEach(c => {
    const r = c.getBoundingClientRect();
    const q = c.querySelector('.bd') ? c.querySelector('.bd').textContent : '';
    c.querySelectorAll('.katex').forEach(k => {
      const kr = k.getBoundingClientRect();
      if (kr.right > r.right - 6) {
        bad.push([q, Math.round(kr.right - r.right)]);
      }
    });
  });
  return bad;
};

// Initialize after font ready
document.fonts.ready.then(() => {
  setTimeout(() => {
    window.heights = [...M.children].map(c => c.getBoundingClientRect().height);
    const plan = paginate(window.heights, SETTINGS.hasHeader);
    window.build(plan, SETTINGS.pageOffset, SETTINGS.hasHeader);
    window.READY = true;
    
    // Post message to parent iframe if embedded
    if (window.parent && window.parent !== window) {
      const tot = window.heights.reduce((a, b) => a + b, 0);
      const cap = plan.reduce((acc, _, k) => {
        const hAvail = (U_FULL - (k === 0 && SETTINGS.hasHeader ? 156 : 44)) * 2;
        return acc + hAvail;
      }, 0);
      const fillPct = Math.round((100 * tot) / (cap || 1) * 10) / 10;
      const over = window.overflow();

      window.parent.postMessage({
        type: 'OBHYASH_PDF_READY',
        totalPages: plan.length,
        totalCards: window.heights.length,
        fillPercentage: fillPct,
        overflows: over
      }, '*');
    }
  }, 400);
});
