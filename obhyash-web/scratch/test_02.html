<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>মেডিকেল ভর্তি মডেল টেস্ট ০২</title>

<style>
@font-face {
  font-family: 'Kalpurush';
  src: url('/Users/limon/Obhyash-complete-project/obhyash-web/public/fonts/Kalpurush.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

@page {
  size: 210mm 297mm;
  margin: 0;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
body {
  font-family: 'Times New Roman', 'Liberation Serif', 'Kalpurush', 'FreeSans', serif;
  color: #1c2b33;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.page {
  position: relative;
  width: 794px;
  height: 1122px;
  overflow: hidden;
  background: #fff;
  break-after: page;
  page-break-after: always;
}
.page:last-child {
  break-after: auto;
  page-break-after: auto;
}

/* Page 1 Hero Header */
.hdr {
  position: absolute;
  left: 40px;
  top: 40px;
  width: 714px;
  height: 128px;
  border-radius: 28px;
  background: #244f5d;
  overflow: hidden;
  color: #fff;
  text-align: center;
  z-index: 2;
}
.hdr .t {
  font-size: 42px;
  font-weight: bold;
  margin-top: 14px;
  line-height: 1.25;
}
.hdr .s {
  font-size: 16.5px;
  margin-top: 6px;
  opacity: 0.95;
}
.hdr .bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 24px;
  background: #c64040;
}

/* Page 2+ Mini Header Strip */
.rh {
  position: absolute;
  left: 40px;
  right: 40px;
  top: 34px;
  height: 30px;
  border-bottom: 1px solid #d5dadd;
  z-index: 2;
}
.rh a {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  color: #0f4c5c;
  text-decoration: none;
  font-size: 15px;
  font-weight: bold;
  white-space: nowrap;
}
.rh a svg { width: 22px; height: 22px; }
.rh .nm {
  position: absolute;
  right: 0;
  top: 3px;
  color: #0f4c5c;
  font-size: 15px;
  font-weight: bold;
  white-space: nowrap;
}

/* Columns */
.col {
  position: absolute;
  width: 344px;
  z-index: 1;
}
.card {
  width: 344px;
  margin-bottom: 0;
}
.col .card + .card {
  margin-top: 14px;
}

/* Question Box */
.qb {
  background: #e6f1f1;
  border-left: 6px solid #0f4c5c;
  border-radius: 14px;
  padding: 11px 12px 11px 14px;
  font-weight: bold;
  font-size: 15.5px;
  line-height: 1.5;
}
.bd {
  display: inline-block;
  background: #d62839;
  color: #fff;
  border-radius: 8px;
  padding: 0 9px;
  margin-right: 8px;
  font-size: 14px;
  line-height: 22px;
  font-weight: bold;
}

/* Options */
.opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 8px 0;
}
.op {
  position: relative;
  background: #fff;
  border: 1.6px solid #c9cfd3;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 14.5px;
  line-height: 1.4;
  min-height: 34px;
  display: block;
}
.op b { margin-right: 5px; }
.op.smo { font-size: 13.4px; }
.op.ok {
  border-color: #2e9e57;
  background: #e8f6ec;
  padding-right: 26px;
}
.ck {
  position: absolute;
  right: 7px;
  top: 50%;
  margin-top: -8px;
  width: 16px;
  height: 16px;
}

/* Explanation */
.ex {
  background: #fdf0ec;
  border-radius: 14px;
  padding: 9px 12px;
  font-size: 13.6px;
  line-height: 1.5;
}
.ln { margin: 2px 0; }
.lab { color: #d62839; font-weight: bold; }
.bl { display: flex; gap: 6px; margin: 3px 0; }
.mk {
  flex: none;
  margin-top: 5px;
  width: 0;
  height: 0;
  border-left: 6px solid #d62839;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
}
.bc { flex: 1; min-width: 0; }
.note { font-style: italic; color: #555; margin-top: 3px; }
.dm { text-align: left; margin: 2px 0 2px 6px; }

/* KaTeX typography */
.katex { white-space: nowrap; font-size: 1.05em; }
.wrapm .katex, .wrapm.katex { white-space: normal; }
.dm .katex-display { margin: 0; }
.dm .katex-display > .katex { text-align: left; }
.nw { white-space: nowrap; }
.dl::before { content: "$"; }

/* Footer */
.foot {
  position: absolute;
  left: 40px;
  right: 40px;
  top: 1063px;
  border-top: 1px solid #d5dadd;
  height: 46px;
}
.foot a {
  position: absolute;
  left: 0;
  top: 9px;
  color: #0f4c5c;
  text-decoration: none;
  font-size: 16px;
  white-space: nowrap;
  display: flex;
  align-items: center;
}
.foot .site {
  font-family: 'Times New Roman', 'Liberation Serif', serif;
  font-weight: bold;
  font-size: 17px;
  margin: 0 5px;
}
.pg {
  position: absolute;
  right: 0;
  top: 9px;
  font-size: 16px;
  color: #0f4c5c;
}
.pg i { font-style: normal; margin-left: 5px; }

#measure {
  position: absolute;
  left: -9999px;
  top: 0;
  width: 344px;
  visibility: hidden;
}
#measure .card { margin-bottom: 0; }

@media print {
  #measure { display: none !important; }
  body { background: #fff !important; }
}
</style>
</head>

<script>
const CARDS = ["<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১</span>কোন একটি বৃত্তাকার পথে ঘুরে আগের অবস্থানে ফিরে আসলে কাজ হয়-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ধনাত্মক</div><div class=\"op ok\"><b>খ.</b> শূন্য<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ঋণাত্মক</div><div class=\"op\"><b>ঘ.</b> অসীম</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পদার্থবিজ্ঞানের সূত্রানুসারে, কাজ (W) = Fs cosθ।</div><div class=\"ln\">বৃত্তাকার পথে কোনো বস্তু ঘুরে আগের অবস্থানে ফিরে আসলে তার সরণ (s) হয় শূন্য।</div><div class=\"ln\">যেহেতু সরণ শূন্য, তাই কৃতকাজ W = F * 0 * cosθ = 0 জুল।</div><div class=\"ln\">এটি একটি সংরক্ষণশীল বলের উদাহরণ।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২</span>দুটি polypeptide দ্বারা গঠিত প্রোটিন -</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> লাইসোজাইম</div><div class=\"op\"><b>খ.</b> কোলাজেন</div><div class=\"op\"><b>গ.</b> হিমোগ্লোবিন</div><div class=\"op ok\"><b>ঘ.</b> ইন্টেগ্রিন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> জীববিজ্ঞান পাঠ্যপুস্তক অনুযায়ী, ইন্টেগ্রিন (Integrin) হলো একটি ট্রান্সমেমব্রেন রিসেপ্টর যা দুটি পলিপেপটাইড চেইন (α এবং β সাবইউনিট) দ্বারা গঠিত।</div><div class=\"ln\">অন্যদিকে, হিমোগ্লোবিন চারটি পলিপেপটাইড চেইন দ্বারা গঠিত এবং কোলাজেন তিনটি পলিপেপটাইড চেইন দ্বারা গঠিত।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩</span>The antonym of the word &quot;Adverse&#39; is</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Hostile</div><div class=\"op\"><b>খ.</b> negative</div><div class=\"op ok\"><b>গ.</b> Favourable<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> unfavourable</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The word &#39;Adverse&#39; means unfavorable or harmful. Its antonym is &#39;Favourable&#39;, which means advantageous or helpful. &#39;Hostile&#39;, &#39;negative&#39;, and &#39;unfavourable&#39; are synonyms of &#39;Adverse&#39;.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪</span>C4 উদ্ভিদের জন্য কোন মৌলটি বিশেষ প্রয়োজন?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> সিলিকন</div><div class=\"op\"><b>খ.</b> কোবাল্ট</div><div class=\"op\"><b>গ.</b> আয়োডিন</div><div class=\"op ok\"><b>ঘ.</b> সোডিয়াম<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> C4 উদ্ভিদের (যেমন- আখ, ভুট্টা) বিপাকীয় প্রক্রিয়ায় সোডিয়াম (Na+) একটি অত্যাবশ্যকীয় উপাদান।</div><div class=\"ln\">এটি PEP (Phosphoenolpyruvate) পুনরুৎপাদনে সাহায্য করে, যা C4 চক্রের জন্য অত্যন্ত গুরুত্বপূর্ণ।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫</span>LiAlH4 যৌগে H এর জারণ মান কত?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> +1</div><div class=\"op ok\"><b>খ.</b> -1<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> +2</div><div class=\"op\"><b>ঘ.</b> +3</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> LiAlH4 একটি ধাতব হাইড্রাইড।</div><div class=\"ln\">এখানে লিথিয়াম (Li) গ্রুপ-১ এর মৌল হওয়ায় এর জারণ মান +1 এবং অ্যালুমিনিয়াম (Al) এর জারণ মান +3।</div><div class=\"ln\">ধরি, H এর জারণ মান x।</div><div class=\"ln\">সুতরাং, (+1) + (+3) + 4x = 0; বা, 4 + 4x = 0; বা, 4x = -4; বা, x = -1।</div><div class=\"ln\">তাই হাইড্রোজেনের জারণ মান -1।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬</span>আউফবাউ নীতি অনুসারে সঠিক শক্তিক্রম কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> 5s &lt; 5p &lt; 4d</div><div class=\"op\"><b>খ.</b> 3d &lt; 4s &lt; 4p</div><div class=\"op\"><b>গ.</b> 4d &lt; 5s &lt; 5p</div><div class=\"op ok\"><b>ঘ.</b> 4s &lt; 3d &lt; 4p<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> আউফবাউ (Aufbau) নীতি অনুসারে ইলেকট্রন প্রথমে নিম্ন শক্তির অরবিটালে এবং পরে ক্রমান্বয়ে উচ্চ শক্তির অরবিটালে প্রবেশ করে।</div><div class=\"ln\">অরবিটালের শক্তি নির্ধারিত হয় (n+l) এর মান দ্বারা।</div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">4s অরবিটালের জন্য, n+l = 4 + 0 = 4</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">3d অরবিটালের জন্য, n+l = 3 + 2 = 5</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">4p অরবিটালের জন্য, n+l = 4 + 1 = 5</div></div></div><div class=\"ln\">যেহেতু 4s এর (n+l) মান সবচেয়ে কম, তাই এর শক্তি সবচেয়ে কম।</div><div class=\"ln\">3d এবং 4p উভয়ের (n+l) মান 5 হলেও, যার প্রধান কোয়ান্টাম সংখ্যা (n) এর মান কম, তার শক্তি কম।</div><div class=\"ln\">তাই 3d এর শক্তি 4p এর চেয়ে কম।</div><div class=\"ln\">সুতরাং সঠিক শক্তিক্রম: 4s &lt; 3d &lt; 4p।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭</span>Your conduct admits __ no excuse.</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> of<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> at</div><div class=\"op\"><b>গ.</b> for</div><div class=\"op\"><b>ঘ.</b> to</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The appropriate preposition after &quot;admit&quot; in this context is &quot;of&quot;. &quot;Admit of&quot; is a phrasal verb/idiom which means &quot;to leave room for&quot; or &quot;to allow of&quot; (কোনো কিছুর সুযোগ বা অবকাশ থাকা). Therefore, &quot;Your conduct admits of no excuse&quot; means &quot;Your conduct leaves no room for excuse&quot; (তোমার আচরণে ক্ষমার কোনো সুযোগ বা অবকাশ নেই)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮</span>মায়োপিয়া বা দূরের বস্তু দেখতে সমস্যা সমাধানে কোন ধরণের লেন্সের চশমা ব্যবহার করতে হবে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ডিউতল</div><div class=\"op ok\"><b>খ.</b> দ্বিঅবতল<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> সমতলতল</div><div class=\"op\"><b>ঘ.</b> সমতলঅবতল</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মায়োপিয়া (Myopia) বা হ্রস্বদৃষ্টি হলো চোখের এমন একটি ত্রুটি যার ফলে কাছের বস্তু স্পষ্ট দেখা গেলেও দূরের বস্তু অস্পষ্ট দেখায়।</div><div class=\"ln\">চোখের লেন্সের অভিসারী ক্ষমতা বৃদ্ধি পেলে বা অক্ষিগোলকের ব্যাসার্ধ বেড়ে গেলে এই ত্রুটি হয়।</div><div class=\"ln\">এই ত্রুটি দূর করার জন্য চশমায় উপযুক্ত ফোকাস দূরত্বের &#39;অবতল লেন্স&#39; বা &#39;দ্বিঅবতল&#39; (Biconcave) লেন্স ব্যবহার করা হয়, যা আলোক রশ্মিকে অপসারিত করে রেটিনায় সঠিক প্রতিবিম্ব গঠন করতে সাহায্য করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯</span>আগরতলা ষড়যন্ত্র মামলার দাপ্তরিক নাম কী ছিল?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> আগরতলা ষড়যন্ত্র</div><div class=\"op smo\"><b>খ.</b> সরকার বনাম শেখ মুজিবুর রহমান ও অন্যান্য</div><div class=\"op\"><b>গ.</b> রাষ্ট্র বনাম আগরতলা</div><div class=\"op smo ok\"><b>ঘ.</b> রাষ্ট্র বনাম শেখ মুজিবুর রহমান ও অন্যান্য<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৯৬৮ সালের গোড়ার দিকে তৎকালীন পাকিস্তান সরকার আওয়ামী লীগ প্রধান শেখ মুজিবুর রহমানকে প্রধান আসামি করে মোট ৩৫ জনের বিরুদ্ধে একটি রাষ্ট্রদ্রোহী মামলা দায়ের করে।</div><div class=\"ln\">এই ঐতিহাসিক মামলাটির দাপ্তরিক বা আনুষ্ঠানিক নাম ছিল &quot;রাষ্ট্র বনাম শেখ মুজিবুর রহমান ও অন্যান্য&quot; (State vs. Sheikh Mujibur Rahman and others)।</div><div class=\"ln\">তবে এটি ইতিহাসে &#39;আগরতলা ষড়যন্ত্র মামলা&#39; হিসেবেই অধিক পরিচিত।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১০</span>টর্সের থেরাপিয়াসের ক্ষেত্রে সঠিক-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ডিপ্রয়েড</div><div class=\"op\"><b>খ.</b> যকৃতের মতো</div><div class=\"op ok\"><b>গ.</b> স্বভোয়ী<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> ডিম্বাসী</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> প্রশ্নটিতে মূলত &#39;টেরিস (Pteris)-এর প্রোথ্যালাস (Prothallus)&#39;-এর বৈশিষ্ট্য জানতে চাওয়া হয়েছে (যা টাইপিং বা ওসিআর ত্রুটির কারণে &#39;টর্সের থেরাপিয়াস&#39; হয়েছে)।</div><div class=\"ln\">টেরিস-এর প্রোথ্যালাস হলো একটি স্বাধীন, সবুজ, হৃৎপিণ্ডাকার এবং হ্যাপ্লয়েড (n) গঠন।</div><div class=\"ln\">যেহেতু এটি সবুজ এবং ক্লোরোফিলযুক্ত, তাই এটি নিজের খাদ্য নিজেই তৈরি করতে পারে অর্থাৎ এটি স্বভোজী (Autotrophic)।</div><div class=\"ln\">এটি ডিপ্লয়েড নয় (বরং হ্যাপ্লয়েড) এবং এটি হৃৎপিণ্ডাকার (যকৃতের মতো নয়)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১১</span>বাংলাদেশে কোভিড-১৯ এর ভ্যাকসিন প্রথম কাকে দেওয়া হয়?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> রুনা ভেরোনিকা কস্তা<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> রেনু বেগম</div><div class=\"op\"><b>গ.</b> রুন্নু রোকোনিকা</div><div class=\"op\"><b>ঘ.</b> মারিয়া পারভীন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বাংলাদেশে ২০২১ সালের ২৭ জানুয়ারি কুর্মিটোলা জেনারেল হাসপাতালের সিনিয়র স্টাফ নার্স রুনা ভেরোনিকা কস্তাকে প্রথম কোভিড-১৯ ভ্যাকসিন প্রদানের মাধ্যমে দেশব্যাপী টিকাদান কর্মসূচির উদ্বোধন করা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১২</span>What is the passive voice of the sentence? &#39;His conduct annoyed me&#39;.</div><div class=\"opts\"><div class=\"op smo\"><b>ক.</b> I was being annoyed by his conduct.</div><div class=\"op smo\"><b>খ.</b> I was annoyed by his conduct.</div><div class=\"op smo ok\"><b>গ.</b> I was annoyed at his conduct.<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>ঘ.</b> I had been annoyed on his conduct</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> Active voice-এ &#39;annoy&#39; verb-টির পর passive voice-এ সাধারণত &#39;by&#39; না বসে &#39;at&#39; (আচরণ বা বিষয়ের ক্ষেত্রে) অথবা &#39;with&#39; (ব্যক্তির ক্ষেত্রে) বসে।</div><div class=\"ln\">যেহেতু এখানে &#39;his conduct&#39; (আচরণ) রয়েছে, তাই passive voice-এ &#39;annoyed at&#39; ব্যবহৃত হবে।</div><div class=\"ln\">বাক্যটি Past Indefinite Tense-এ থাকায় passive structure হবে: Subject + was/were + past participle of verb + extension. সুতরাং সঠিক রূপটি হলো: &quot;I was annoyed at his conduct.&quot;</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১৩</span>কোন ধরণের পেশিতেতে ইন্টারক্যালেটেড ডিস্ক দেখা যায়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> প্যারাইটাল পেশি</div><div class=\"op\"><b>খ.</b> ভিসেরাল পেশি</div><div class=\"op ok\"><b>গ.</b> কার্ডিয়াক পেশি<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> কঙ্কাল পেশি</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> কার্ডিয়াক পেশি বা হৃদপেশির একটি অনন্য ও অন্যতম প্রধান সনাক্তকারী বৈশিষ্ট্য হলো এতে &#39;ইন্টারক্যালেটেড ডিস্ক&#39; (Intercalated disc) উপস্থিত থাকে।</div><div class=\"ln\">এটি মূলত দুটি সংলগ্ন হৃদপেশি কোষের সংযোগস্থলে কোষঝিল্লির বিশেষায়িত ঘন অংশ, যা হৃদপিণ্ডের সংকোচন উদ্দীপনা দ্রুত ছড়িয়ে দিতে সাহায্য করে।</div><div class=\"ln\">কঙ্কাল পেশি বা মসৃণ (ভিসেরাল) পেশিতে ইন্টারক্যালেটেড ডিস্ক থাকে না।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১৪</span>জার্মপ্লাজম-সোমাটোপ্লাজম তত্ত্ব ও নব ডারউইনিজম মতবাদের প্রবক্তা কে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ল্যামার্ক</div><div class=\"op\"><b>খ.</b> ওয়ালেস</div><div class=\"op\"><b>গ.</b> ডারউইন</div><div class=\"op ok\"><b>ঘ.</b> ভাইজম্যান<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> জার্মান বিজ্ঞানী অগাস্ট ভাইজম্যান (August Weismann) ১৮৯২ সালে &#39;জার্মপ্লাজম মতবাদ&#39; (Germplasm Theory) প্রকাশ করেন।</div><div class=\"ln\">তাঁর মতে, জীবের দেহ দুই প্রকার কোষ নিয়ে গঠিত—সোমাটোপ্লাজম (দেহকোষ) এবং জার্মপ্লাজম (জননকোষ)।</div><div class=\"ln\">শুধুমাত্র জার্মপ্লাজমের পরিবর্তনই বংশানুক্রমে পরবর্তী প্রজন্মে সঞ্চারিত হয়।</div><div class=\"ln\">তিনি ডারউইনের মতবাদকে আধুনিক জিনতত্ত্বের আলোকে ব্যাখ্যা করে &#39;নব-ডারউইনিজম&#39; (Neo-Darwinism) মতবাদের ভিত্তি স্থাপন করেন।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১৫</span>কোন গ্যাসের ব্যাপন হার বেশি?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> নিয়ন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ফ্লোরিন</div><div class=\"op\"><b>গ.</b> অক্সিজেন</div><div class=\"op\"><b>ঘ.</b> ক্লোরিন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গ্রাহামের ব্যাপন সূত্রানুসারে, নির্দিষ্ট তাপমাত্রা ও চাপে কোনো গ্যাসের ব্যাপন হার (r) তার আণবিক ভরের (M) বর্গমূলের ব্যস্তানুপাতিক <span class=\"nw\">(<span class=\"m\" data-t=\"r \\propto \\frac{1}{\\sqrt{M}}\"></span>)</span>।</div><div class=\"ln\">অর্থাৎ, যে গ্যাসের আণবিক ভর যত কম, তার ব্যাপন হার তত বেশি।</div><div class=\"ln\">উদ্দীপকে প্রদত্ত গ্যাসগুলোর আণবিক ভর নিম্নরূপ: নিয়ন (Ne) = ২০ গ্রাম/মোল, অক্সিজেন <span class=\"nw\">(<span class=\"m\" data-t=\"O_2\"></span>)</span> = ৩২ গ্রাম/মোল, ফ্লোরিন <span class=\"nw\">(<span class=\"m\" data-t=\"F_2\"></span>)</span> = ৩৮ গ্রাম/মোল এবং ক্লোরিন <span class=\"nw\">(<span class=\"m\" data-t=\"Cl_2\"></span>)</span> = ৭১ গ্রাম/মোল।</div><div class=\"ln\">যেহেতু নিয়ন (Ne)-এর আণবিক ভর সবচেয়ে কম, তাই নিয়ন গ্যাসের ব্যাপন হার সবচেয়ে বেশি হবে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১৬</span>কোনটি হাইড্রার দেহে সংযোগকারী স্তর হিসেবে কাজ করে?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> মেসোগ্লিয়া<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> এক্টোডার্ম</div><div class=\"op\"><b>গ.</b> এন্ডোডার্ম</div><div class=\"op\"><b>ঘ.</b> মেসোডার্ম</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাইড্রা একটি দ্বিস্তরী (diploblastic) প্রাণী।</div><div class=\"ln\">এর দেহের বাইরের স্তর এক্টোডার্ম (এপিডার্মিস) এবং ভেতরের স্তর এন্ডোডার্ম (গ্যাস্ট্রোডার্মিস)।</div><div class=\"ln\">এই দুই স্তরের মাঝখানে অবস্থিত অকোষীয়, জেলি-সদৃশ, স্থিতিস্থাপক ও সংযোগকারী স্তরটিকে মেসোগ্লিয়া (Mesoglea) বলে।</div><div class=\"ln\">এটি দুই স্তরের কোষসমূহকে আটকে রাখতে এবং দেহের কাঠামো গঠনে সাহায্য করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১৭</span>লিথিয়াম আয়ন ব্যাটারি Ecell কত?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> 4.9V</div><div class=\"op ok\"><b>খ.</b> 3.7V<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> 3.62V</div><div class=\"op\"><b>ঘ.</b> 9.8V</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাজারী ও নাগ স্যারের রসায়ন ২য় পত্র বইয়ের &#39;তড়িৎ রসায়ন&#39; অধ্যায় অনুযায়ী, লিথিয়াম আয়ন ব্যাটারির কোষ বিভব বা Ecell হলো ৩.৭ ভোল্ট (3.7V)।</div><div class=\"ln\">এটি একটি রিচার্জেবল বা গৌণ কোষ যা মোবাইল ফোন, ল্যাপটপ ইত্যাদিতে বহুল ব্যবহৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১৮</span>দেহের প্রয়োজনে অতিরিক্ত গ্লাইকোজেন ভেঙে যায় কোন হরমোনের প্রভাবে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ইনসুলিন</div><div class=\"op ok\"><b>খ.</b> গ্লুকাগন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> প্যানক্রিয়াটিক পলিপেপটাইড</div><div class=\"op\"><b>ঘ.</b> গ্যাস্ট্রিন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> অগ্ন্যাশয়ের আইলেটস অব ল্যাঙ্গারহ্যান্সের আলফা (α) কোষ থেকে নিঃসৃত গ্লুকাগন (Glucagon) হরমোন রক্তে গ্লুকোজের মাত্রা কমে গেলে যকৃতে সঞ্চিত গ্লাইকোজেনকে ভেঙে গ্লুকোজে পরিণত করে (গ্লাইকোজেনোলাইসিস প্রক্রিয়া)।</div><div class=\"ln\">অন্যদিকে, ইনসুলিন রক্তে অতিরিক্ত গ্লুকোজকে গ্লাইকোজেনে রূপান্তরিত করে সঞ্চয় করে (গ্লাইকোজেনেসিস)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১৯</span>কুষ্ঠজিবা আবিষ্কার করেন কে?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> শোয়ার্জশিন্ড<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> জন হুইলার</div><div class=\"op\"><b>গ.</b> হাবল</div><div class=\"op\"><b>ঘ.</b> আইনস্টাইন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> প্রশ্নটিতে মুদ্রণজনিত ত্রুটির কারণে &#39;কৃষ্ণগহ্বর&#39; এর স্থলে &#39;কুষ্ঠজিবা&#39; এসেছে।</div><div class=\"ln\">মূলত মহাবিশ্বের অন্যতম রহস্যময় বস্তু &#39;কৃষ্ণগহ্বর&#39; (Black Hole)-এর অস্তিত্বের কথা ১৯১৬ সালে জার্মান পদার্থবিদ কার্ল শোয়ার্জশিল্ড (Karl Schwarzschild) প্রথম গাণিতিকভাবে আবিষ্কার ও প্রমাণ করেন।</div><div class=\"ln\">পরবর্তীতে ১৯৬৭ সালে মার্কিন পদার্থবিদ জন হুইলার (John Wheeler) এর নামকরণ করেন &#39;ব্ল্যাক হোল&#39; বা &#39;কৃষ্ণগহ্বর&#39;।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২০</span>ফ্রি র্যাডিক্যাল এর স্থায়িত্বের কোন ক্রমটি সঠিক?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> 3&gt;2&gt;1<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> 1&gt;2&gt;3</div><div class=\"op\"><b>গ.</b> 3&gt;1&gt;2</div><div class=\"op\"><b>ঘ.</b> 2&gt;3&gt;1</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ফ্রি র্যাডিক্যাল বা মুক্ত মূলক হলো বিজোড় ইলেকট্রনযুক্ত অত্যন্ত সক্রিয় পরমাণু বা গ্রুপ।</div><div class=\"ln\">অ্যালকাইল মূলকের ধনাত্মক আবেশ ধর্ম (+I effect) এবং হাইপারকনজুগেশন (Hyperconjugation) প্রভাবের কারণে ফ্রি র্যাডিক্যালের স্থায়িত্ব বৃদ্ধি পায়।</div><div class=\"ln\">৩° ফ্রি র্যাডিক্যালে তিনটি অ্যালকাইল মূলক থাকায় এটি সবচেয়ে বেশি স্থিতিশীল।</div><div class=\"ln\">তাই স্থায়িত্বের সঠিক ক্রমটি হলো: ৩° &gt; ২° &gt; ১° (বা 3 &gt; 2 &gt; 1)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২১</span>মাথার খুলিতে ছিদ্রাল প্লেটের মতো অস্থি কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ফ্রন্টাল</div><div class=\"op ok\"><b>খ.</b> এথময়েড<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> টেম্পোরাল</div><div class=\"op\"><b>ঘ.</b> অক্সিপিটাল</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> করোটিকার এথময়েড (Ethmoid) অস্থির ঊর্ধ্বভাগে একটি অনুভূমিক ছিদ্রাল প্লেট থাকে, যাকে ক্রিব্রিফর্ম প্লেট (Cribriform plate) বলে।</div><div class=\"ln\">এই ছিদ্রগুলোর মধ্য দিয়ে অলফ্যাক্টরি স্নায়ু নাসাগহ্বরে প্রবেশ করে ঘ্রাণ উদ্দীপনা মস্তিষ্কে নিয়ে যায়।</div><div class=\"ln\">তাই এথময়েডকে মাথার খুলির ছিদ্রাল প্লেটের মতো অস্থি বলা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২২</span>ভ্রূণদেহে কোন অঙ্গানু হতে লোহিত কণিকা সৃষ্টি হয়না-</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> থাইময়েড<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> থাইমাস</div><div class=\"op\"><b>গ.</b> প্লীহা</div><div class=\"op\"><b>ঘ.</b> যকৃৎ</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মানব ভ্রূণদেহে (Embryonic stage) লোহিত রক্তকণিকা (RBC) প্রধানত কুসুম থলি (Yolk sac), যকৃৎ (Liver), প্লীহা (Spleen) এবং থাইমাস (Thymus) গ্রন্থি থেকে উৎপন্ন হয়।</div><div class=\"ln\">জন্মের পর লাল অস্থিমজ্জা থেকে লোহিত রক্তকণিকা তৈরি হয়।</div><div class=\"ln\">&#39;থাইময়েড&#39; নামক কোনো অঙ্গাণু মানবদেহে নেই এবং এখান থেকে লোহিত কণিকা সৃষ্টি হয় না।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৩</span>মুক্তিযুদ্ধকালীন কোন তারিখে বুদ্ধিজীবীদের ওপর ব্যাপক হত্যাকাণ্ড সংঘটিত হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ২০শে মার্চ ১৯৭১</div><div class=\"op\"><b>খ.</b> ২৬শে মার্চ ১৯৭১</div><div class=\"op ok\"><b>গ.</b> ১৪ই ডিসেম্বর ১৯৭১<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> ১৬ই ডিসেম্বর ১৯৭১</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৯৭১ সালের মহান মুক্তিযুদ্ধ চলাকালীন বিজয়ের ঠিক পূর্ব মুহূর্তে পাকিস্তানি হানাদার বাহিনী ও তাদের স্থানীয় দোসররা (আলবদর, আলশামস ও রাজাকার) বাঙালি জাতিকে মেধাশূন্য করার জন্য পরিকল্পিতভাবে দেশের শ্রেষ্ঠ বুদ্ধিজীবীদের (শিক্ষক, চিকিৎসক, সাংবাদিক, সাহিত্যিক ও বিজ্ঞানী) ধরে নিয়ে নির্মমভাবে হত্যা করে।</div><div class=\"ln\">এই ব্যাপক হত্যাকাণ্ডটি মূলত ১৪ই ডিসেম্বর ১৯৭১ তারিখে সংঘটিত হয়।</div><div class=\"ln\">এই দিনটিকে স্মরণ করে প্রতি বছর ১৪ই ডিসেম্বর &#39;শহীদ বুদ্ধিজীবী দিবস&#39; পালন করা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৪</span>ছত্রাকের কোষপ্রাচীর ও কোষঝিল্লির প্রধান উপাদান যথাক্রমে-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Chitin &amp; Cellulose</div><div class=\"op ok\"><b>খ.</b> Chitin &amp; Ergosterol<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> Cellulose &amp; Ergosterol</div><div class=\"op\"><b>ঘ.</b> Chitin &amp; Starch</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ছত্রাকের কোষপ্রাচীর (Cell wall) প্রধানত কাইটিন (Chitin) নামক নাইট্রোজেনযুক্ত পলিস্যাকারাইড দ্বারা গঠিত।</div><div class=\"ln\">অন্যদিকে, ছত্রাকের কোষঝিল্লি বা প্লাজমামেমব্রেনের (Cell membrane) প্রধান লিপিড উপাদান হলো আরগোস্টেরল (Ergosterol), যা অন্যান্য প্রাণীকোষের কোলেস্টেরলের সমতুল্য হিসেবে কাজ করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৫</span>ট্রান্সফরমারের ক্ষেত্রে সঠিক নয় কোনটি?</div><div class=\"opts\"><div class=\"op smo\"><b>ক.</b> স্টেপ আপ - অল্প বিভব থেকে অধিক বিভব</div><div class=\"op smo ok\"><b>খ.</b> স্টেপ ডাউন - অধিক প্রবাহকে অল্প প্রবাহে<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>গ.</b> স্টেপ আপ - অধিক প্রবাহকে অল্প প্রবাহে</div><div class=\"op smo\"><b>ঘ.</b> স্টেপ ডাউন - অধিক বিভবকে অল্প বিভব</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ট্রান্সফরমারের ক্ষেত্রে শক্তির সংরক্ষণশীলতা নীতি অনুযায়ী, ক্ষমতা ধ্রুব থাকে (</div><div class=\"dm m\" data-d=\"1\" data-t=\"P = VI = \\text{constant}\"></div><div class=\"ln\">)।</div><div class=\"ln\">অর্থাৎ, বিভব (V) বাড়লে প্রবাহ (I) কমে এবং বিভব কমলে প্রবাহ বাড়ে।</div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">স্টেপ-আপ (আরোহী) ট্রান্সফরমার: অল্প বিভবকে অধিক বিভবে এবং অধিক প্রবাহকে অল্প প্রবাহে রূপান্তর করে।</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">স্টেপ-ডাউন (অবরোহী) ট্রান্সফরমার: অধিক বিভবকে অল্প বিভবে এবং অল্প প্রবাহকে অধিক প্রবাহে রূপান্তর করে।</div></div></div><div class=\"ln\">অতএব, (খ) অপশনে উল্লিখিত &#39;স্টেপ ডাউন - অধিক প্রবাহকে অল্প প্রবাহে&#39; তথ্যটি সঠিক নয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৬</span>DNA ভাইরাসের উদাহরণ নয় কোনটি?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> রিওভাইরাস<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> TIV</div><div class=\"op\"><b>গ.</b> M13 কলিফাজ</div><div class=\"op\"><b>ঘ.</b> এডেনোভাইরাস</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল ও আবুল হাসান স্যারের জীববিজ্ঞান ১ম পত্র বইয়ের তথ্যমতে, রিওভাইরাস (Reovirus) হলো একটি দ্বিসূত্রক RNA ভাইরাস (double-stranded RNA virus)।</div><div class=\"ln\">অন্যদিকে TIV (Tipula Iridescent Virus), M13 কলিফাজ এবং এডেনোভাইরাস হলো DNA ভাইরাস।</div><div class=\"ln\">সুতরাং, রিওভাইরাস DNA ভাইরাসের উদাহরণ নয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৭</span>এ এর গুরুত্ব নয় কোনটি?</div><div class=\"opts\"><div class=\"op smo\"><b>ক.</b> শব্দের বেগ নির্ণয় করা যায়</div><div class=\"op smo\"><b>খ.</b> গ্যাসের পারমাণবিক বিন্যাস জানা যায়</div><div class=\"op smo\"><b>গ.</b> রুদ্রতাপ প্রক্রিয়া আলোচনা করা যায়</div><div class=\"op smo ok\"><b>ঘ.</b> গ্যাসের আণবিক বিন্যাস জানা যায়<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পদার্থবিজ্ঞান ২য় পত্রের &#39;তাপগতিবিদ্যা&#39; অধ্যায় অনুসারে, স্থির চাপে ও স্থির আয়তনে গ্যাসের আপেক্ষিক তাপদ্বয়ের অনুপাতকে <span class=\"m\" data-t=\"\\gamma\"></span> (gamma) বলা হয়।</div><div class=\"ln\"><span class=\"m\" data-t=\"\\gamma\"></span> এর গুরুত্বসমূহ হলো: (১) শব্দের বেগ নির্ণয় করা যায় (</div><div class=\"dm m\" data-d=\"1\" data-t=\"v = \\sqrt{\\frac{\\gamma P}{\\rho}}\"></div><div class=\"ln\">), (২) গ্যাসের পারমাণবিকতা বা পারমাণবিক বিন্যাস জানা যায় (যেমন- একপরমাণুক গ্যাসের জন্য <span class=\"m\" data-t=\"\\gamma = 1.67\"></span>), এবং (৩) রুদ্ধতাপীয় প্রক্রিয়া আলোচনা করা যায়।</div><div class=\"ln\">গ্যাসের আণবিক বিন্যাস জানার ক্ষেত্রে <span class=\"m\" data-t=\"\\gamma\"></span> এর কোনো ভূমিকা নেই।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৮</span>৬ বছর বয়সী বাচ্চাদের দুধ দাঁত (Milk teeth) এর সংখ্যা কতটি?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ২০<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ৩৬</div><div class=\"op\"><b>গ.</b> ৩২</div><div class=\"op\"><b>ঘ.</b> ১২</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মানুষের শৈশবকালে যে অস্থায়ী দাঁত গজায় তাকে দুধ দাঁত (Milk teeth বা Deciduous teeth) বলে।</div><div class=\"ln\">৬ বছর বয়সী বাচ্চাদের দুধ দাঁতের মোট সংখ্যা থাকে ২০টি।</div><div class=\"ln\">দুধ দাঁতের দন্তসংকেত হলো:</div><div class=\"dm m\" data-d=\"1\" data-t=\"I \\frac{2}{2}, C \\frac{1}{1}, PM \\frac{0}{0}, M \\frac{2}{2} \\times 2 = 20\"></div><div class=\"ln\">।</div><div class=\"ln\">অর্থাৎ, শিশুদের দুধ দাঁতে কোনো প্রাক-পেষণ (Premolar) দাঁত থাকে না এবং পেষণ (Molar) দাঁত থাকে ৪ জোড়া।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৯</span>ভাইরোলজির জনক বলা হয় কাকে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Stanly</div><div class=\"op ok\"><b>খ.</b> Dimitry Ivanovosky<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> Adlof Mayer</div><div class=\"op\"><b>ঘ.</b> Edward Jenner</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৮৯২ সালে রুশ উদ্ভিদবিজ্ঞানী ডিমিত্রি ইভানভস্কি (Dmitri Ivanovsky) তামাকের মোজাইক রোগ নিয়ে গবেষণা করার সময় প্রমাণ করেন যে, তামাকের রোগাক্রান্ত পাতার রস ব্যাকটেরিয়ারোধক ফিল্টার দিয়ে ছেঁকে নেওয়ার পরও সুস্থ তামাক গাছে রোগ সৃষ্টি করতে সক্ষম।</div><div class=\"ln\">এই আবিষ্কারের মাধ্যমে ভাইরাসের অস্তিত্ব প্রথম প্রমাণিত হয়, তাই তাঁকে &#39;ভাইরোলজির জনক&#39; (Father of Virology) বলা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩০</span>ঘূর্ণিত গতি একটি বিশেষ ধরনের-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> দোলন গতি</div><div class=\"op\"><b>খ.</b> রৈখিক গতি</div><div class=\"op ok\"><b>গ.</b> অপর্বৃত্ত গতি<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> কোনটাই নয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পদার্থবিজ্ঞান ১ম পত্রের &#39;পর্যায়বৃত্ত গতি&#39; অধ্যায় অনুসারে, ঘূর্ণন গতি (যেমন- ঘড়ির কাঁটার গতি, বৈদ্যুতিক পাখার গতি) হলো একটি বিশেষ ধরনের পর্যায়বৃত্ত গতি (Periodic motion)।</div><div class=\"ln\">প্রশ্নে মুদ্রণজনিত ভুলের কারণে &#39;পর্যায়বৃত্ত গতি&#39; শব্দটি &#39;অপর্বৃত্ত গতি&#39; হিসেবে এসেছে।</div><div class=\"ln\">যেহেতু ঘূর্ণন গতিতে কণাগুলো একটি নির্দিষ্ট বিন্দুকে কেন্দ্র করে নির্দিষ্ট সময় পর পর একই দিক থেকে অতিক্রম করে, তাই এটি পর্যায়বৃত্ত গতির অন্তর্ভুক্ত।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩১</span>কোন যৌগটি অধিক সমযোজী?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> KCl</div><div class=\"op ok\"><b>খ.</b> LiCl<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> NaCl</div><div class=\"op\"><b>ঘ.</b> CsCl</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ফাযানের নীতি (Fajan&#39;s Rules) অনুসারে, অ্যানায়নের আকার ও চার্জ একই থাকলে ক্যাটায়নের আকার যত ছোট হবে, তার পোলারায়ন ক্ষমতা তত বেশি হবে এবং যৌগটি তত বেশি সমযোজী বৈশিষ্ট্য লাভ করবে।</div><div class=\"ln\">এখানে ক্যাটায়নগুলোর আকারের ক্রম হলো: Li⁺ &lt; Na⁺ &lt; K⁺ &lt; Cs⁺।</div><div class=\"ln\">যেহেতু Li⁺ ক্যাটায়নের আকার সবচেয়ে ছোট, তাই LiCl যৌগটির পোলারায়ন সবচেয়ে বেশি ঘটে এবং এটি সবচেয়ে বেশি সমযোজী।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩২</span>পৃথিবীতে তাহমিদের ভর ৬০ কেজি হলে চাঁদে তার ভর কত হবে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ৬ কেজি</div><div class=\"op ok\"><b>খ.</b> ৬০ কেজি<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ১০ কেজি</div><div class=\"op\"><b>ঘ.</b> ৩৬০ কেজি</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ভর (Mass) বস্তুর একটি ধ্রুবক ধর্ম, যা স্থান পরিবর্তনের সাথে পরিবর্তিত হয় না।</div><div class=\"ln\">পৃথিবীতে তাহমিদের ভর ৬০ কেজি হলে, চাঁদেও তার ভর ৬০ কেজি-ই থাকবে।</div><div class=\"ln\">তবে চাঁদে অভিকর্ষজ ত্বরণ পৃথিবীর ১/৬ গুণ হওয়ায় সেখানে তার ওজন পরিবর্তিত হয়ে (৬০ × ১/৬) = ১০ কেজি-বল বা ৯৮ নিউটন হবে।</div><div class=\"ln\">কিন্তু প্রশ্নে &#39;ভর&#39; জানতে চাওয়া হয়েছে, তাই উত্তর অপরিবর্তিত থাকবে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৩</span>দুধ থেকে কোন প্রক্রিয়ায় দই তৈরি হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> অক্সিডেশন</div><div class=\"op ok\"><b>খ.</b> কোয়াগলেশন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ইমালশন</div><div class=\"op\"><b>ঘ.</b> পেপটাইজেশন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> দুধ থেকে দই তৈরির প্রক্রিয়াটি হলো কোয়াগুলেশন (Coagulation) বা তঞ্চন।</div><div class=\"ln\">দুধে ল্যাকটোব্যাসিলাস ব্যাকটেরিয়া ল্যাকটোজ চিনিকে ল্যাকটিক অ্যাসিডে রূপান্তরিত করে।</div><div class=\"ln\">এই অ্যাসিডের কারণে দুধের পিএইচ (pH) কমে যায় এবং দুধের প্রধান প্রোটিন &#39;কেসিন&#39; (Casein) জমাট বেঁধে বা কোয়াগুলেশন প্রক্রিয়ায় দইয়ে পরিণত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৪</span>দিনে কত গ্রাম এর বেশি প্যারাসিটামল খেলে কিডনি নষ্ট হতে পারে?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> 4g<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> 2g</div><div class=\"op\"><b>গ.</b> 8g</div><div class=\"op\"><b>ঘ.</b> 10g</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> এইচএসসি রসায়ন দ্বিতীয় পত্রের (কর্মমুখী রসায়ন) মূল বইয়ের তথ্য অনুযায়ী, একজন প্রাপ্তবয়স্ক মানুষের জন্য প্যারাসিটামলের দৈনিক নিরাপদ সর্বোচ্চ মাত্রা হলো ৪ গ্রাম (4g)।</div><div class=\"ln\">দিনে ৪ গ্রামের বেশি প্যারাসিটামল গ্রহণ করলে তা লিভারের মারাত্মক ক্ষতি (Hepatotoxicity) এবং কিডনি বিকল বা নষ্ট করতে পারে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৫</span>&#39;অপরাজেয় বাংলা&#39; ভাস্কর্যটি কে নির্মাণ করেন?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> হামিদুর রহমান</div><div class=\"op ok\"><b>খ.</b> সৈয়দ আব্দুল্লাহ খালিদ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> শামীম সিকদার</div><div class=\"op\"><b>ঘ.</b> মোত্তোফ মনওয়ার</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ঢাকা বিশ্ববিদ্যালয়ে অবস্থিত মহান মুক্তিযুদ্ধের স্মারক ভাস্কর্য &#39;অপরাজেয় বাংলা&#39;-র ভাস্কর হলেন সৈয়দ আব্দুল্লাহ খালিদ।</div><div class=\"ln\">এটি ১৯৭৯ সালের ১৬ ডিসেম্বর আনুষ্ঠানিকভাবে উদ্বোধন করা হয়।</div><div class=\"ln\">অন্যদিকে, হামিদুর রহমান হলেন কেন্দ্রীয় শহীদ মিনারের নকশাকার এবং শামীম সিকদার &#39;সোপার্জিত স্বাধীনতা&#39; ভাস্কর্যের স্থপতি।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৬</span>কেপলারের সূত্রানুসারে গ্রহের কক্ষপথ-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> পরাবৃত্তাকার</div><div class=\"op\"><b>খ.</b> বৃত্তাকার</div><div class=\"op ok\"><b>গ.</b> উপবৃত্তাকার<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> অর্ধবৃত্তাকার</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> কেপলারের প্রথম সূত্র বা কক্ষপথের সূত্র (Law of Orbits) অনুসারে, প্রতিটি গ্রহই সূর্যকে একটি ফোকাসে রেখে উপবৃত্তাকার (Elliptical) কক্ষপথে পরিভ্রমণ করে।</div><div class=\"ln\">সুতরাং, গ্রহের কক্ষপথ উপবৃত্তাকার।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৭</span>The word &#39;Homely&#39; belongs to what parts of speech?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Noun</div><div class=\"op ok\"><b>খ.</b> Adjective<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> Verb</div><div class=\"op\"><b>ঘ.</b> Adverb</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> Generally, when the suffix &#39;-ly&#39; is added to a noun, it becomes an adjective (Noun + ly = Adjective). Here, &#39;Home&#39; is a noun, and adding &#39;-ly&#39; to it forms &#39;Homely&#39;, which is an adjective meaning cozy, simple, or comfortable (e.g., &#39;a homely atmosphere&#39;). Other examples include friendly, motherly, brotherly, and lovely.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৮</span>অণুসমূহের মধ্যে সর্বাধিক কম্পন, আবর্তন ও স্থানান্তর গতি থাকে কোন পদার্থে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> প্লাজমা</div><div class=\"op\"><b>খ.</b> তরল</div><div class=\"op\"><b>গ.</b> কঠিন</div><div class=\"op ok\"><b>ঘ.</b> গ্যাসীয়<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গ্যাসীয় পদার্থের অণুগুলোর মধ্যে আন্তঃআণবিক আকর্ষণ বল সবচেয়ে কম এবং আন্তঃআণবিক দূরত্ব সবচেয়ে বেশি থাকে।</div><div class=\"ln\">এর ফলে গ্যাসীয় অণুগুলো অত্যন্ত মুক্ত ও বিশৃঙ্খলভাবে চলাচল করতে পারে।</div><div class=\"ln\">তাই গ্যাসীয় পদার্থে অণুসমূহের সর্বাধিক স্থানান্তর (translational), আবর্তন (rotational) ও কম্পন (vibrational) গতি দেখা যায়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৯</span>Which one is the correct sentence?</div><div class=\"opts\"><div class=\"op smo\"><b>ক.</b> He is comparatively better today.</div><div class=\"op ok\"><b>খ.</b> He is better today.<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>গ.</b> He is good today than before.</div><div class=\"op smo\"><b>ঘ.</b> He is best today than yesterday.</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> Option (খ) is grammatically correct.</div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">Option (ক) is incorrect because &#39;comparatively&#39; should not be used with a comparative degree adjective like &#39;better&#39; (double comparative error). It should be &#39;He is comparatively well today&#39; or &#39;He is better today&#39;.</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">Option (গ) is incorrect because the conjunction &#39;than&#39; requires a comparative degree (&#39;better&#39;), not a positive degree (&#39;good&#39;).</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">Option (ঘ) is incorrect because &#39;than&#39; requires a comparative degree (&#39;better&#39;), not a superlative degree (&#39;best&#39;).</div></div></div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪০</span>অব্যবহৃত LiAlH4 কে বিনষ্ট করতে নিচের কোনটির জলীয় দ্রবণ ব্যবহার হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> NaOH</div><div class=\"op\"><b>খ.</b> MgSO4</div><div class=\"op\"><b>গ.</b> LiOH</div><div class=\"op ok\"><b>ঘ.</b> H2SO4<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> লিথিয়াম অ্যালুমিনিয়াম হাইড্রাইড <span class=\"nw\">(<span class=\"m\" data-t=\"LiAlH_4\"></span>)</span> একটি অত্যন্ত শক্তিশালী ও তীব্র বিজারক পদার্থ।</div><div class=\"ln\">কোনো রাসায়নিক বিক্রিয়া শেষে পাত্রে অব্যবহৃত বা অতিরিক্ত <span class=\"m\" data-t=\"LiAlH_4\"></span> থেকে গেলে তা অত্যন্ত সক্রিয় ও বিপজ্জনক হতে পারে।</div><div class=\"ln\">এই অব্যবহৃত <span class=\"m\" data-t=\"LiAlH_4\"></span> কে নিরাপদভাবে বিনষ্ট বা নিষ্ক্রিয় করার জন্য লঘু সালফিউরিক অ্যাসিড <span class=\"nw\">(<span class=\"m\" data-t=\"H_2SO_4\"></span>)</span> এর জলীয় দ্রবণ ব্যবহার করা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪১</span>Identify the correct passive form of &quot;Does he speak English well?&quot;</div><div class=\"opts\"><div class=\"op smo\"><b>ক.</b> Is English Spoken well to him?</div><div class=\"op smo\"><b>খ.</b> Is English spoke well by him?</div><div class=\"op smo ok\"><b>গ.</b> Is English Spoken well by him?<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>ঘ.</b> Was English spoke well by him?</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The active sentence &quot;Does he speak English well?&quot; is in the Present Simple tense. To convert an interrogative sentence in the Present Simple tense into passive voice, the structure is: &#39;Am/Is/Are + Subject (original object) + Past Participle of verb (V3) + extension + by + Object (original subject)?&#39;. Here, &#39;English&#39; is singular, so we use &#39;Is&#39;. The past participle of &#39;speak&#39; is &#39;spoken&#39;. Therefore, the correct passive form is &quot;Is English spoken well by him?&quot;.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪২</span>বাংলাদেশের জাতীয় পাখি কোনটি?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> দোয়েল<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ময়না</div><div class=\"op\"><b>গ.</b> কোকিল</div><div class=\"op\"><b>ঘ.</b> ময়ূর</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বাংলাদেশের জাতীয় পাখি হলো দোয়েল (Oriental Magpie-Robin)।</div><div class=\"ln\">এর বৈজ্ঞানিক নাম Copsychus saularis।</div><div class=\"ln\">এটি একটি ছোট আকারের চঞ্চল পাখি যা বাংলাদেশ ও ভারতীয় উপমহাদেশের বিভিন্ন অঞ্চলে লোকালয়ের কাছাকাছি ঝোপঝাড়ে প্রচুর পরিমাণে দেখা যায়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৩</span>নিম্ন তাপমাত্রায় সংরক্ষণ (Low temperature conservation) করা যায় কোনটি?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> Seed<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> Rhizome</div><div class=\"op\"><b>গ.</b> Runner</div><div class=\"op\"><b>ঘ.</b> Flower</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> উদ্ভিদ বিজ্ঞানের জিন ব্যাংক বা বীজ ব্যাংকে (Seed Bank) বীজকে (Seed) অত্যন্ত নিম্ন তাপমাত্রায় (সাধারণত -২০° সেলসিয়াস বা তরল নাইট্রোজেনে -১৯৬° সেলসিয়াসে ক্রায়োসংরক্ষণ বা Cryopreservation পদ্ধতিতে) দীর্ঘকাল সংরক্ষণ করা যায়।</div><div class=\"ln\">রাইজোম, রানার বা ফুলকে এভাবে দীর্ঘমেয়াদে সংরক্ষণ করা অত্যন্ত জটিল এবং সাধারণত এগুলোকে এভাবে সংরক্ষণ করা হয় না।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৪</span>কোন গোলকের অভ্যন্তরে যে কোন বিন্দুতে বিভব পৃষ্ঠের বিভবের?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> সমান<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> বেশি</div><div class=\"op\"><b>গ.</b> কম</div><div class=\"op\"><b>ঘ.</b> পৃষ্ঠে বিভব শূন্য হয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> স্থির তড়িৎ সূত্রানুযায়ী, কোনো চার্জিত পরিবাহী গোলকের অভ্যন্তরে তড়িৎ প্রাবল্য (Electric Field, E) শূন্য হয়।</div><div class=\"ln\">যেহেতু E = -dV/dr = 0, সেহেতু গোলকের অভ্যন্তরে বিভব (V) ধ্রুবক বা অপরিবর্তিত থাকে।</div><div class=\"ln\">অর্থাৎ, গোলকের অভ্যন্তরে যেকোনো বিন্দুতে বিভব গোলকের পৃষ্ঠের বিভবের সমান হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৫</span>ব্লু টি পেপার পানি শুষে নেয়-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> পৃষ্ঠটানের ক্রিয়ায়</div><div class=\"op\"><b>খ.</b> সান্দ্রতার ক্রিয়ায়</div><div class=\"op ok\"><b>গ.</b> কৈশিক ক্রিয়ায়<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> তলটানের ক্রিয়ায়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ব্লটিং পেপার বা ব্লু টি পেপার পানি শুষে নেয় কৈশিক ক্রিয়ার (Capillary action) মাধ্যমে।</div><div class=\"ln\">ব্লটিং পেপারের তন্তুগুলোর মধ্যে অসংখ্য অতি সূক্ষ্ম ছিদ্র বা ফাঁকা স্থান থাকে, যা সরু কৈশিক নলের মতো আচরণ করে।</div><div class=\"ln\">তরলের পৃষ্ঠটান ও আসঞ্জন বলের কারণে পানি এই সূক্ষ্ম নল বেয়ে অভিকর্ষের বিপরীতে ওপরে উঠে আসে এবং পেপারটি পানি শোষণ করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৬</span>Fill in the gap using the appropriate word. The film was really boring. It was ____ I have ever seen.</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> most boring film</div><div class=\"op ok\"><b>খ.</b> the most boring film<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> the film more boring</div><div class=\"op\"><b>ঘ.</b> the more boring film</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> In English grammar, when comparing one thing with all others of its kind (indicated by the phrase &#39;I have ever seen&#39;), the superlative degree is used. The structure for the superlative degree is &#39;the + superlative adjective + noun&#39;. Therefore, &#39;the most boring film&#39; is the correct choice.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৭</span>ফাগোসাইটিস কণিকা ওলো কোন রাসায়নিক পদার্থ ক্ষরণের মাধ্যমে অনাক্রম্যতায় সাড়া প্রদান করে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> লিফোকাইনস</div><div class=\"op ok\"><b>খ.</b> মনোকাইনস<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ইন্টারফেরন</div><div class=\"op\"><b>ঘ.</b> লাইসোজাইম</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মানবদেহের অনাক্রম্যতায় (Immunity) ফাগোসাইটিক কোষসমূহ (যেমন- মনোসাইট ও ম্যাক্রোফেজ) এক ধরণের রাসায়নিক পদার্থ ক্ষরণ করে সংকেত প্রদান করে, যাকে মনোকাইনস (Monokines) বলা হয়।</div><div class=\"ln\">অন্যদিকে, লিম্ফোসাইট থেকে ক্ষরিত রাসায়নিক পদার্থকে লিম্ফোকাইনস (Lymphokines) বলে এবং ভাইরাস আক্রান্ত কোষ থেকে ইন্টারফেরন নিঃসৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৮</span>What is the synonym for the word &#39;Destroy&#39;?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ruin<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> drop</div><div class=\"op\"><b>গ.</b> retain</div><div class=\"op\"><b>ঘ.</b> injurious</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> &#39;Destroy&#39; শব্দটির অর্থ হলো ধ্বংস করা বা বিনষ্ট করা।</div><div class=\"ln\">বিকল্পগুলোর মধ্যে &#39;ruin&#39; শব্দের অর্থও ধ্বংস করা বা নষ্ট করা, যা &#39;Destroy&#39;-এর সঠিক সমার্থক শব্দ (Synonym)।</div><div class=\"ln\">অন্য অপশনগুলোর অর্থ: drop (ফেলে দেওয়া), retain (ধরে রাখা/সংরক্ষণ করা), injurious (ক্ষতিকর)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৯</span>নিচের কোনটিতে সেন্ট্রিওল উপস্থিত থাকে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ইস্ট</div><div class=\"op\"><b>খ.</b> অ্যানজিওস্পার্ম</div><div class=\"op\"><b>গ.</b> জিম্নোস্পার্ম</div><div class=\"op ok\"><b>ঘ.</b> ডায়াটম<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> standard উদ্ভিদবিজ্ঞান বই (যেমন- আবুল হাসান) অনুযায়ী, উচ্চশ্রেণীর উদ্ভিদকোষে (অ্যানজিওস্পার্ম ও জিম্নোস্পার্ম) এবং অধিকাংশ ছত্রাকে (যেমন- ইস্ট) সেন্ট্রিওল থাকে না।</div><div class=\"ln\">তবে নিম্নশ্রেণীর উদ্ভিদ যেমন শৈবাল (ডায়াটম এক প্রকার এককোষী শৈবাল), মস ও ফার্ন জাতীয় উদ্ভিদের কোষে সেন্ট্রিওল উপস্থিত থাকে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫০</span>যুদ্ধজাহাজ ধ্বংসকারী টর্পেডো তৈরিতে নিচের কোনটি ব্যবহার করা হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> নাইট্রোগ্লিসারিন</div><div class=\"op ok\"><b>খ.</b> টিএনটি<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ফেনল</div><div class=\"op\"><b>ঘ.</b> ক্লোরোবেঞ্জিন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> রসায়ন দ্বিতীয় পত্রের (হাজারী ও নাগ) জৈব রসায়ন অধ্যায় অনুযায়ী, টিএনটি (TNT - Trinitrotoluene) একটি অত্যন্ত শক্তিশালী বিস্ফোরক।</div><div class=\"ln\">এটি যুদ্ধক্ষেত্রে বোমা, শেল, গ্রেনেড এবং যুদ্ধজাহাজ ও সাবমেরিন ধ্বংসকারী টর্পেডো (Torpedo) তৈরিতে ব্যবহৃত হয়।</div><div class=\"ln\">অন্যদিকে, নাইট্রোগ্লিসারিন ডিনামাইট তৈরিতে ব্যবহৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫১</span>বৈদ্যুতিক বাল্ব, optical যন্ত্রপাতি তৈরিতে কোন কাঁচ ব্যবহার করা হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> সোডা গ্লাস</div><div class=\"op\"><b>খ.</b> Refractory glass</div><div class=\"op ok\"><b>গ.</b> Flint glass<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Opal glass</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ফ্লিন্ট কাঁচ (Flint glass) মূলত পটাসিয়াম ও লেড সিলিকেটের মিশ্রণ।</div><div class=\"ln\">এর প্রতিসরণাঙ্ক উচ্চ এবং এটি অত্যন্ত স্বচ্ছ ও উজ্জ্বল হওয়ায় এটি অপটিক্যাল যন্ত্রপাতি (যেমন- লেন্স, প্রিজম) এবং বৈদ্যুতিক বাল্ব তৈরিতে ব্যবহৃত হয়।</div><div class=\"ln\">অন্যদিকে, সোডা কাঁচ (Soda glass) সাধারণ কাচসামগ্রী যেমন জানালার কাঁচ, বোতল ইত্যাদি তৈরিতে ব্যবহৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫২</span>What is the noun form of the word &#39;laugh&#39;?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Laughing</div><div class=\"op\"><b>খ.</b> Laughable</div><div class=\"op ok\"><b>গ.</b> Laughter<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Laughingly</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> &#39;Laugh&#39; শব্দটি একটি verb (যার অর্থ হাসা)।</div><div class=\"ln\">এর abstract noun বা বিশেষ্য রূপ হলো &#39;Laughter&#39; (যার অর্থ হাসি)।</div><div class=\"ln\">অন্যান্য অপশনগুলোর মধ্যে &#39;Laughable&#39; হলো adjective (হাস্যকর), &#39;Laughingly&#39; হলো adverb (হেসে হেসে), এবং &#39;Laughing&#39; হলো present participle বা gerund।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৩</span>কোনটির তরঙ্গ দৈর্ঘ্য সবচেয়ে কম?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> বেগুনি<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> লাল</div><div class=\"op\"><b>গ.</b> সবুজ</div><div class=\"op\"><b>ঘ.</b> নীল</d
