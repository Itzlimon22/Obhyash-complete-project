<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>মেডিকেল ভর্তি মডেল টেস্ট ০১</title>
<link rel="stylesheet" href="/Users/limon/Obhyash-complete-project/obhyash-web/public/katex/katex.min.css">
<style>
@font-face {
  font-family: 'Kalpurush';
  src: url('/Users/limon/Obhyash-complete-project/obhyash-web/public/fonts/Kalpurush.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

@page {
  size: 210mm 297mm;
  margin: 0;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
body {
  font-family: 'Times New Roman', 'Liberation Serif', 'Kalpurush', 'FreeSans', serif;
  color: #1c2b33;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.page {
  position: relative;
  width: 794px;
  height: 1122px;
  overflow: hidden;
  background: #fff;
  break-after: page;
  page-break-after: always;
}
.page:last-child {
  break-after: auto;
  page-break-after: auto;
}

/* Page 1 Hero Header */
.hdr {
  position: absolute;
  left: 40px;
  top: 40px;
  width: 714px;
  height: 128px;
  border-radius: 28px;
  background: #244f5d;
  overflow: hidden;
  color: #fff;
  text-align: center;
  z-index: 2;
}
.hdr .t {
  font-size: 42px;
  font-weight: bold;
  margin-top: 14px;
  line-height: 1.25;
}
.hdr .s {
  font-size: 16.5px;
  margin-top: 6px;
  opacity: 0.95;
}
.hdr .bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 24px;
  background: #c64040;
}

/* Page 2+ Mini Header Strip */
.rh {
  position: absolute;
  left: 40px;
  right: 40px;
  top: 34px;
  height: 30px;
  border-bottom: 1px solid #d5dadd;
  z-index: 2;
}
.rh a {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  color: #0f4c5c;
  text-decoration: none;
  font-size: 15px;
  font-weight: bold;
  white-space: nowrap;
}
.rh a svg { width: 22px; height: 22px; }
.rh .nm {
  position: absolute;
  right: 0;
  top: 3px;
  color: #0f4c5c;
  font-size: 15px;
  font-weight: bold;
  white-space: nowrap;
}

/* Columns */
.col {
  position: absolute;
  width: 344px;
  z-index: 1;
}
.card {
  width: 344px;
  margin-bottom: 0;
}
.col .card + .card {
  margin-top: 14px;
}

/* Question Box */
.qb {
  background: #e6f1f1;
  border-left: 6px solid #0f4c5c;
  border-radius: 14px;
  padding: 11px 12px 11px 14px;
  font-weight: bold;
  font-size: 15.5px;
  line-height: 1.5;
}
.bd {
  display: inline-block;
  background: #d62839;
  color: #fff;
  border-radius: 8px;
  padding: 0 9px;
  margin-right: 8px;
  font-size: 14px;
  line-height: 22px;
  font-weight: bold;
}

/* Options */
.opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 8px 0;
}
.op {
  position: relative;
  background: #fff;
  border: 1.6px solid #c9cfd3;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 14.5px;
  line-height: 1.4;
  min-height: 34px;
  display: block;
}
.op b { margin-right: 5px; }
.op.smo { font-size: 13.4px; }
.op.ok {
  border-color: #2e9e57;
  background: #e8f6ec;
  padding-right: 26px;
}
.ck {
  position: absolute;
  right: 7px;
  top: 50%;
  margin-top: -8px;
  width: 16px;
  height: 16px;
}

/* Explanation */
.ex {
  background: #fdf0ec;
  border-radius: 14px;
  padding: 9px 12px;
  font-size: 13.6px;
  line-height: 1.5;
}
.ln { margin: 2px 0; }
.lab { color: #d62839; font-weight: bold; }
.bl { display: flex; gap: 6px; margin: 3px 0; }
.mk {
  flex: none;
  margin-top: 5px;
  width: 0;
  height: 0;
  border-left: 6px solid #d62839;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
}
.bc { flex: 1; min-width: 0; }
.note { font-style: italic; color: #555; margin-top: 3px; }
.dm { text-align: left; margin: 2px 0 2px 6px; }

/* KaTeX typography */
.katex { white-space: nowrap; font-size: 1.05em; }
.wrapm .katex, .wrapm.katex { white-space: normal; }
.dm .katex-display { margin: 0; }
.dm .katex-display > .katex { text-align: left; }
.nw { white-space: nowrap; }
.dl::before { content: "$"; }

/* Footer */
.foot {
  position: absolute;
  left: 40px;
  right: 40px;
  top: 1063px;
  border-top: 1px solid #d5dadd;
  height: 46px;
}
.foot a {
  position: absolute;
  left: 0;
  top: 9px;
  color: #0f4c5c;
  text-decoration: none;
  font-size: 16px;
  white-space: nowrap;
  display: flex;
  align-items: center;
}
.foot .site {
  font-family: 'Times New Roman', 'Liberation Serif', serif;
  font-weight: bold;
  font-size: 17px;
  margin: 0 5px;
}
.pg {
  position: absolute;
  right: 0;
  top: 9px;
  font-size: 16px;
  color: #0f4c5c;
}
.pg i { font-style: normal; margin-left: 5px; }

#measure {
  position: absolute;
  left: -9999px;
  top: 0;
  width: 344px;
  visibility: hidden;
}
#measure .card { margin-bottom: 0; }

@media print {
  #measure { display: none !important; }
  body { background: #fff !important; }
}
</style>
</head>

<script>
const CARDS = ["<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১</span>টেরিসের স্পোরাঞ্জিয়া একত্রিত হয়ে পত্রকের কিনারায় কী গঠন করে?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> সোরাস (Sorus)<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>খ.</b> ফলস ইন্ডুসিয়াম (False indusium)</div><div class=\"op\"><b>গ.</b> স্পোরোফিল (Sporophyll)</div><div class=\"op\"><b>ঘ.</b> অমরা (Placenta)</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল ও আবুল হাসান স্যারের জীববিজ্ঞান ১ম পত্র (উদ্ভিদবিজ্ঞান) বইয়ের &#39;pteridophyta&#39; অধ্যায় অনুযায়ী, টেরিস (Pteris) উদ্ভিদের স্পোর উৎপাদনকারী অঙ্গ হলো স্পোরাঞ্জিয়াম (Sporangium)।</div><div class=\"ln\">এই স্পোরাঞ্জিয়াগুলো একত্রিত হয়ে পত্রকের কিনারায় যে পুঞ্জ বা গুচ্ছ গঠন করে, তাকে সোরাস (Sorus) বলে।</div><div class=\"ln\">পত্রকের কিনারা ভেতরের দিকে বেঁকে গিয়ে সোরাসগুলোকে ঢেকে রাখে, যাকে ফলস ইন্ডুসিয়াম (False indusium) বলা হয়।</div><div class=\"ln\">আর যে পাতায় সোরাস উৎপন্ন হয় তাকে স্পোরোফিল (Sporophyll) বলে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২</span>Fill in the gap using word that best completes the sentence. I do not know ___.</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> where he does live</div><div class=\"op\"><b>খ.</b> where is he live</div><div class=\"op ok\"><b>গ.</b> where he lives<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> where does he live</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> This question is based on the rule of &#39;Embedded Questions&#39;. When a direct question (e.g., &#39;Where does he live?&#39;) is placed inside another clause or sentence (e.g., &#39;I do not know...&#39;), it becomes an embedded question. In this case, the word order of the embedded clause changes from interrogative (Auxiliary + Subject + Verb) to assertive (Subject + Verb). Therefore, &#39;where does he live&#39; becomes &#39;where he lives&#39;. Option (ক) is incorrect because &#39;does&#39; is redundant here, and option (ঘ) incorrectly retains the interrogative structure.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩</span>250ml দ্রবণের মধ্যে কি পরিমাণ Na2CO3 দ্রবীভূত থাকলে তা 1M হবে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> 25.6 g</div><div class=\"op ok\"><b>খ.</b> 26.5 g<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> 27.6 g</div><div class=\"op\"><b>ঘ.</b> 27.5 g</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাজারী ও নাগ স্যারের রসায়ন ২য় পত্রের &#39;পরিমাণগত রসায়ন&#39; অধ্যায়ের সূত্রানুযায়ী,</div><div class=\"ln\">আমরা জানি, দ্রবের ভর,</div><div class=\"dm m\" data-d=\"1\" data-t=\"W = \\frac{S \\times M \\times V}{1000}\"></div><div class=\"ln\">এখানে,</div><div class=\"ln\">মোলারিটি <span class=\"nw\">(<span class=\"m\" data-t=\"S\"></span>)</span> = <span class=\"m\" data-t=\"1\\text{ M}\"></span></div><div class=\"ln\">দ্রবণের আয়তন <span class=\"nw\">(<span class=\"m\" data-t=\"V\"></span>)</span> = <span class=\"m\" data-t=\"250\\text{ mL}\"></span></div><div class=\"ln\"><span class=\"m\" data-t=\"\\text{Na}_2\\text{CO}_3\"></span> এর আণবিক ভর <span class=\"nw\">(<span class=\"m\" data-t=\"M\"></span>)</span> =</div><div class=\"dm m\" data-d=\"1\" data-t=\"(23 \\times 2) + 12 + (16 \\times 3) = 46 + 12 + 48 = 106\\text{ g/mol}\"></div><div class=\"ln\">মানগুলো সূত্রে বসিয়ে পাই:</div><div class=\"dm m\" data-d=\"1\" data-t=\"W = \\frac{1 \\times 106 \\times 250}{1000} = \\frac{106}{4} = 26.5\\text{ g}\"></div><div class=\"ln\">অতএব, ২৫০ মিলি ১ মোলার দ্রবণে ২৬.৫ গ্রাম সোডিয়াম কার্বনেট দ্রবীভূত থাকে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪</span>পরমাণুর ভরের ক্ষুদ্রতম একক নিচের কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> mole</div><div class=\"op\"><b>খ.</b> Gram</div><div class=\"op ok\"><b>গ.</b> 1 amu<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Kilogram</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পরমাণুর অতি ক্ষুদ্র ভর পরিমাপের জন্য আন্তর্জাতিকভাবে স্বীকৃত একক হলো &#39;amu&#39; (Atomic Mass Unit)।</div><div class=\"ln\">১ amu হলো একটি কার্বন-১২ <span class=\"nw\">(<span class=\"m\" data-t=\"^{12}\\text{C}\"></span>)</span> আইসোটোপের ভরের <span class=\"m\" data-t=\"\\frac{1}{12}\"></span> অংশ, যার মান প্রায় <span class=\"m\" data-t=\"1.66 \\times 10^{-24}\\text{ g}\"></span> বা <span class=\"m\" data-t=\"1.66 \\times 10^{-27}\\text{ kg}\"></span>।</div><div class=\"ln\">গ্রাম, কিলোগ্রাম বা মোল পরমাণুর ভরের তুলনায় অনেক বড় একক।</div><div class=\"ln\">তাই পরমাণুর ভরের ক্ষুদ্রতম একক হলো <span class=\"m\" data-t=\"1\\text{ amu}\"></span>।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫</span>যদি পরিবহন ব্যান্ড ওজন ব্যান্ডের মধ্যে কোনো নিষিদ্ধ অঞ্চল না থাকে তবে পদার্থটি-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> অর্ধপরিবাহী</div><div class=\"op\"><b>খ.</b> অপরিবাহী</div><div class=\"op\"><b>গ.</b> কুপরিবাহী</div><div class=\"op ok\"><b>ঘ.</b> সুপরিবাহী<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পদার্থবিজ্ঞান ২য় পত্রের &#39;সেমিকন্ডাক্টর ও ইলেকট্রনিক্স&#39; অধ্যায় অনুযায়ী, পরিবাহী বা সুপরিবাহী (Conductor) পদার্থের ক্ষেত্রে যোজন ব্যান্ড (Valence band - প্রশ্নে যা &#39;ওজন ব্যান্ড&#39; হিসেবে অনূদিত হয়েছে) এবং পরিবহন ব্যান্ড (Conduction band) পরস্পর ওভারল্যাপ বা অতিপাতিত অবস্থায় থাকে।</div><div class=\"ln\">এদের মাঝে কোনো নিষিদ্ধ শক্তি ব্যবধান বা নিষিদ্ধ অঞ্চল (Forbidden energy gap) থাকে না।</div><div class=\"ln\">ফলে যোজন ব্যান্ডের ইলেকট্রনগুলো খুব সহজেই পরিবহন ব্যান্ডে চলে যেতে পারে এবং বিদ্যুৎ পরিবহন করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬</span>বাংলাদেশের কোন গ্যাস ক্ষেত্রের প্রাকৃতিক গ্যাসের সংযুক্তিতে সবচেয়ে বেশি মিথেন ও সবচেয়ে কম CO2 গ্যাস আছে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> তিতাস</div><div class=\"op\"><b>খ.</b> হরিপুর</div><div class=\"op ok\"><b>গ.</b> রসিদপুর<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> বিয়ানীবাজার</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাজারী ও নাগ স্যারের রসায়ন ২য় পত্র (অধ্যায়-৫: কয়লা ও প্রাকৃতিক গ্যাস) অনুসারে, বাংলাদেশের বিভিন্ন গ্যাসক্ষেত্রের মধ্যে রসিদপুর গ্যাসক্ষেত্রের প্রাকৃতিক গ্যাসে মিথেনের (CH4) পরিমাণ সবচেয়ে বেশি (প্রায় ৯৮.০%) এবং কার্বন ডাই-অক্সাইডের (CO2) পরিমাণ সবচেয়ে কম (প্রায় ০.২%) থাকে।</div><div class=\"ln\">অন্যদিকে তিতাস গ্যাসক্ষেত্রে মিথেনের পরিমাণ প্রায় ৯৭.২%।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭</span>What is the meaning of the idiom &#39;A round dozen&#39;?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> A full dozen<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> A little more than a dozen</div><div class=\"op\"><b>গ.</b> Round about a dozen</div><div class=\"op\"><b>ঘ.</b> A little less than a dozen</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ইংরেজি ব্যাকরণ ও বাগধারা (Idioms and Phrases) অনুযায়ী, &#39;A round dozen&#39; একটি প্রচলিত ইডিয়ম যার অর্থ &#39;পূর্ণ এক ডজন&#39; বা &#39;ঠিক বারোটি&#39; (A full dozen / exactly twelve)।</div><div class=\"ln\">সুতরাং সঠিক উত্তর (ক)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮</span>দুটি ভেক্টরের লব্ধি প্রতি ভেক্টরের সমান হতে হলে ভেক্টরদ্বয়ের মধ্যবর্তী কোণ কত হবে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ০°</div><div class=\"op ok\"><b>খ.</b> ১২০°<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ৯০°</div><div class=\"op\"><b>ঘ.</b> ১৮০°</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ধরি, দুটি সমান মানের ভেক্টর P এবং Q, যাদের মধ্যবর্তী কোণ α।</div><div class=\"ln\">এদের লব্ধি R।</div><div class=\"ln\">শর্তানুসারে, P = Q = R</div><div class=\"ln\">আমরা জানি, লব্ধির সূত্র: R² = P² + Q² + 2PQ cosα</div><div class=\"ln\">বা, P² = P² + P² + 2P² cosα [যেহেতু P = Q = R]</div><div class=\"ln\">বা, P² = 2P² + 2P² cosα</div><div class=\"ln\">বা, -P² = 2P² cosα</div><div class=\"ln\">বা, cosα = -P² / 2P² = -1/2</div><div class=\"ln\">বা, α = cos⁻¹(-1/2) = ১২০°।</div><div class=\"ln\">অতএব, দুটি ভেক্টরের লব্ধি প্রতি ভেক্টরের সমান হতে হলে তাদের মধ্যবর্তী কোণ ১২০° হতে হবে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯</span>ত্রিমিলনের (Triple fusion) এর মাধ্যমে সেকেন্ডারী নিউক্লিয়াসটি কী উৎপন্ন করে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> বীজ (Seed)</div><div class=\"op ok\"><b>খ.</b> শস্য (Endosperm)<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ভ্রূণ (Embryo)</div><div class=\"op\"><b>ঘ.</b> ফল (Fruit)</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> আবুল হাসান স্যারের উদ্ভিদবিজ্ঞান বইয়ের ১০ম অধ্যায় (উদ্ভিদের প্রজনন) অনুসারে, সপুষ্পক উদ্ভিদের দ্বিনিষেক প্রক্রিয়ায় একটি পুংগ্যামেট (n) ডিম্বাণুর (n) সাথে মিলিত হয়ে জাইগোট (2n) তৈরি করে যা পরবর্তীতে ভ্রূণ (Embryo) গঠন করে।</div><div class=\"ln\">অপর পুংগ্যামেটটি (n) সেকেন্ডারি নিউক্লিয়াসের (2n) সাথে মিলিত হয়, যাকে ত্রিমিলন (Triple fusion) বলা হয়।</div><div class=\"ln\">এই ত্রিমিলনের ফলে ট্রিপ্লয়েড (3n) প্রাইমারি এন্ডোস্পার্ম নিউক্লিয়াস গঠিত হয়, যা পরবর্তীতে শস্য বা এন্ডোস্পার্ম (Endosperm) উৎপন্ন করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১০</span>লেন্স ও রেটিনার মধ্যবর্তী প্রকোষ্ঠে বিদ্যমান ভিট্রিয়াস হিউমারের উপাদান নয়-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ৯৯% পানি</div><div class=\"op\"><b>খ.</b> ১% কোলাজেন</div><div class=\"op\"><b>গ.</b> হ্যালুরোনিক এসিড</div><div class=\"op ok\"><b>ঘ.</b> হ্যালুরোনিডেজ এনজাইম<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল স্যারের প্রাণিবিজ্ঞান বইয়ের ৮ম অধ্যায় (সমন্বয় ও নিয়ন্ত্রণ - চোখ) অনুসারে, চোখের লেন্স ও রেটিনার মধ্যবর্তী প্রকোষ্ঠে (ভিট্রিয়াস প্রকোষ্ঠ) অবস্থিত স্বচ্ছ ও জেলির মতো তরলকে ভিট্রিয়াস হিউমার বলে।</div><div class=\"ln\">এর উপাদানের মধ্যে রয়েছে ৯৯% পানি এবং অবশিষ্ট ১% কোলাজেন ও হ্যালুরোনিক এসিড।</div><div class=\"ln\">হ্যালুরোনিডেজ (Hyaluronidase) হলো একটি এনজাইম যা হ্যালুরোনিক এসিডকে ভেঙে ফেলে (যেমন শুক্রাণুর অ্যাক্রোসোমে থাকে ডিম্বাণুর প্রাচীর গলানোর জন্য), এটি ভিট্রিয়াস হিউমারের স্বাভাবিক উপাদান নয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১১</span>What is the synonym of &#39;exhausted&#39;?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> plenty</div><div class=\"op ok\"><b>খ.</b> drained<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> animated</div><div class=\"op\"><b>ঘ.</b> stored</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The word &#39;exhausted&#39; means extremely tired or completely used up. &#39;Drained&#39; is a synonym as it also implies being depleted of energy or resources. &#39;Plenty&#39; means abundant, &#39;animated&#39; means lively, and &#39;stored&#39; means kept for future use, which are antonyms or unrelated.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১২</span>ব্যাকটেরিয়ার কোষ প্রাচীরের প্রধান উপাদান-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Teichoic acid</div><div class=\"op\"><b>খ.</b> Cellulose</div><div class=\"op ok\"><b>গ.</b> Peptidoglycan<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Muramic acid</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ব্যাকটেরিয়ার কোষ প্রাচীরের প্রধান গাঠনিক উপাদান হলো পেপটিডোগ্লাইকান (Peptidoglycan), যা মিউকোপ্রোটিন বা মিউরিন নামেও পরিচিত।</div><div class=\"ln\">এটি এন-এসিটাইল গ্লুকোসামিন এবং এন-এসিটাইল মিউরামিক অ্যাসিডের সমন্বয়ে গঠিত।</div><div class=\"ln\">সেলুলোজ উদ্ভিদের কোষ প্রাচীরের প্রধান উপাদান।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১৩</span>তাপমাত্রা বাড়ার সাথে সাথে নিচের কোনটির পরিবাহিতা বৃদ্ধি পায়?</div><div class=\
