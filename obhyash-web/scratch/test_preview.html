পানিতে ডিটারজেন্ট বা সাবান মেশালে পানির পৃষ্ঠটান (Surface Tension) হ্রাস পায়।</div><div class=\"ln\">এর ফলে পানি কাপড়ের সূক্ষ্ম তন্তুর ভেতরে সহজে প্রবেশ করতে পারে এবং ময়লা পরিষ্কার করতে সাহায্য করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২২</span>কোন ব্যাকটেরিয়ার ফারমেন্টেশনের ফলে চামড়া থেকে লোম, মেদকলা ইত্যাদির অপসারণ ঘটে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Streptococcus lactis</div><div class=\"op\"><b>খ.</b> E. coli</div><div class=\"op ok\"><b>গ.</b> Bacillus subtilis<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Clostridium</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> চামড়া প্রক্রিয়াজাতকরণ বা ট্যানিং শিল্পে &#39;Bacillus subtilis&#39; ব্যাকটেরিয়া ব্যবহার করা হয়।</div><div class=\"ln\">এই ব্যাকটেরিয়া থেকে নিঃসৃত এনজাইম চামড়া থেকে লোম, চর্বি বা মেদকলা অপসারণে (Bating process) সহায়তা করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৩</span>দেহের কঙ্কাল পেশি তন্তুর প্রতিটি গুচ্ছকে কি বলে?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ফ্যাসিকুলাস<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> অ্যাকটিন</div><div class=\"op\"><b>গ.</b> এন্ডোমাইসিয়াম</div><div class=\"op\"><b>ঘ.</b> পেরিমাইসিয়াম</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> প্রাণিবিজ্ঞানের গঠন অনুযায়ী, কঙ্কাল পেশি অনেকগুলো পেশি তন্তু বা মাসল ফাইবার নিয়ে গঠিত।</div><div class=\"ln\">এই তন্তুগুলো গুচ্ছাকারে অবস্থান করে, যাকে ফ্যাসিকুলাস (Fasciculus) বলা হয়।</div><div class=\"ln\">ফ্যাসিকুলাসগুলো পেরিমাইসিয়াম নামক যোজক কলা দ্বারা আবৃত থাকে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৪</span>কোন উপাদানের প্রভাবে prophase ধাপে ক্রোমোজোমের সংকোচন শুরু হয়?</div><div class=\"opts\"><div class=\"op smo ok\"><b>ক.</b> Maturation promoting factor<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> Traction fibre</div><div class=\"op\"><b>গ.</b> Microtubules</div><div class=\"op\"><b>ঘ.</b> Cyclin dependent kinase</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> কোষ বিভাজনের প্রফেজ ধাপে ক্রোমোজোমের ঘনীভবন বা সংকোচন শুরু করার জন্য Maturation Promoting Factor (MPF) কাজ করে।</div><div class=\"ln\">এটি সাইক্লিন এবং সাইক্লিন ডিপেন্ডেন্ট কাইনেজ (CDK)-এর সমন্বয়ে গঠিত একটি প্রোটিন কমপ্লেক্স।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৫</span>পানিকে ধারকের ডাই-ইলেকট্রিক পদার্থ হিসেবে ব্যবহার করা হয় না কেন?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> বিশুদ্ধ অবস্থায় থাকে</div><div class=\"op smo ok\"><b>খ.</b> পানিতে অপদ্রব্য দ্রবীভূত থাকে<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> অপরিবাহীর মত আচরণ করে</div><div class=\"op\"><b>ঘ.</b> সবগুলো</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বিশুদ্ধ পানি একটি ভালো ডাই-ইলেকট্রিক পদার্থ হতে পারে, কিন্তু সাধারণ পানি বা ট্যাপের পানিতে প্রচুর পরিমাণে খনিজ লবণ ও অপদ্রব্য দ্রবীভূত থাকে।</div><div class=\"ln\">এর ফলে পানি বিদ্যুৎ পরিবাহী হয়ে যায়, যা ধারকের (Capacitor) কার্যকারিতা নষ্ট করে দেয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৬</span>নিচের কোন ক্ষেত্রে বিদ্যুৎ ইলেক্ট্রন চলাচলে এর মাধ্যমে প্রবাহিত হয়?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> গ্রাফাইট<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> গলিত লবণ</div><div class=\"op smo\"><b>গ.</b> অম্ল্যালিক এসিডের জলীয় দ্রবণ</div><div class=\"op\"><b>ঘ.</b> কোনোটিই নয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গ্রাফাইট একটি অধাতু হওয়া সত্ত্বেও এর কার্বন পরমাণুগুলোর মধ্যে মুক্ত বা সঞ্চরণশীল ইলেকট্রন (delocalized electrons) থাকে, যার মাধ্যমে এটি ধাতুর মতো ইলেকট্রন চলাচলের দ্বারা বিদ্যুৎ পরিবহন করে।</div><div class=\"ln\">অন্যদিকে, গলিত লবণ এবং অম্লীয় জলীয় দ্রবণ তড়িৎবিশ্লেষ্য পদার্থ হওয়ায় এরা আয়ন (ক্যাটায়ন ও অ্যানায়ন) চলাচলের মাধ্যমে বিদ্যুৎ পরিবহন করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৭</span>কোনটি থেকে বাণিজ্যিকভাবে উৎপাদিত প্রথম এন্টিবায়োটিক পেনিসিলিন তৈরি হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Penicillium roqueforti</div><div class=\"op\"><b>খ.</b> Penicillium notatum</div><div class=\"op ok\"><b>গ.</b> Penicillium chrysogenum<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Penicillium camemberti</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৯২৮ সালে স্যার আলেকজান্ডার ফ্লেমিং প্রথম Penicillium notatum নামক ছত্রাক থেকে পেনিসিলিন আবিষ্কার করেন।</div><div class=\"ln\">তবে বাণিজ্যিকভাবে এবং শিল্পক্ষেত্রে বিপুল পরিমাণে পেনিসিলিন উৎপাদনের জন্য Penicillium chrysogenum নামক প্রজাতিটি ব্যবহার করা হয়, কারণ এই প্রজাতিটি থেকে অনেক বেশি ফলন পাওয়া যায়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৮</span>মুক্তিযুদ্ধের সময় জাতিসংঘে কোন দেশ বাংলাদেশের পক্ষে &#39;ভেটো&#39; প্রদান করেছিল?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> যুক্তরাজ্য</div><div class=\"op ok\"><b>খ.</b> সোভিয়েত ইউনিয়ন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> যুক্তরাষ্ট্র</div><div class=\"op\"><b>ঘ.</b> ফ্রান্স</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৯৭১ সালে বাংলাদেশের মহান মুক্তিযুদ্ধ চলাকালীন সময়ে জাতিসংঘের নিরাপত্তা পরিষদে মার্কিন যুক্তরাষ্ট্র যুদ্ধবিরতির প্রস্তাব উত্থাপন করে।</div><div class=\"ln\">এই প্রস্তাব পাস হলে বাংলাদেশের স্বাধীনতা অর্জন বাধাগ্রস্ত হতো।</div><div class=\"ln\">বাংলাদেশের পরম বন্ধু রাষ্ট্র তৎকালীন সোভিয়েত ইউনিয়ন (বর্তমান রাশিয়া) নিরাপত্তা পরিষদে বাংলাদেশের পক্ষে এবং যুদ্ধবিরতি প্রস্তাবের বিপক্ষে একাধিকবার &#39;ভেটো&#39; (Veto) ক্ষমতা প্রয়োগ করে এই ষড়যন্ত্র নস্যাৎ করে দেয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">২৯</span>বন্ধন কোণের ক্রমের কোন ক্রমটি সঠিক?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> NH3 &gt; AsH3 &gt; SbH3 &gt; PH3</div><div class=\"op\"><b>খ.</b> SbH3 &gt; AsH3 &gt; NH3 &gt; PH3</div><div class=\"op ok\"><b>গ.</b> NH3 &gt; PH3 &gt; AsH3 &gt; SbH3<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> NH3 &lt; PH3 &lt; AsH3 &lt; SbH3</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গ্রুপ-১৫ এর হাইড্রাইডসমূহের ক্ষেত্রে উপর থেকে নিচে নামলে কেন্দ্রীয় পরমাণুর আকার বৃদ্ধি পায় এবং তড়িৎ ঋণাত্মকতা হ্রাস পায় (N &gt; P &gt; As &gt; Sb)।</div><div class=\"ln\">কেন্দ্রীয় পরমাণুর তড়িৎ ঋণাত্মকতা যত বেশি হয়, বন্ধন জোড় ইলেকট্রনগুলো কেন্দ্রীয় পরমাণুর তত কাছে অবস্থান করে এবং তাদের মধ্যকার বিকর্ষণ বৃদ্ধি পাওয়ায় বন্ধন কোণ বড় হয়।</div><div class=\"ln\">তড়িৎ ঋণাত্মকতা হ্রাসের সাথে সাথে বন্ধন জোড়গুলোর বিকর্ষণ কমে যায় এবং বন্ধন কোণও সংকুচিত হয়।</div><div class=\"ln\">এদের বন্ধন কোণের মান যথাক্রমে: NH3 (১০৭°), PH3 (৯৩.৩°), AsH3 (৯১.৮°) এবং SbH3 (৯১.৩°)।</div><div class=\"ln\">সুতরাং সঠিক ক্রম: NH3 &gt; PH3 &gt; AsH3 &gt; SbH3।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩০</span>তাপগতিবিদ্যার প্রথম সূত্র কোনটি?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> dQ=dU+dW<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> dQ=dU</div><div class=\"op\"><b>গ.</b> dU=dQ+dW</div><div class=\"op\"><b>ঘ.</b> dW=dU+dW</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> তাপগতিবিদ্যার প্রথম সূত্রটি শক্তির নিত্যতা সূত্রের একটি বিশেষ রূপ।</div><div class=\"ln\">ক্লসিয়াসের মতবাদ অনুসারে, যখন কোনো সিস্টেমে তাপ শক্তি সরবরাহ করা হয় (dQ), তখন সেই তাপের একটি অংশ সিস্টেমের অভ্যন্তরীণ শক্তি বৃদ্ধিতে (dU) সাহায্য করে এবং অবশিষ্ট অংশ দ্বারা সিস্টেম তার পারিপার্শ্বিকের ওপর বাহ্যিক কাজ (dW) সম্পাদন করে।</div><div class=\"ln\">অতএব, গাণিতিক রূপটি হলো: dQ = dU + dW।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩১</span>২০২২ সালের সাফ নারী ফুটবল চ্যাম্পিয়নশিপের ফাইনালে বাংলাদেশ কত ব্যবধানে নেপাল দলকে হারায়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ২-১</div><div class=\"op\"><b>খ.</b> ৩-২</div><div class=\"op ok\"><b>গ.</b> ৩-১<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> ২-০</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ২০২২ সালের ১৯ সেপ্টেম্বর কাঠমান্ডুর দশরথ রঙ্গশালা স্টেডিয়ামে অনুষ্ঠিত সাফ নারী চ্যাম্পিয়নশিপের ফাইনালে বাংলাদেশ নেপালকে ৩-১ গোলে হারিয়ে প্রথমবারের মতো চ্যাম্পিয়ন হওয়ার গৌরব অর্জন করে।</div><div class=\"ln\">বাংলাদেশের পক্ষে কৃষ্ণা রানী সরকার দুটি এবং শামসুন্নাহার জুনিয়র একটি গোল করেন।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩২</span>খাদ্যমণ্ড শ্বাসনালীর ভিতর প্রবেশে কোন অংশ বাঁধা প্রধান করে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> কোমল তালু</div><div class=\"op\"><b>খ.</b> শক্ত তালু</div><div class=\"op\"><b>গ.</b> আলজিহবা</div><div class=\"op ok\"><b>ঘ.</b> উপজিহ্বা<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> খাদ্য গলাধকরণের সময় উপজিহ্বা বা এপিগ্লটিস (Epiglottis) স্বরযন্ত্রের মুখ বা শ্বাসনালীর প্রবেশপথ ঢেকে দেয়, ফলে খাদ্যমণ্ড শ্বাসনালীতে প্রবেশ করতে পারে না।</div><div class=\"ln\">অন্যদিকে, কোমল তালু (Soft palate) খাদ্যকে নাসাপথে প্রবেশ করতে বাধা দেয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৩</span><span class=\"m wrapm\" data-t=\"C_{12}H_{22}O_{11} + H_2O \\rightarrow 2C_6H_{12}O_6\"></span> বিক্রিয়াটি কোন এনজাইমের প্রভাবে সম্পন্ন করা হয়?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ইনভারটেস<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ম্যাল্টেস</div><div class=\"op\"><b>গ.</b> অ্যামাইলেস</div><div class=\"op\"><b>ঘ.</b> জাইমেস</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ইক্ষু চিনি বা সুক্রোজের <span class=\"nw\">(<span class=\"m\" data-t=\"C_{12}H_{22}O_{11}\"></span>)</span> আর্দ্র বিশ্লেষণ বিক্রিয়ায় গ্লুকোজ ও ফ্রুক্টোজ উৎপন্ন হয়।</div><div class=\"ln\">এই বিক্রিয়াটি &#39;ইনভারটেস&#39; (Invertase) এনজাইমের প্রভাবে ঘটে।</div><div class=\"ln\">উৎপন্ন গ্লুকোজ ও ফ্রুক্টোজের মিশ্রণকে ইনভার্ট চিনি বলা হয়।</div><div class=\"ln\">অন্যদিকে, ম্যাল্টোজকে গ্লুকোজে পরিণত করতে ম্যাল্টেস এনজাইম ব্যবহৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৪</span>ননকর্ডাটার ক্ষেত্রে কোনটি সঠিক নয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ত্বক হতে চোখের সৃষ্টি</div><div class=\"op smo\"><b>খ.</b> গলবিলীয় ফুলকা রন্ধ্র উপস্থিত নেই</div><div class=\"op ok\"><b>গ.</b> RBC তে হিমোগ্লোবিন অবস্থিত<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>ঘ.</b> হৃদযন্ত্র পৃষ্ঠদেশে অবস্থিত</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> নন-কর্ডাটা (Non-chordata) পর্বের প্রাণীদের রক্তে লোহিত রক্তকণিকা বা RBC থাকে না।</div><div class=\"ln\">এদের রক্তে যদি হিমোগ্লোবিন বা অন্য কোনো শ্বসন রঞ্জক থাকে, তবে তা সরাসরি রক্তরসে (Plasma) দ্রবীভূত অবস্থায় থাকে।</div><div class=\"ln\">পক্ষান্তরে, কর্ডাটা পর্বের প্রাণীদের হিমোগ্লোবিন লোহিত রক্তকণিকায় (RBC) অবস্থান করে।</div><div class=\"ln\">তাই (গ) নম্বর উক্তিটি নন-কর্ডাটার ক্ষেত্রে সঠিক নয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৫</span>পীড়ন কত প্রকার?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ৩<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ২</div><div class=\"op\"><b>গ.</b> ৪</div><div class=\"op\"><b>ঘ.</b> ৫</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> এইচএসসি পদার্থবিজ্ঞান (তপন ও ইসহাক স্যার) বই অনুযায়ী, পীড়ন প্রধানত ৩ প্রকার।</div><div class=\"ln\">যথা: ১. অনুদৈর্ঘ্য পীড়ন (Longitudinal Stress), ২. আয়তন পীড়ন (Volume Stress) এবং ৩. ব্যবর্তন বা আকার বা মোচড় পীড়ন (Shearing Stress)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৬</span>কোনটি non-sugar কার্বোহাইড্রেট?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> Glycogen<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> Sucrose</div><div class=\"op\"><b>গ.</b> Glucose</div><div class=\"op\"><b>ঘ.</b> Maltose</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> কার্বোহাইড্রেটকে স্বাদের ওপর ভিত্তি করে দুই ভাগে ভাগ করা যায়: সুগার (Sugar) ও নন-সুগার (Non-sugar)।</div><div class=\"ln\">গ্লুকোজ, সুক্রোজ এবং মল্টোজ হলো সুগার (মিষ্টি, দানাদার ও পানিতে দ্রবণীয়)।</div><div class=\"ln\">অন্যদিকে, গ্লাইকোজেন, স্টার্চ এবং সেলুলোজ হলো পলিস্যাকারাইড বা নন-সুগার (অদানাদার, স্বাদহীন ও পানিতে অদ্রবণীয়)।</div><div class=\"ln\">সুতরাং, গ্লাইকোজেন একটি নন-সুগার কার্বোহাইড্রেট।</div><div class=\"note\">সূত্র: আবুল হাসান, উদ্ভিদবিজ্ঞান</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৭</span>বৃক্কের অভ্যন্তরে ইউরেটারের ফানেলাকৃতির অংশ কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> রেনাল কলাম</div><div class=\"op\"><b>খ.</b> রেনাল পাপিুলা</div><div class=\"op ok\"><b>গ.</b> রেনাল পেলভিস<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> রেনাল পিরামিড</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বৃক্কের হিলাম অংশের ভেতর ইউরেটার বা মূত্রনালির ফানেলাকৃতির প্রশস্ত অংশকে রেনাল পেলভিস (Renal pelvis) বলে।</div><div class=\"ln\">পেলভিস থেকে মূত্র ইউরেটারের মাধ্যমে মূত্রথলিতে পরিবাহিত হয়।</div><div class=\"note\">সূত্র: গাজী আজমল, প্রাণিবিজ্ঞান</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৮</span><span class=\"m\" data-t=\"H_3BO_3\"></span> এর ক্ষারকত্ব কত?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ১<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ২</div><div class=\"op\"><b>গ.</b> ৩</div><div class=\"op\"><b>ঘ.</b> ৪</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বোরিক অ্যাসিড <span class=\"nw\">(<span class=\"m\" data-t=\"H_3BO_3\"></span>)</span> একটি দুর্বল এক-ক্ষারকীয় (monobasic) অ্যাসিড।</div><div class=\"ln\">এটি জলীয় দ্রবণে সরাসরি প্রোটন <span class=\"nw\">(<span class=\"m\" data-t=\"H^+\"></span>)</span> দান করে না, বরং পানির অণু থেকে একটি হাইড্রোক্সিল আয়ন <span class=\"nw\">(<span class=\"m\" data-t=\"OH^-\"></span>)</span> গ্রহণ করে প্রোটন মুক্ত করে:</div><div class=\"dm m\" data-d=\"1\" data-t=\"B(OH)_3 + H_2O \\rightleftharpoons [B(OH)_4]^- + H^+\"></div><div class=\"ln\">. যেহেতু এটি একটি মাত্র <span class=\"m\" data-t=\"OH^-\"></span> আয়ন গ্রহণ করতে পারে, তাই এর ক্ষারকত্ব হলো ১।</div><div class=\"note\">সূত্র: হাজারী ও নাগ, রসায়ন</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৩৯</span>শান্তমন্ডল বলা হয় কোন স্তরকে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> মেসোস্ফিয়ার</div><div class=\"op\"><b>খ.</b> ট্রপোস্ফিয়ার</div><div class=\"op\"><b>গ.</b> আয়নোস্ফিয়ার</div><div class=\"op ok\"><b>ঘ.</b> স্ট্র্যাটোস্ফিয়ার<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বায়ুমণ্ডলের দ্বিতীয় স্তর স্ট্র্যাটোস্ফিয়ারকে (Stratosphere) শান্তমন্ডল বলা হয়।</div><div class=\"ln\">এই স্তরে মেঘ, ধূলিকণা, ঝড়-বৃষ্টি ইত্যাদি থাকে না এবং বায়ুপ্রবাহ অত্যন্ত শান্ত থাকে।</div><div class=\"ln\">এ কারণে এই স্তরের মধ্য দিয়ে সাধারণত জেট বিমানগুলো চলাচল করে।</div><div class=\"note\">সূত্র: হাজারী ও নাগ, রসায়ন দ্বিতীয় পত্র</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪০</span>Hydra র অন্যতম অযৌন প্রক্রিয়া মুকুলোদগম দেখা যায় কোন ঋতুতে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> হেমন্তকাল</div><div class=\"op\"><b>খ.</b> শীতকাল</div><div class=\"op ok\"><b>গ.</b> গ্রীষ্মকাল<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> বসন্ত কাল</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাইড্রার (Hydra) স্বাভাবিক ও অন্যতম প্রধান অযৌন জনন প্রক্রিয়া হলো মুকুলোদগম (Budding)।</div><div class=\"ln\">গ্রীষ্মকালে যখন পর্যাপ্ত খাদ্য পাওয়া যায় এবং অনুকূল পরিবেশ থাকে, তখন হাইড্রায় প্রচুর পরিমাণে মুকুল সৃষ্টি হয়।</div><div class=\"note\">সূত্র: গাজী আজমল, প্রাণিবিজ্ঞান</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪১</span>আলোক তরঙ্গের বেলায় নিচের কোনটি মিথ্যা?</div><div class=\"opts\"><div class=\"op smo\"><b>ক.</b> এর তরঙ্গদৈর্ঘ্য অত্যন্ত ক্ষুদ্র</div><div class=\"op ok\"><b>খ.</b> ইহা একটি লম্বিক তরঙ্গ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>গ.</b> এর অস্তিত্ব চোখে অনুভূত হয়</div><div class=\"op\"><b>ঘ.</b> এর সমবর্তন হতে পারে</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> আলোক তরঙ্গ হলো একটি তড়িৎ-চৌম্বকীয় অনুপ্রস্থ বা আড় তরঙ্গ (transverse wave), লম্বিক বা অনুদৈর্ঘ্য (longitudinal) তরঙ্গ নয়।</div><div class=\"ln\">লম্বিক তরঙ্গের একটি পরিচিত উদাহরণ হলো শব্দ তরঙ্গ।</div><div class=\"ln\">আলোক তরঙ্গের তরঙ্গদৈর্ঘ্য অত্যন্ত ক্ষুদ্র (প্রায় ৪০০-৭০০ ন্যানোমিটার), এটি চোখে দর্শনের অনুভূতি জাগায় এবং অনুপ্রস্থ তরঙ্গ হওয়ায় এর সমবর্তন (polarization) ঘটে।</div><div class=\"ln\">সুতরাং, &quot;ইহা একটি লম্বিক তরঙ্গ&quot; উক্তিটি আলোক তরঙ্গের ক্ষেত্রে মিথ্যা।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪২</span>I cannot put faith ___ him.</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> at</div><div class=\"op\"><b>খ.</b> upon</div><div class=\"op ok\"><b>গ.</b> in<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> on</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The appropriate preposition after the noun &#39;faith&#39; in this context is &#39;in&#39;. The idiom/phrase &#39;to put faith in someone or something&#39; means to trust or have confidence in someone or something. Therefore, &#39;in&#39; is the correct preposition to fill in the blank.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৩</span>কোন প্রাণীদের বৃহদন্ত্রের অ্যাপনডিক্স কার্যকর থাকে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> মানুষ</div><div class=\"op\"><b>খ.</b> বাঘ</div><div class=\"op ok\"><b>গ.</b> খরগোশ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> হায়েনা</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মানুষের সিকাম ও অ্যাপেনডিক্স একটি নিষ্ক্রিয় বা ভেস্টিজিয়াল (vestigial) অঙ্গ হিসেবে পরিচিত।</div><div class=\"ln\">কিন্তু তৃণভোজী স্তন্যপায়ী প্রাণী যেমন খরগোশের (Rabbit) ক্ষেত্রে অ্যাপেনডিক্স অত্যন্ত সুগঠিত এবং এটি সেলুলোজ হজমে সাহায্যকারী ব্যাকটেরিয়ার বাসস্থান হিসেবে অত্যন্ত সক্রিয় ও কার্যকর ভূমিকা পালন করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৪</span>কোনটি ফেলিং দ্রবণ এর সাথে <span class=\"m\" data-t=\"Cu_2O\"></span> এর অধঃক্ষেপ দেয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Vinegar</div><div class=\"op ok\"><b>খ.</b> Formalin<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> Glycerine</div><div class=\"op\"><b>ঘ.</b> Propanone</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> অ্যালডিহাইডসমূহ (যেমন ফরমালিন বা ফরমালডিহাইড) ফেলিং দ্রবণের সাথে বিক্রিয়া করে লাল বর্ণের কপার (I) অক্সাইড <span class=\"nw\">(<span class=\"m\" data-t=\"Cu_2O\"></span>)</span>-এর অধঃক্ষেপ তৈরি করে।</div><div class=\"ln\">কিটোন (যেমন প্রোপানন), কার্বক্সিলিক এসিড (যেমন ভিনেগার) এবং অ্যালকোহল (যেমন গ্লিসারিন) ফেলিং দ্রবণের সাথে এই বিক্রিয়া দেয় না।</div><div class=\"ln\">বিক্রিয়াটি নিম্নরূপ:</div><div class=\"dm m\" data-d=\"1\" data-t=\"HCHO + 2Cu^{2+} + 5OH^- \\rightarrow HCOO^- + Cu_2O\\downarrow \\text{ (লাল) } + 3H_2O\"></div><div class=\"ln\">।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৫</span>বাংলাদেশের রাষ্ট্রীয় মনোগ্রামের ডিজাইনার কে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> কাজী খসরু</div><div class=\"op\"><b>খ.</b> কামরুল হাসান</div><div class=\"op ok\"><b>গ.</b> এ এন এ সাহা<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> স্বপন কুমার</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গণপ্রজাতন্ত্রী বাংলাদেশের রাষ্ট্রীয় মনোগ্রাম (State Monogram)-এর ডিজাইনার হলেন এ. এন. এ. সাহা (Aditya Nilambar Anil Saha)।</div><div class=\"ln\">এই মনোগ্রামের মাঝখানে লাল বৃত্তের মধ্যে হলুদ রঙের বাংলাদেশের মানচিত্র এবং বৃত্তের উপরে &#39;গণপ্রজাতন্ত্রী বাংলাদেশ&#39; ও নিচে &#39;সরকার&#39; লেখা রয়েছে এবং দুই পাশে দুটি করে মোট চারটি তারকা রয়েছে।</div><div class=\"ln\">অন্যদিকে, পটুয়া কামরুল হাসান হলেন বাংলাদেশের জাতীয় পতাকার চূড়ান্ত নকশাকার এবং জাতীয় প্রতীকের ডিজাইনার।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৬</span>গ্যাসের গতিতত্ত্বের জনক বলা হয় কাকে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ক্লসিয়াস</div><div class=\"op\"><b>খ.</b> জিন</div><div class=\"op\"><b>গ.</b> ম্যাক্সওয়েল</div><div class=\"op ok\"><b>ঘ.</b> বার্নোলি<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৭৩৮ সালে ড্যানিয়েল বার্নোলি (Daniel Bernoulli) তাঁর বিখ্যাত &#39;Hydrodynamica&#39; গ্রন্থে গ্যাসের গতিতত্ত্বের গাণিতিক ভিত্তি স্থাপন করেন।</div><div class=\"ln\">এজন্য তাঁকে গ্যাসের গতিতত্ত্বের জনক (Father of Kinetic Theory of Gases) বলা হয়।</div><div class=\"ln\">পরবর্তীতে ক্লসিয়াস, ম্যাক্সওয়েল ও বোল্টজম্যান এই তত্ত্বকে আরও উন্নত ও বিস্তারিত রূপ দেন।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৭</span>কৌণিক ভরবেগের সমীকরণ mvr = nh/2π এর চলকগুলোর পরিচয়ের ক্ষেত্রে কোনটি সঠিক নয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> m = ইলেক্ট্রনের ভর</div><div class=\"op ok\"><b>খ.</b> r = অরবিটালের ব্যাসার্ধ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> v =ইলেক্ট্রনের গতিবেগ</div><div class=\"op\"><b>ঘ.</b> h = প্লাঙ্ক ধ্রুবক</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বোর পরমাণু মডেলের ২য় প্রস্তাবনা (কৌণিক ভরবেগ সংক্রান্ত নীতি) অনুযায়ী, নির্দিষ্ট বৃত্তাকার কক্ষপথে ঘূর্ণনশীল ইলেকট্রনের কৌণিক ভরবেগ, mvr = nh/2π।</div><div class=\"ln\">এখানে, m = ইলেকট্রনের ভর, v = ইলেকট্রনের গতিবেগ, h = প্লাঙ্ক ধ্রুবক এবং r = নির্দিষ্ট বৃত্তাকার কক্ষপথ বা অরবিটের (Orbit) ব্যাসার্ধ।</div><div class=\"ln\">অরবিট (Orbit) এবং অরবিটাল (Orbital) সম্পূর্ণ ভিন্ন দুটি ধারণা।</div><div class=\"ln\">বোর মডেলে অরবিটালের কোনো ধারণা ছিল না।</div><div class=\"ln\">তাই (খ) নম্বর তথ্যটি সঠিক নয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৮</span>কোন বর্ণের জন্য আলোর বিচ্যুতি কোণ সবচেয়ে কম?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> লাল<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> বেগুনি</div><div class=\"op\"><b>গ.</b> সবুজ</div><div class=\"op\"><b>ঘ.</b> কমলা</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> প্রিজমের মধ্য দিয়ে সাদা আলো প্রতিসরিত হওয়ার সময় আলোর বিচ্যুতি কোণ (δ) তার তরঙ্গদৈর্ঘ্যের (λ) ব্যস্তানুপাতিক হয় (δ ∝ 1/λ)।</div><div class=\"ln\">দৃশ্যমান আলোর মধ্যে লাল আলোর তরঙ্গদৈর্ঘ্য সবচেয়ে বেশি (প্রায় 650-750 nm), তাই লাল আলোর বিচ্যুতি কোণ সবচেয়ে কম হয়।</div><div class=\"ln\">অন্যদিকে বেগুনি আলোর তরঙ্গদৈর্ঘ্য সবচেয়ে কম হওয়ায় এর বিচ্যুতি কোণ সবচেয়ে বেশি হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৪৯</span>অ্যালকিনের সাধারণ সংকেত কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> <span class=\"m\" data-t=\"C_nH_{2n+2}\"></span></div><div class=\"op\"><b>খ.</b> <span class=\"m\" data-t=\"C_nH_{2n+1}\"></span></div><div class=\"op ok\"><b>গ.</b> <span class=\"m\" data-t=\"C_nH_{2n}\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> <span class=\"m\" data-t=\"C_nH_{2n-2}\"></span></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> অ্যালকিন (Alkene) হলো কার্বন-কার্বন দ্বিবন্ধনযুক্ত অসম্পৃক্ত হাইড্রোকার্বন।</div><div class=\"ln\">এর সাধারণ সংকেত হলো <span class=\"m\" data-t=\"C_nH_{2n}\"></span> (যেখানে n = ২, ৩, ৪... ইত্যাদি)।</div><div class=\"ln\">যেমন: ইথিন (C₂H₄)।</div><div class=\"ln\">অন্যান্য অপশনগুলোর মধ্যে: (ক) <span class=\"m\" data-t=\"C_nH_{2n+2}\"></span> হলো অ্যালকেনের, (খ) <span class=\"m\" data-t=\"C_nH_{2n+1}\"></span> হলো অ্যালকাইল মূলকের এবং (ঘ) <span class=\"m\" data-t=\"C_nH_{2n-2}\"></span> হলো অ্যালকাইনের সাধারণ সংকেত।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫০</span>অনুমোদিত কক্ষপথ গুলোতে ইলেকট্রনের স্থায়িত্বকাল প্রায় -</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> <span class=\"m\" data-t=\"10^{-10}\"></span> s</div><div class=\"op\"><b>খ.</b> <span class=\"m\" data-t=\"10^{-12}\"></span> s</div><div class=\"op ok\"><b>গ.</b> <span class=\"m\" data-t=\"10^{-8}\"></span> s<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> <span class=\"m\" data-t=\"10^{-5}\"></span> s</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাজারী ও নাগ স্যারের রসায়ন প্রথম পত্র বইয়ের গুণগত রসায়ন অধ্যায় অনুসারে, পরমাণুর ইলেকট্রন শক্তি শোষণ করে যখন উচ্চতর অনুমোদিত কক্ষপথে বা উত্তেজিত অবস্থায় (excited state) গমন করে, তখন সেখানে তার স্থায়িত্বকাল অত্যন্ত কম হয়, যা প্রায় 10⁻⁸ s (সেকেন্ড)।</div><div class=\"ln\">এই ক্ষণস্থায়ী সময়ের পর ইলেকট্রনটি পুনরায় নিম্ন শক্তিস্তরে ফিরে আসে এবং শোষিত শক্তি বিকিরণ করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫১</span>অভিকর্ষজ ত্বরণের মাত্রা সমীকরণ কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> <span class=\"m\" data-t=\"LT^{-3}\"></span></div><div class=\"op\"><b>খ.</b> <span class=\"m\" data-t=\"LT^{-1}\"></span></div><div class=\"op ok\"><b>গ.</b> <span class=\"m\" data-t=\"LT^{-2}\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> <span class=\"m\" data-t=\"LT^{2}\"></span></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> অভিকর্ষজ ত্বরণ (g) হলো অভিকর্ষ বলের প্রভাবে মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ বৃদ্ধির হার।</div><div class=\"ln\">যেহেতু এটি এক প্রকার ত্বরণ, তাই এর মাত্রা সমীকরণ সাধারণ ত্বরণের মাত্রা সমীকরণের অনুরূপ হবে।</div><div class=\"ln\">ত্বরণ = বেগ / সময় = (দূরত্ব / সময়) / সময় = <span class=\"m\" data-t=\"[L]/[T]^2 = [LT^{-2}]\"></span>।</div><div class=\"ln\">অতএব, অভিকর্ষজ ত্বরণের মাত্রা সমীকরণ হলো <span class=\"m\" data-t=\"LT^{-2}\"></span>।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫২</span>&#39;রামসার সাইট&#39; হিসেবে ঘোষিত জীববৈচিত্র সংরক্ষণ এলাকা -</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> সীতাফুন্ড ইকোপার্ক</div><div class=\"op ok\"><b>খ.</b> টাঙ্গুয়ার হাওর<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> হালদা নদী</div><div class=\"op\"><b>ঘ.</b> হিমছড়ি জাতীয় উদ্যান</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ইরানের রামসারে ১৯৭১ সালে জলাভূমি সংরক্ষণের জন্য একটি আন্তর্জাতিক চুক্তি স্বাক্ষরিত হয়, যা &#39;রামসার কনভেনশন&#39; নামে পরিচিত।</div><div class=\"ln\">এই চুক্তি অনুযায়ী আন্তর্জাতিক গুরুত্বসম্পন্ন জলাভূমিকে &#39;রামসার সাইট&#39; ঘোষণা করা হয়।</div><div class=\"ln\">বাংলাদেশে দুটি রামসার সাইট রয়েছে: ১. সুন্দরবন (১৯৯২ সালে ঘোষিত) এবং ২. টাঙ্গুয়ার হাওর (২০০০ সালে ঘোষিত)।</div><div class=\"ln\">সুতরাং, সঠিক উত্তর টাঙ্গুয়ার হাওর।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৩</span>স্প্রিং ধ্রুবক নির্ভর করে না কোনটির উপর?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> স্প্রিং এর দৈর্ঘ্যের উপর</div><div class=\"op\"><b>খ.</b> জ্যামিতিক গঠনের উপর</div><div class=\"op smo\"><b>গ.</b> পদার্থের স্থিতিস্থাপকতার ওপর</div><div class=\"op ok\"><b>ঘ.</b> স্প্রিং এর আয়তনের উপর<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> স্প্রিং ধ্রুবক (k) স্প্রিংটির উপাদানের স্থিতিস্থাপকতা (দৃঢ়তার গুণাঙ্ক), স্প্রিংয়ের জ্যামিতিক গঠন (তারের ব্যাসার্ধ ও কুন্ডলীর ব্যাসার্ধ) এবং স্প্রিংয়ের কার্যকর দৈর্ঘ্যের (কুন্ডলীর সংখ্যা) ওপর নির্ভর করে।</div><div class=\"ln\">স্প্রিং ধ্রুবক স্প্রিংয়ের দৈর্ঘ্যের ব্যস্তানুপাতিক।</div><div class=\"ln\">তবে এটি স্প্রিংয়ের সামগ্রিক আয়তনের ওপর নির্ভর করে না।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৪</span>Milk of lime কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> CaO</div><div class=\"op ok\"><b>খ.</b> <span class=\"m\" data-t=\"Ca(OH)_2\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> <span class=\"m\" data-t=\"CaCO_3\"></span></div><div class=\"op\"><b>ঘ.</b> <span class=\"m\" data-t=\"Mg(OH)_2\"></span></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ক্যালসিয়াম হাইড্রোক্সাইড [<span class=\"m\" data-t=\"Ca(OH)_2\"></span>] এর জলীয় সাসপেনশন বা ঘন পেস্টকে &#39;মিল্ক অব লাইম&#39; (Milk of lime) বলা হয়।</div><div class=\"ln\">এটি সাধারণত ঘরবাড়ি হোয়াইট ওয়াশ করার কাজে ব্যবহৃত হয়।</div><div class=\"ln\">উল্লেখ্য, <span class=\"m\" data-t=\"Ca(OH)_2\"></span> এর পরিষ্কার জলীয় দ্রবণকে চুনের পানি (Lime water) এবং CaO কে পোড়া চুন (Quick lime) বলা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৫</span>ম্যালেরিয়া পরজীবীর অযৌন চক্রের সর্বশেষ ধাপের নাম কী?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> স্পোরোজয়েট</div><div class=\"op\"><b>খ.</b> ক্রিপ্টোমেরোজয়েট</div><div class=\"op ok\"><b>গ.</b> গ্যামিটোসাইট<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> সাইজন্ট</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ম্যালেরিয়া পরজীবীর (Plasmodium) মানবদেহে সংঘটিত অযৌন প্রজনন চক্রকে শিজোগোনি (Schizogony) বলে।</div><div class=\"ln\">লোহিত রক্তকণিকায় সংঘটিত এরিথ্রোসাইটিক শিজোগোনির শেষ পর্যায়ে মেরোজয়েটগুলো আকারে বৃদ্ধি পেয়ে গ্যামিটোসাইট (Gametocyte)-এ পরিণত হয়।</div><div class=\"ln\">এটিই মানবদেহে ম্যালেরিয়া পরজীবীর অযৌন চক্রের সর্বশেষ ধাপ, যা পরবর্তীতে মশকির দেহে প্রবেশ করে যৌন চক্র (Gametogony) শুরু করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৬</span>কোন প্রক্রিয়ায় সামগ্রিক রক্তকণিকা সৃষ্টি হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Haemopoesis</div><div class=\"op ok\"><b>খ.</b> Hematopoesis<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> Erythropoiesis</div><div class=\"op\"><b>ঘ.</b> Hemolysis</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মানবদেহে সামগ্রিক রক্তকণিকা (লোহিত রক্তকণিকা, শ্বেত রক্তকণিকা এবং অণুচক্রিকা) সৃষ্টির প্রক্রিয়াকে হিমাটোপয়েসিস (Hematopoiesis/Hematopoesis) বলা হয়।</div><div class=\"ln\">ভ্রূণীয় অবস্থায় যকৃৎ, প্লীহা এবং পরিণত বয়সে লাল অস্থিমজ্জা থেকে এই প্রক্রিয়ায় রক্তকণিকা উৎপন্ন হয়।</div><div class=\"ln\">অন্যদিকে, লোহিত রক্তকণিকা তৈরির সুনির্দিষ্ট প্রক্রিয়াকে এরিথ্রোপয়েসিস (Erythropoiesis) এবং রক্তকণিকা ভেঙে যাওয়ার প্রক্রিয়াকে হিমোলাইসিস (Hemolysis) বলে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৭</span>Anaerobic respiration-এ পাইরুভিক এসিড অসম্পূর্ণভাবে জারিত হয়ে উৎপন্ন করে -</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Lactic acid ও <span class=\"m\" data-t=\"CO_2\"></span></div><div class=\"op\"><b>খ.</b> Malic acid ও <span class=\"m\" data-t=\"CO_2\"></span></div><div class=\"op ok\"><b>গ.</b> Ethanol ও <span class=\"m\" data-t=\"CO_2\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Acetic acid ও <span class=\"m\" data-t=\"CO_2\"></span></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> অবাধ শ্বসনে (Anaerobic respiration) গ্লুকোজ আংশিক জারিত হয়ে প্রথমে পাইরুভিক এসিড তৈরি করে।</div><div class=\"ln\">অক্সিজেনের অনুপস্থিতিতে এই পাইরুভিক এসিড অসম্পূর্ণভাবে জারিত হয়ে ইথাইল অ্যালকোহল বা ইথানল (Ethanol) এবং কার্বন ডাই-অক্সাইড <span class=\"nw\">(<span class=\"m\" data-t=\"CO_2\"></span>)</span> উৎপন্ন করে (যেমন- ইস্টে)।</div><div class=\"ln\">কিছু ব্যাকটেরিয়া ও পেশিকোষে পাইরুভিক এসিড থেকে ল্যাকটিক এসিড উৎপন্ন হয়, তবে সেক্ষেত্রে কোনো <span class=\"m\" data-t=\"CO_2\"></span> উৎপন্ন হয় না।</div><div class=\"ln\">তাই সঠিক উত্তর (গ)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৮</span>Asymmetrical flower এর উদাহরণ হলো-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> শিম</div><div class=\"op\"><b>খ.</b> অপরাজিতা</div><div class=\"op ok\"><b>গ.</b> কলাবতী<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> মটরশুঁটি</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> যে ফুলকে কোনো তল বরাবরই দুটি সমান অংশে ভাগ করা যায় না, তাকে অপ্রতিসম ফুল (Asymmetrical flower) বলে।</div><div class=\"ln\">যেমন- কলাবতী (Canna indica)।</div><div class=\"ln\">অন্যদিকে শিম, অপরাজিতা ও মটরশুঁটি হলো একপ্রতিসম (Zygomorphic) ফুল, যাদের কেবল একটি নির্দিষ্ট অক্ষ বরাবর সমান দুই ভাগে ভাগ করা যায়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৫৯</span>Tripple chamber pacemaker কোন প্রকোষ্ঠে সরাসরি বিদ্যুৎ সরবরাহ করেনা?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ডান অলিন্দ</div><div class=\"op ok\"><b>খ.</b> বাম অলিন্দ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ডান নিলয়</div><div class=\"op\"><b>ঘ.</b> বাম নিলয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ট্রিপল-চেম্বার পেসমেকার (Triple-chamber pacemaker বা Biventricular pacemaker)-এর তিনটি লিড বা তার থাকে।</div><div class=\"ln\">এই লিডগুলো হৃদপিণ্ডের তিনটি প্রকোষ্ঠে সরাসরি যুক্ত থাকে: ১. ডান অলিন্দ (Right Atrium), ২. ডান নিলয় (Right Ventricle) এবং ৩. বাম নিলয় (Left Ventricle)।</div><div class=\"ln\">এটি বাম অলিন্দে (Left Atrium) সরাসরি কোনো বিদ্যুৎ সরবরাহ করে না।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬০</span>কোনটি ফ্যাসিকুলার টিস্যুতন্ত্র (fascicular tissue system) নামে পরিচিত?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> গ্রাউন্ড টিস্যুতন্ত্র</div><div class=\"op\"><b>খ.</b> এপিডার্মাল টিস্যুতন্ত্র</div><div class=\"op ok\"><b>গ.</b> ভাস্কুলার টিস্যুতন্ত্র<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> আদি টিস্যুতন্ত্র</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বিজ্ঞানী স্যাক্স (Sachs)-এর মতে উদ্ভিদের টিস্যুতন্ত্র ৩ প্রকার।</div><div class=\"ln\">এর মধ্যে জাইলেম ও ফ্লোয়েম নামক পরিবহন কলা নিয়ে গঠিত টিস্যুতন্ত্রকে ভাস্কুলার টিস্যুতন্ত্র (Vascular tissue system) বা পরিবহন টিস্যুতন্ত্র বলে।</div><div class=\"ln\">ভাস্কুলার বান্ডল বা ফ্যাসিকল গঠন করে বলে একে ফ্যাসিকুলার টিস্যুতন্ত্র (Fascicular tissue system)-ও বলা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬১</span>নিচের কোনটি তড়িৎ অবিশ্লেষ্য?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> বিশুদ্ধ <span class=\"m\" data-t=\"H_2O\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> HF দ্রবণ</div><div class=\"op\"><b>গ.</b> NaOH দ্রবণ</div><div class=\"op\"><b>ঘ.</b> KOH দ্রবণ</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বিশুদ্ধ পানি (Pure water) অত্যন্ত মৃদু তড়িৎ বিশ্লেষ্য বা কার্যত তড়িৎ অবিশ্লেষ্য (Non-electrolyte) হিসেবে গণ্য করা হয়, কারণ এতে মুক্ত আয়নের সংখ্যা অত্যন্ত নগণ্য (স্বতঃ-আয়নীকরণ ধ্রুবক, <span class=\"m\" data-t=\"K_w = 10^{-14}\"></span>)।</div><div class=\"ln\">অন্যদিকে, HF দ্রবণ একটি মৃদু তড়িৎ বিশ্লেষ্য এবং NaOH ও KOH দ্রবণ তীব্র তড়িৎ বিশ্লেষ্য।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬২</span>কোন বর্ণের গতি বেগ সর্বাপেক্ষা কম?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> লাল</div><div class=\"op\"><b>খ.</b> সবুজ</div><div class=\"op\"><b>গ.</b> নীল</div><div class=\"op ok\"><b>ঘ.</b> বেগুনি<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> শূন্য মাধ্যমে সকল বর্ণের আলোর বেগ সমান হলেও কোনো জড় মাধ্যমে (যেমন- কাচ বা পানি) আলোর বেগ মাধ্যমের প্রতিসরণাঙ্কের ওপর নির্ভর করে।</div><div class=\"ln\">বেগুনি আলোর তরঙ্গদৈর্ঘ্য সবচেয়ে কম হওয়ায় ওই মাধ্যমে এর প্রতিসরণাঙ্ক <span class=\"nw\">(<span class=\"m\" data-t=\"n\"></span>)</span> সবচেয়ে বেশি হয়।</div><div class=\"ln\">ফলে <span class=\"m\" data-t=\"v = c/n\"></span> সূত্রানুযায়ী বেগুনি বর্ণের আলোর গতিবেগ জড় মাধ্যমে সবচেয়ে কম হয়।</div><div class=\"ln\">লাল আলোর তরঙ্গদৈর্ঘ্য বেশি হওয়ায় এর বেগ সবচেয়ে বেশি।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৩</span>The antonym for &#39;Delicious&#39; is?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Scrumptious</div><div class=\"op ok\"><b>খ.</b> Displeasing<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> Dainty</div><div class=\"op\"><b>ঘ.</b> Toothsome</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The word &#39;Delicious&#39; means highly pleasing to the senses, especially taste (সুস্বাদু/মনোরম). Its antonym is &#39;Displeasing&#39;, which means causing displeasure or annoyance (অপ্রীতিকর/অসন্তোষজনক). The other options: &#39;Scrumptious&#39; (extremely tasty), &#39;Dainty&#39; (delicate/delicious), and &#39;Toothsome&#39; (temptingly tasty) are synonyms of &#39;Delicious&#39;.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৪</span>বাংলাদেশের প্রথম পারমাণবিক বিদ্যুৎ কেন্দ্র জাতীয় গ্রিডে কি পরিমাণ বিদ্যুৎ সরবরাহ করবে?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> ২.৪ গিগাওয়াট<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ৪.২ গিগাওয়াট</div><div class=\"op\"><b>গ.</b> ৩.২ গিগাওয়াট</div><div class=\"op\"><b>ঘ.</b> ৪.৪ গিগাওয়াট</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বাংলাদেশের প্রথম পারমাণবিক বিদ্যুৎ কেন্দ্রটি পাবনার রূপপুরে অবস্থিত।</div><div class=\"ln\">এই বিদ্যুৎ কেন্দ্রের মোট উৎপাদন ক্ষমতা ২,৪০০ মেগাওয়াট (MW) বা ২.৪ গিগাওয়াট (GW)।</div><div class=\"ln\">এখানে ১,২০০ মেগাওয়াট ক্ষমতাসম্পন্ন দুটি ইউনিট রয়েছে, যা সম্পূর্ণ চালু হলে জাতীয় গ্রিডে মোট ২.৪ গিগাওয়াট বিদ্যুৎ সরবরাহ করবে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৫</span>যান্ত্রিক ত্রুটির প্রকারভেদ নয় কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> শূন্য ত্রুটি</div><div class=\"op\"><b>খ.</b> লেভেল ত্রুটি</div><div class=\"op\"><b>গ.</b> পিচট ত্রুটি</div><div class=\"op ok\"><b>ঘ.</b> লঘুন ত্রুটি<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পদার্থবিজ্ঞান ১ম পত্রের পরিমাপ অধ্যায় অনুযায়ী, পরিমাপক যন্ত্রের যান্ত্রিক ত্রুটি (Mechanical error) প্রধানত তিন প্রকার।</div><div class=\"ln\">এগুলো হলো: (১) শূন্য ত্রুটি (Zero error), (২) পিছট ত্রুটি (Backlash error) এবং (৩) লেভেল ত্রুটি (Level error)।</div><div class=\"ln\">&#39;লঘুন ত্রুটি&#39; নামে কোনো যান্ত্রিক ত্রুটি নেই।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৬</span>নিচের কোনটি নিরপেক্ষ অক্সাইড নয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> <span class=\"m\" data-t=\"H_2O\"></span></div><div class=\"op ok\"><b>খ.</b> <span class=\"m\" data-t=\"NO_2\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> <span class=\"m\" data-t=\"N_2O\"></span></div><div class=\"op\"><b>ঘ.</b> NO</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> নিরপেক্ষ অক্সাইডসমূহ অম্ল বা ক্ষার কোনোটির সাথেই বিক্রিয়া করে না এবং লিটমাস কাগজের বর্ণ পরিবর্তন করে না।</div><div class=\"ln\">যেমন: <span class=\"m\" data-t=\"H_2O\"></span>, <span class=\"m\" data-t=\"CO\"></span>, <span class=\"m\" data-t=\"N_2O\"></span>, <span class=\"m\" data-t=\"NO\"></span> ইত্যাদি নিরপেক্ষ অক্সাইড।</div><div class=\"ln\">অন্যদিকে, <span class=\"m\" data-t=\"NO_2\"></span> (নাইট্রোজেন ডাইঅক্সাইড) একটি অম্লীয় অক্সাইড, কারণ এটি পানির সাথে বিক্রিয়া করে এসিড (<span class=\"m\" data-t=\"HNO_2\"></span> ও <span class=\"m\" data-t=\"HNO_3\"></span>) তৈরি করে।</div><div class=\"ln\">সুতরাং, <span class=\"m\" data-t=\"NO_2\"></span> নিরপেক্ষ অক্সাইড নয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৭</span>নিচের কোন তথ্যটি সঠিক নয়-</div><div class=\"opts\"><div class=\"op smo ok\"><b>ক.</b> ভাসা ডিফারেন্সিয়ার দৈর্ঘ্য ৪-৬ সেন্টিমিটার<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>খ.</b> এপিডিডাইমিস ৪-৬ মিটার লম্বা গঠন</div><div class=\"op smo\"><b>গ.</b> ক্ষেপন নালি প্রায় ১৯ মিলিমিটার লম্বা</div><div class=\"op smo\"><b>ঘ.</b> ভাস ডিফারেন্স প্রায় ৪০-৫০ সেন্টিমিটার লম্বা</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল স্যারের জীববিজ্ঞান ২য় পত্র (মানব শারীরতত্ত্ব: প্রজনন) বই অনুযায়ী:</div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">এপিডিডাইমিস অত্যন্ত কুন্ডলীকৃত এবং এটি প্রায় ৪-৬ মিটার লম্বা গঠন।</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">ক্ষেপন নালি (Ejaculatory duct) প্রায় ১৯-২০ মিলিমিটার (বা ২ সেমি) লম্বা।</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">ভাস ডিফারেন্স (Vas deferens) প্রায় ৪০-৫০ সেন্টিমিটার (বা ৪৫ সেমি) লম্বা।</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">ভাসা ইফারেনসিয়া (Vasa efferentia) হলো অত্যন্ত ক্ষুদ্র নালিকা (দৈর্ঘ্য প্রায় ২-৪ সেমি)।</div><div class=\"ln\">এছাড়া &#39;ভাসা ডিফারেন্সিয়া&#39; নামে কোনো অংশ নেই।</div><div class=\"ln\">সুতরাং (ক) তথ্যটি সঠিক নয়।</div></div></div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৮</span>মানবদেহের করোটিকার বা মাথার খুলির (Cranium) জোড় অস্থি কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ফ্রন্টাল</div><div class=\"op ok\"><b>খ.</b> প্যারাইটাল<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> স্ফেনয়েড</div><div class=\"op\"><b>ঘ.</b> এথময়েড</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মানবদেহের করোটিকা (Cranium) মোট ৮টি অস্থি নিয়ে গঠিত।</div><div class=\"ln\">এর মধ্যে জোড় অস্থি (Paired bones) হলো ২টি:</div><div class=\"ln\">১. প্যারাইটাল (Parietal) - ২টি</div><div class=\"ln\">২. টেমপোরাল (Temporal) - ২টি</div><div class=\"ln\">এবং বেজোড় অস্থি (Unpaired bones) হলো ৪টি:</div><div class=\"ln\">১. ফ্রন্টাল (Frontal) - ১টি</div><div class=\"ln\">২. অক্সিপিটাল (Occipital) - ১টি</div><div class=\"ln\">৩. স্ফেনয়েড (Sphenoid) - ১টি</div><div class=\"ln\">৪. এথময়েড (Ethmoid) - ১টি</div><div class=\"ln\">সুতরাং, করোটিকার জোড় অস্থি হলো প্যারাইটাল।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৬৯</span>&#39;Let the book be read by you.&#39; Change into active form-</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> Read the book<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> You are to read the book</div><div class=\"op\"><b>গ.</b> Let read the book by you</div><div class=\"op smo\"><b>ঘ.</b> Let the book be reading by you</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> Imperative sentence-এর active voice-কে passive করার নিয়ম হলো: Let + object + be + past participle of verb <span class=\"nw\">(<span class=\"m\" data-t=\"V_3\"></span>)</span>.</div><div class=\"ln\">এখানে passive voice-টি হলো: &#39;Let the book be read by you.&#39;</div><div class=\"ln\">এর active রূপ হবে: &#39;Read the book.&#39; (এখানে &#39;by you&#39; অংশটি উহ্য থাকে, কারণ Imperative sentence-এ subject &#39;you&#39; সাধারণত উহ্য থাকে)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭০</span>ব্লু গ্যাসের [ওয়াটার গ্যাস] সংকেত নিচের কোনটি?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> <span class=\"m\" data-t=\"CO + H_2\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> <span class=\"m\" data-t=\"CO + 3H_2\"></span></div><div class=\"op\"><b>গ.</b> <span class=\"m\" data-t=\"2CO + N_2\"></span></div><div class=\"op\"><b>ঘ.</b> <span class=\"m\" data-t=\"CO + 2N_2\"></span></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> লোহিত তপ্ত কোক কয়লার (C) ওপর দিয়ে ১০০০°C - ১৪০০°C তাপমাত্রায় স্টিম বা জলীয় বাষ্প <span class=\"nw\">(<span class=\"m\" data-t=\"H_2O\"></span>)</span> চালনা করলে কার্বন মনোক্সাইড <span class=\"nw\">(<span class=\"m\" data-t=\"CO\"></span>)</span> এবং হাইড্রোজেন <span class=\"nw\">(<span class=\"m\" data-t=\"H_2\"></span>)</span> গ্যাসের সমআয়তন মিশ্রণ উৎপন্ন হয়।</div><div class=\"ln\">এই মিশ্রণকে ওয়াটার গ্যাস বা ব্লু গ্যাস (Water gas / Blue gas) বলা হয়।</div><div class=\"ln\">বিক্রিয়া:</div><div class=\"dm m\" data-d=\"1\" data-t=\"C(s) + H_2O(g) \\rightarrow CO(g) + H_2(g)\"></div><div class=\"ln\">সুতরাং, ব্লু গ্যাসের সংকেত হলো <span class=\"m\" data-t=\"CO + H_2\"></span>।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭১</span>He walks fast. &#39;Fast&#39; implies-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Verb</div><div class=\"op ok\"><b>খ.</b> Adverb<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> Conjunction</div><div class=\"op\"><b>ঘ.</b> Adjective</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> In the sentence &quot;He walks fast&quot;, the word &#39;fast&#39; modifies the verb &#39;walks&#39; by describing how he walks (the manner of walking). Any word that modifies a verb, adjective, or another adverb is classified as an Adverb. Therefore, &#39;fast&#39; is an adverb in this context.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭২</span>রক্তের শ্বেত কণিকা বৃদ্ধিতে নিচের কোন রশ্মি সাহায্য করে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> VR</div><div class=\"op\"><b>খ.</b> IR</div><div class=\"op ok\"><b>গ.</b> UV<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Gamma ray</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> অতিবেগুনী রশ্মি বা UV (Ultraviolet) রশ্মি মানবদেহে শ্বেত রক্তকণিকা (WBC) বৃদ্ধিতে সাহায্য করে এবং শরীরের রোগ প্রতিরোধ ক্ষমতা বাড়ায়।</div><div class=\"ln\">এছাড়া এটি ত্বকে ভিটামিন-ডি (Vitamin D) তৈরিতে সাহায্য করে।</div><div class=\"ln\">অন্যদিকে, IR (অবলোহিত রশ্মি) রক্ত সঞ্চালন বৃদ্ধি ও ফিজিওথেরাপি চিকিৎসায় ব্যবহৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৩</span>বেতার তরঙ্গ পর্যবেক্ষণের জন্য ব্যবহৃত হয়-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> অপটিক্যাল টেলিস্কোপ</div><div class=\"op ok\"><b>খ.</b> রেডিও টেলিস্কোপ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> হাবল স্পেস টেলিস্কোপ</div><div class=\"op\"><b>ঘ.</b> গ্যালিলীয় টেলিস্কোপ</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> মহাকাশ থেকে আসা বেতার তরঙ্গ (Radio waves) সনাক্ত এবং পর্যবেক্ষণ করার জন্য &#39;রেডিও টেলিস্কোপ&#39; (Radio Telescope) ব্যবহৃত হয়।</div><div class=\"ln\">অন্যদিকে, অপটিক্যাল টেলিস্কোপ (যেমন- গ্যালিলীয় টেলিস্কোপ) এবং হাবল স্পেস টেলিস্কোপ মূলত দৃশ্যমান আলো ও এর কাছাকাছি তরঙ্গদৈর্ঘ্যের তড়িৎচৌম্বক বিকিরণ পর্যবেক্ষণে ব্যবহৃত হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৪</span>ফেনল থেকে বেনজিন তৈরিতে কোনটি প্রভাবক হিসেবে কাজ করে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Ni</div><div class=\"op ok\"><b>খ.</b> Zn<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> Na</div><div class=\"op\"><b>ঘ.</b> Pt</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ফেনলকে জিংক (Zn) গুঁড়াসহ উত্তপ্ত ও পাতন করলে ফেনল বিজারিত হয়ে বেনজিনে পরিণত হয় এবং জিংক অক্সাইড (ZnO) উপজাত হিসেবে উৎপন্ন হয়।</div><div class=\"ln\">বিক্রিয়াটি নিম্নরূপ:</div><div class=\"ln\">C₆H₅OH + Zn → C₆H₆ + ZnO</div><div class=\"ln\">এখানে জিংক (Zn) বিজারক হিসেবে কাজ করে ফেনল থেকে অক্সিজেন অপসারণ করে বেনজিন তৈরি করে।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৫</span>Select the correct tense in the following sentence &quot;I will have studied every tense by the time I finish the course&quot;?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Simple past tense</div><div class=\"op smo\"><b>খ.</b> Past perfect continuous tense</div><div class=\"op ok\"><b>গ.</b> Future perfect tense<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Present perfect tense</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The structure &quot;Subject + shall/will + have + past participle of verb (V3)&quot; is the standard structure of the Future Perfect Tense. In the sentence &quot;I will have studied every tense...&quot;, the action of studying is expected to be completed before another future event (&quot;by the time I finish the course&quot;), which perfectly defines the Future Perfect Tense.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৬</span>নিচের কোন রাসায়নিকটির ব্যবহার সঠিক?</div><div class=\"opts\"><div class=\"op smo\"><b>ক.</b> কার্বন টেট্রাক্লোরাইড - কীটনাশক</div><div class=\"op smo\"><b>খ.</b> ডিডিটি পাউডার - অগ্নিনির্বাপক</div><div class=\"op\"><b>গ.</b> গ্যামাক্সিন - চেত্যানানাশক</div><div class=\"op smo ok\"><b>ঘ.</b> ১,১,২-ট্রাইক্লোরোইথেন - ড্রাই ওয়াশ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাজারী ও নাগ স্যারের রসায়ন দ্বিতীয় পত্র বইয়ের অ্যালকাইল হ্যালাইড অংশ অনুযায়ী:</div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">১,১,২-ট্রাইক্লোরোইথেন (1,1,2-Trichloroethane) ড্রাই ওয়াশ বা ড্রাই ক্লিনিং-এ দ্রাবক হিসেবে ব্যবহৃত হয়।</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">কার্বন টেট্রাক্লোরাইড <span class=\"nw\">(<span class=\"m\" data-t=\"CCl_4\"></span>)</span> প্রধানত অগ্নিনির্বাপক (পাইরিন নামে) এবং দ্রাবক হিসেবে ব্যবহৃত হয়।</div></div></div><div class=\"bl\"><span class=\"mk\"></span><div class=\"bc\"><div class=\"ln\">ডিডিটি (DDT) এবং গ্যামাক্সিন (Gammaxene) অত্যন্ত শক্তিশালী কীটনাশক হিসেবে ব্যবহৃত হয়, চেতন্যানাশক হিসেবে নয়।</div></div></div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৭</span>কোন ধরণের লিম্ফোসাইট কণিকা বাচাইবাছাহীন ভাবে ভাইরাস ধ্বংস করার জন্য সর্বদা প্রস্তুত থাকে?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> B-lymphocytes</div><div class=\"op\"><b>খ.</b> Cytotoxic T cell</div><div class=\"op\"><b>গ.</b> T-lymphocytes</div><div class=\"op ok\"><b>ঘ.</b> Natural Killer cell<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল স্যারের জীববিজ্ঞান ২য় পত্র (মানব প্রতিরক্ষা অধ্যায়) অনুযায়ী, ন্যাচারাল কিলার সেল (Natural Killer cell বা NK cell) হলো এক বিশেষ ধরনের লিম্ফোসাইট যা কোনো পূর্ব অভিজ্ঞতা বা বাছাইবাছাই ছাড়াই (non-specifically) দেহে প্রবেশকারী ভাইরাস আক্রান্ত কোষ বা টিউমার কোষকে ধ্বংস করতে সর্বদা প্রস্তুত থাকে।</div><div class=\"ln\">এটি সহজাত প্রতিরক্ষার (Innate immunity) একটি গুরুত্বপূর্ণ অংশ।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৮</span>কোনো তরঙ্গের উপরিস্থিত সমদশাসম্পন্ন কণাগুলো যে তলে অবস্থান করে তাকে বলে-</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> তরঙ্গবেগ</div><div class=\"op\"><b>খ.</b> তরঙ্গসংখ্যা</div><div class=\"op ok\"><b>গ.</b> তরঙ্গমুখ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> কোনটিই নয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পদার্থবিজ্ঞান ২য় পত্রের &#39;ভৌত আলোকবিজ্ঞান&#39; অধ্যায় অনুযায়ী, কোনো তরঙ্গের উপরিস্থিত সমদশাসম্পন্ন কণাগুলোর গতিপথ বা যে কাল্পনিক তলে কণাগুলো অবস্থান করে, তাকে তরঙ্গমুখ (Wavefront) বলে।</div><div class=\"ln\">যেমন- আলোক উৎস থেকে নির্গত তরঙ্গের সমদশাসম্পন্ন বিন্দুগুলোর সঞ্চারপথ।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৭৯</span>রক্তকণিকায় কোনটির উপস্থিতি দেখে মানবদেহে ম্যালেরিয়া রোগ শনাক্ত করা হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> পাইরোজেন</div><div class=\"op\"><b>খ.</b> হিমোজয়েন</div><div class=\"op ok\"><b>গ.</b> সাফনার্স দানা<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> সিগনেট রিং</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল স্যারের জীববিজ্ঞান ২য় পত্রের ম্যালেরিয়া পরজীবী (Plasmodium) অধ্যায় অনুযায়ী, ম্যালেরিয়া আক্রান্ত লোহিত রক্তকণিকার সাইটোপ্লাজমে ক্ষুদ্র ক্ষুদ্র ও লালচে বর্ণের কিছু দানা দেখা যায়, যাদের &#39;সাফনার্স দানা&#39; (Schuffner&#39;s dots) বলা হয়।</div><div class=\"ln\">রক্ত পরীক্ষায় লোহিত রক্তকণিকায় এই সাফনার্স দানার উপস্থিতি দেখেই নিশ্চিতভাবে ম্যালেরিয়া রোগ শনাক্ত করা হয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮০</span>মুক্তিযুদ্ধের মোট সাব সেক্টর কতটি ছিল?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ১১টি</div><div class=\"op\"><b>খ.</b> ৫৪টি</div><div class=\"op\"><b>গ.</b> ৪টি</div><div class=\"op ok\"><b>ঘ.</b> ৬৪টি<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ১৯৭১ সালের মহান মুক্তিযুদ্ধ পরিচালনার সুবিধার্থে সমগ্র বাংলাদেশকে ১১টি সেক্টরে বিভক্ত করা হয়েছিল।</div><div class=\"ln\">এই ১১টি সেক্টরের অধীনে যুদ্ধক্ষেত্রকে আরও সুসংগঠিত করার জন্য মোট ৬৪টি সাব-সেক্টর (Sub-sectors) গঠন করা হয়েছিল।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮১</span>বঙ্গবন্ধু শেখ মুজিবুর রহমান ঐতিহাসিক ৬ দফা ঘোষণা করেন কোথায়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> দিল্লি</div><div class=\"op\"><b>খ.</b> ঢাকা</div><div class=\"op ok\"><b>গ.</b> লাহোর<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> সিলেট</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> বঙ্গবন্ধু শেখ মুজিবুর রহমান ১৯৬৬ সালের ৫-৬ ফেব্রুয়ারি পাকিস্তানের লাহোরে অনুষ্ঠিত বিরোধী দলসমূহের এক জাতীয় সম্মেলনে ঐতিহাসিক ৬ দফা দাবি উত্থাপন করেন।</div><div class=\"ln\">এটি ছিল বাঙালি জাতির মুক্তির সনদ বা &#39;ম্যাগনা কার্টা&#39;।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮২</span>বিষুবরেখার বিনতি কোণ কত?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> 0°<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> 1°</div><div class=\"op\"><b>গ.</b> 90°</div><div class=\"op\"><b>ঘ.</b> ½°</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> ভূ-চৌম্বকীয় বিষুবরেখায় (Equator) বিনতি কোণ (Angle of dip) হলো ০° (0°)।</div><div class=\"ln\">কারণ বিষুবরেখায় পৃথিবীর চৌম্বক বলরেখাগুলো অনুভূমিকের সাথে সমান্তরালে থাকে।</div><div class=\"ln\">অন্যদিকে, মেরু অঞ্চলে (Poles) বিনতি কোণ হয় ৯০° (90°)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৩</span>কোন প্রক্রিয়ায় স্টোমাটা অংশগ্রহণ করে না?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> শ্বসন</div><div class=\"op\"><b>খ.</b> সালোকসংশ্লেষণ</div><div class=\"op\"><b>গ.</b> প্রস্বেদন</div><div class=\"op ok\"><b>ঘ.</b> গাটেশন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> স্টোমাটা বা পত্ররন্ধ্র উদ্ভিদের গ্যাসীয় বিনিময় (সালোকসংশ্লেষণ ও শ্বসন) এবং বাষ্পাকারে পানি নির্গমন (প্রস্বেদন) প্রক্রিয়ায় সরাসরি অংশগ্রহণ করে।</div><div class=\"ln\">কিন্তু গাটেশন (Guttation) প্রক্রিয়ায় তরল পানি নির্গত হয় পাতার কিনারায় অবস্থিত বিশেষ এক ধরণের রন্ধ্র বা &#39;হাইডাথোড&#39; (Hydathode) বা পানি পত্ররন্ধ্রের মাধ্যমে, সাধারণ স্টোমাটার মাধ্যমে নয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৪</span>E. coli অণুজীবে ক্রোমোসোম সংখ্যা কত?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> ৩২০০০</div><div class=\"op ok\"><b>খ.</b> ১<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> ১৬</div><div class=\"op\"><b>ঘ.</b> ২৫০০০</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> E. coli (Escherichia coli) একটি ব্যাকটেরিয়া বা আদিকোষী জীব।</div><div class=\"ln\">আদিকোষী জীবে কোনো সুগঠিত নিউক্লিয়াস থাকে না এবং এদের সাইটোপ্লাজমে কেবল একটি বৃত্তাকার ডিএনএ অণু থাকে, যা এদের একমাত্র ক্রোমোসোম (Chromosome) হিসেবে কাজ করে।</div><div class=\"ln\">সুতরাং, E. coli-তে ক্রোমোসোম সংখ্যা ১টি।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৫</span>She has no zest ___ music.</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> to</div><div class=\"op\"><b>খ.</b> on</div><div class=\"op\"><b>গ.</b> in</div><div class=\"op ok\"><b>ঘ.</b> for<svg class=\"ck\" viewBox=\"0 0 20 20\"><path ><div class=\"op smo\"><b>খ.</b> রক্ত ও লসিকা নালিতে মুক্ত হয়</div><div class=\"op smo ok\"><b>গ.</b> পোস্টসিন্যাপটিক প্রান্তে সঞ্চিত থাকে<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>ঘ.</b> পোস্ট সিনাপটিক প্রান্তে গৃহীত হয়</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> নিউরোহরমোন বা নিউরোট্রান্সমিটারগুলো সংশ্লিষ্ট নিউরনের কোষদেহে সংশ্লেষিত হয়ে অ্যাক্সনের শেষ প্রান্তে অবস্থিত প্রিসিন্যাপটিক (presynaptic) ভেসিকলে সঞ্চিত থাকে, পোস্টসিন্যাপটিক প্রান্তে নয়।</div><div class=\"ln\">উদ্দীপনা আসার পর এগুলো সিন্যাপটিক ফাঁকে মুক্ত হয় এবং পোস্টসিন্যাপটিক পর্দার গ্রাহক (receptor) দ্বারা গৃহীত হয়।</div><div class=\"ln\">সুতরাং, &#39;পোস্টসিন্যাপটিক প্রান্তে সঞ্চিত থাকে&#39; তথ্যটি ভুল এবং এটি নিউরোহরমোনের বৈশিষ্ট্য নয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৮</span>The journey was pleasant. Here &#39;pleasant&#39; is</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Adverb</div><div class=\"op\"><b>খ.</b> Verb</div><div class=\"op\"><b>গ.</b> Noun</div><div class=\"op ok\"><b>ঘ.</b> Adjective<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> In the sentence &#39;The journey was pleasant&#39;, the word &#39;pleasant&#39; describes the quality of the noun &#39;journey&#39;. Here, &#39;was&#39; is a linking verb, and &#39;pleasant&#39; acts as a predicative adjective (subject complement) modifying the subject &#39;journey&#39;. Therefore, &#39;pleasant&#39; is an Adjective.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৮৯</span>বীরশ্রেষ্ঠ মোস্তফা কামালকে কোথায় সমাধিস্থ করা
