0.01 \\text{ J} = 0.01 \\text{ J}\"></div><div class=\"ln\">(জুল)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯১</span>যকৃতের মৃত কোষ ভক্ষণকারী ম্যাক্রোফেজ কোনটি?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> মাইক্রোগ্লিয়া</div><div class=\"op ok\"><b>খ.</b> কাফফার কোষ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>গ.</b> নিউট্রোফিল</div><div class=\"op\"><b>ঘ.</b> ম্যাস্তোগ্লিয়া</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> যকৃতে অবস্থিত বিশেষ ধরনের রূপান্তরিত ম্যাক্রোফেজকে কাফফার কোষ (Kupffer cell) বলা হয়।</div><div class=\"ln\">এরা ফ্যাগোসাইটোসিস প্রক্রিয়ায় রক্তে থাকা ক্ষতিকর ব্যাকটেরিয়া, পরজীবী এবং যকৃতের মৃত কোষ ভক্ষণ করে ধ্বংস করে।</div><div class=\"ln\">অন্যদিকে, মস্তিষ্কের ম্যাক্রোফেজ হলো মাইক্রোগ্লিয়া (Microglia)।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯২</span>Choose the correct sentence:</div><div class=\"opts\"><div class=\"op smo\"><b>ক.</b> He has used to working hard.</div><div class=\"op\"><b>খ.</b> He used to working hard</div><div class=\"op smo ok\"><b>গ.</b> He is used to working hard.<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> He is used to work hard</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The grammatical structure &#39;be used to + verb-ing&#39; (gerund) is used to express familiarity or being accustomed to a habit. Here, &#39;is used to working&#39; correctly follows this rule. On the other hand, &#39;used to + base form of verb&#39; (without a &#39;be&#39; verb) is used to describe past habits (e.g., &#39;He used to work hard&#39;). Therefore, option (গ) is the only grammatically correct sentence.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৩</span>বঙ্গবন্ধুর ৭ই মার্চের ভাষণের উপর ভিত্তি করে নির্মিত চলচ্চিত্রের নাম কি?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> দ্য স্পিচ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> ভয়েস অব লিবার্টি</div><div class=\"op\"><b>গ.</b> স্টপ জেনোসাইড</div><div class=\"op\"><b>ঘ.</b> ওরা ১১ জন</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> জাতির পিতা বঙ্গবন্ধু শেখ মুজিবুর রহমানের ঐতিহাসিক ৭ই মার্চের ভাষণের ওপর ভিত্তি করে নির্মিত চলচ্চিত্রের নাম &#39;দ্য স্পিচ&#39; (The Speech), যা পরিচালনা করেছেন ফাখরুল আরেফীন খান।</div><div class=\"ln\">অন্যদিকে, &#39;স্টপ জেনোসাইড&#39; হলো জহির রায়হান নির্মিত একটি বিখ্যাত প্রামাণ্যচিত্র এবং &#39;ওরা ১১ জন&#39; হলো চাষী নজরুল ইসলাম পরিচালিত স্বাধীন বাংলাদেশের প্রথম পূর্ণদৈর্ঘ্য চলচ্চিত্র।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৪</span>কত ডিগ্রি তাপমাত্রায় পানিতে CO2 এর দ্রাব্যতা শূন্য হয়?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> 300°C<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> 450°C</div><div class=\"op\"><b>গ.</b> 600°C</div><div class=\"op\"><b>ঘ.</b> 700°C</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> সাধারণত তরলে গ্যাসের দ্রাব্যতা তাপমাত্রা বৃদ্ধির সাথে হ্রাস পায়।</div><div class=\"ln\">পানির স্ফুটনাঙ্ক অর্থাৎ ১০০°C তাপমাত্রায় পানিতে CO2 বা যেকোনো গ্যাসের দ্রাব্যতা শূন্য (zero) হয়ে যায়, কারণ এই তাপমাত্রায় সমস্ত দ্রবীভূত গ্যাস বুদবুদ আকারে বের হয়ে যায়।</div><div class=\"ln\">মেডিকেল ভর্তি পরীক্ষার প্রশ্নব্যাংক ও স্ট্যান্ডার্ড পাঠ্যবই অনুসারে ১০০°C-ই সঠিক উত্তর, তবে অপশনে ১০০°C না থাকায় এবং টাইপিং ত্রুটির কারণে ৩০০°C দেওয়া থাকতে পারে।</div><div class=\"ln\">বৈজ্ঞানিক ও তাত্ত্বিক দৃষ্টিকোণ থেকে সঠিক উত্তর ১০০°C।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৫</span>শিখা পরীক্ষার ক্ষেত্রে, ব্যবহৃত লবণে কোন আয়নবিশিষ্ট লবণ উপস্থিত থাকলে আয়ন শনাক্তকরণে কোবাল্ট গ্লাস ব্যবহার অধিক সুবিধাজনক হয়?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> <span class=\"m\" data-t=\"Cu^{2+}\"></span></div><div class=\"op\"><b>খ.</b> <span class=\"m\" data-t=\"Na^+\"></span></div><div class=\"op ok\"><b>গ.</b> <span class=\"m\" data-t=\"K^+\"></span><svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> <span class=\"m\" data-t=\"Ca^{2+}\"></span></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> শিখা পরীক্ষায় পটাশিয়াম আয়ন <span class=\"nw\">(<span class=\"m\" data-t=\"K^+\"></span>)</span> শনাক্তকরণে নীল কোবাল্ট গ্লাস ব্যবহার করা হয়।</div><div class=\"ln\">পটাশিয়ামের শিখার বর্ণ হালকা বেগুনি (Lilac), যা সোডিয়ামের তীব্র সোনালী হলুদ শিখার উপস্থিতির কারণে খালি চোখে সহজে দেখা যায় না।</div><div class=\"ln\">নীল কোবাল্ট গ্লাস সোডিয়ামের হলুদ আলো শোষণ করে নেয় এবং পটাশিয়ামের শিখাকে কোবাল্ট কাচের মধ্য দিয়ে গোলাপি বা লালচে-বেগুনি দেখায়।</div><div class=\"ln\">ফলে <span class=\"m\" data-t=\"K^+\"></span> আয়ন সহজে শনাক্ত করা যায়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৬</span>Which spelling is correct?</div><div class=\"opts\"><div class=\"op ok\"><b>ক.</b> Surveillance<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>খ.</b> Survellence</div><div class=\"op\"><b>গ.</b> Surveilance</div><div class=\"op\"><b>ঘ.</b> Sarveillance</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The correct spelling is &#39;Surveillance&#39; (S-U-R-V-E-I-L-L-A-N-C-E), which means close observation, especially of a suspected spy or criminal. Other options contain incorrect letter combinations (such as &#39;ll&#39; missing or misplaced &#39;e&#39; and &#39;i&#39;).</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৭</span>I remind him __ his promise.</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> to</div><div class=\"op\"><b>খ.</b> from</div><div class=\"op\"><b>গ.</b> with</div><div class=\"op ok\"><b>ঘ.</b> of<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> The appropriate preposition after the verb &#39;remind&#39; is &#39;of&#39; when it means to cause someone to remember something. The standard grammatical structure is: remind + someone + of + something. Therefore, &#39;I remind him of his promise&#39; is the correct sentence.</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৮</span>মৃৎক্ষার ধাতুগুলোর মধ্যে একমাত্র কার অক্সাইড উভয়ধর্মী?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> Ca</div><div class=\"op\"><b>খ.</b> Mg</div><div class=\"op ok\"><b>গ.</b> Be<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> Sr</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> হাজারী ও নাগ স্যারের রসায়ন ১ম পত্র বই অনুসারে, গ্রুপ-২ এর মৃৎক্ষার ধাতুগুলোর মধ্যে বেরিলিয়াম (Be) এর আকার অত্যন্ত ক্ষুদ্র এবং এর চার্জ ঘনত্ব বেশি হওয়ায় এর অক্সাইড (BeO) সমযোজী প্রকৃতির এবং উভয়ধর্মী (amphoteric) হয়।</div><div class=\"ln\">BeO অম্ল ও ক্ষার উভয়ের সাথেই বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে।</div><div class=\"ln\">অন্যদিকে, Ca, Mg এবং Sr এর অক্সাইডসমূহ সম্পূর্ণ ক্ষারকীয়।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">৯৯</span>অভিকর্ষজ ত্বরণ সম্পর্কে কোনটি মিথ্যা?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> এটি বস্তু নিরপেক্ষ</div><div class=\"op ok\"><b>খ.</b> এটি স্থান নিরপেক্ষ<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op smo\"><b>গ.</b> একে g দ্বারা প্রকাশ করা হয়</div><div class=\"op\"><b>ঘ.</b> এটি স্থান নিরপেক্ষ না</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> পদার্থবিজ্ঞান ১ম পত্র (ড. শাহজাহান তপন / ইসহাক স্যার) অনুসারে, অভিকর্ষজ ত্বরণ g-এর মান ভূপৃষ্ঠের বিভিন্ন স্থানে বিভিন্ন হয় (যেমন- মেরু অঞ্চলে সর্বোচ্চ এবং বিষুবীয় অঞ্চলে সর্বনিম্ন)।</div><div class=\"ln\">অর্থাৎ, g-এর মান স্থান নিরপেক্ষ নয়, বরং স্থান পরিবর্তনশীল।</div><div class=\"ln\">সুতরাং, &#39;এটি স্থান নিরপেক্ষ&#39; উক্তিটি মিথ্যা।</div><div class=\"ln\">অন্য উক্তিগুলো (বস্তু নিরপেক্ষ, g দ্বারা প্রকাশ করা এবং স্থান নিরপেক্ষ না) সত্য।</div></div></div>","<div class=\"card\"><div class=\"qb\"><span class=\"bd\">১০০</span>ট্রাকিয়া কোন ধরণের তরুণাস্থি নির্মিত?</div><div class=\"opts\"><div class=\"op\"><b>ক.</b> থাইরয়েড</div><div class=\"op\"><b>খ.</b> ট্রাইনয়েড</div><div class=\"op ok\"><b>গ.</b> হায়ালিন<svg class=\"ck\" viewBox=\"0 0 20 20\"><path d=\"M3.5 10.5l4.2 4.2L16.5 5.5\" fill=\"none\" stroke=\"#2e9e57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><div class=\"op\"><b>ঘ.</b> অ্যারিনয়েড</div></div><div class=\"ex\"><div class=\"ln\"><span class=\"lab\">ব্যাখ্যা:</span> গাজী আজমল স্যারের জীববিজ্ঞান ২য় পত্র (প্রাণীবিজ্ঞান) বইয়ের শ্বসন ও শ্বাসক্রিয়া অধ্যায় অনুসারে, মানুষের শ্বাসনালী বা ট্রাকিয়া (Trachea) ১৬-২০টি &#39;C&#39; আকৃতির হায়ালিন (Hyaline) বা স্বচ্ছ তরুণাস্থি (Cartilage) দ্বারা গঠিত।</div><div class=\"ln\">এই তরুণাস্থিগুলো ট্রাকিয়াকে চুপসে যাওয়া থেকে রক্ষা করে এবং বায়ু চলাচলের পথ উন্মুক্ত রাখে।</div></div></div>"];
const SETTINGS = {"title":"মেডিকেল ভর্তি মডেল টেস্ট ০১","subtitle":"রসায়ন, পদার্থ, জীববিজ্ঞান, ইংরেজি ও সাধারণ জ্ঞান • MCQ সমাধান শীট","hasHeader":true,"pageOffset":0,"playStoreUrl":"https://play.google.com/store/apps/details?id=com.obhyash.app","websiteUrl":"https://www.obhyash.com"};
const BN = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

function renderMath(root) {
  root.querySelectorAll('.m').forEach(el => {
    try {
      katex.render(el.dataset.t, el, {
        displayMode: !!el.dataset.d,
        throwOnError: false,
        strict: 'ignore',
        output: 'html'
      });
    } catch(e) {
      el.textContent = el.dataset.t;
    }
  });
}

const M = document.getElementById('measure');
CARDS.forEach(h => {
  const d = document.createElement('div');
  d.innerHTML = h;
  M.appendChild(d.firstChild);
});

renderMath(M);

window.READY = false;

// Dynamic Programming Pagination
const GAP = 14;
const U_FULL = 1123 - 40 - 72; // = 1011

function paginate(h, hdr) {
  const n = h.length;
  const INF = [1e9, 0, 0];
  const pre = [0];
  for (const x of h) pre.push(pre[pre.length - 1] + x);
  const hh = (i, j) => (j > i ? pre[j] - pre[i] + GAP * (j - i - 1) : 0);

  const best = Array.from({ length: n + 1 }, () => [...INF]);
  best[0] = [0, 0, 0];
  const bp = Array(n + 1).fill(null);

  for (let i = 0; i < n; i++) {
    if (best[i][0] === 1e9) continue;
    const p = best[i][0];
    const U = U_FULL - (p === 0 && hdr ? 156 : 44);
    let a = 1;
    while (i + a <= n && hh(i, i + a) <= U) {
      let b = 0;
      while (i + a + b <= n && (b === 0 || hh(i + a, i + a + b) <= U)) {
        const j = i + a + b;
        const cand = [
          p + 1,
          best[i][1] + p * (a + b),
          best[i][2] + Math.abs(hh(i, i + a) - hh(i + a, j))
        ];
        if (
          cand[0] < best[j][0] ||
          (cand[0] === best[j][0] && cand[1] < best[j][1]) ||
          (cand[0] === best[j][0] && cand[1] === best[j][1] && cand[2] < best[j][2])
        ) {
          best[j] = cand;
          bp[j] = [i, a, b];
        }
        b++;
      }
      a++;
    }
  }

  const plan = [];
  let j = n;
  while (j > 0) {
    const entry = bp[j];
    if (!entry) break;
    const [i, a, b] = entry;
    plan.push([
      Array.from({ length: a }, (_, idx) => i + idx),
      Array.from({ length: b }, (_, idx) => i + a + idx)
    ]);
    j = i;
  }
  return plan.reverse();
}

window.build = function(plan, off, hdr) {
  const root = document.getElementById('root');
  root.innerHTML = '';
  
  plan.forEach((pl, k) => {
    const p = document.createElement('div');
    p.className = 'page';
    let top = 40;
    
    if (hdr && k === 0) {
      top = 196;
      p.innerHTML = `<div class="hdr">
        <div class="t">${SETTINGS.title}</div>
        <div class="s">${SETTINGS.subtitle}</div>
        <div class="bar"></div>
      </div>`;
    } else {
      top = 80;
      p.innerHTML = `<div class="rh">
        <a href="${SETTINGS.playStoreUrl}">
          <svg viewBox="0 0 24 24"><path d="M3.6 1.6c-.3.3-.5.8-.5 1.4v18c0 .6.2 1.1.5 1.4l.1.1L13.8 12.4v-.2L3.7 1.5z" fill="#00a0ff"/><path d="M17.2 15.8l-3.4-3.4v-.2l3.4-3.4.1.1 4 2.3c1.1.6 1.1 1.7 0 2.3l-4 2.2z" fill="#ffc400"/><path d="M17.3 15.7L13.8 12.3 3.6 22.4c.4.4 1 .4 1.7.1z" fill="#f43249"/><path d="M17.3 8.9L5.3 2.1c-.7-.4-1.3-.3-1.7.1l10.2 10.1z" fill="#00e676"/></svg>
          অ্যাপ ইনস্টল করো
        </a>
        <div class="nm">${SETTINGS.title}</div>
      </div>`;
    }

    [[pl[0], 40], [pl[1], 410]].forEach(([ids, x]) => {
      const c = document.createElement('div');
      c.className = 'col';
      c.style.left = x + 'px';
      c.style.top = top + 'px';
      ids.forEach(i => c.appendChild(M.children[i].cloneNode(true)));
      p.appendChild(c);
    });

    const f = document.createElement('div');
    f.className = 'foot';
    f.innerHTML = `<a href="${SETTINGS.websiteUrl}">আনলিমিটেড এক্সাম দাও <span class="site">${SETTINGS.websiteUrl.replace(/^https?:\/\//, '')}</span> এ</a><div class="pg">পৃষ্ঠা<i>${BN(off + k + 1)}</i></div>`;
    p.appendChild(f);
    root.appendChild(p);
  });
};

window.overflow = function() {
  const bad = [];
  document.querySelectorAll('#root .card').forEach(c => {
    const r = c.getBoundingClientRect();
    const q = c.querySelector('.bd') ? c.querySelector('.bd').textContent : '';
    c.querySelectorAll('.katex').forEach(k => {
      const kr = k.getBoundingClientRect();
      if (kr.right > r.right - 6) {
        bad.push([q, Math.round(kr.right - r.right)]);
      }
    });
  });
  return bad;
};

// Initialize after font ready
document.fonts.ready.then(() => {
  setTimeout(() => {
    window.heights = [...M.children].map(c => c.getBoundingClientRect().height);
    const plan = paginate(window.heights, SETTINGS.hasHeader);
    window.build(plan, SETTINGS.pageOffset, SETTINGS.hasHeader);
    window.READY = true;
    
    // Post message to parent iframe if embedded
    if (window.parent && window.parent !== window) {
      const tot = window.heights.reduce((a, b) => a + b, 0);
      const cap = plan.reduce((acc, _, k) => {
        const hAvail = (U_FULL - (k === 0 && SETTINGS.hasHeader ? 156 : 44)) * 2;
        return acc + hAvail;
      }, 0);
      const fillPct = Math.round((100 * tot) / (cap || 1) * 10) / 10;
      const over = window.overflow();

      window.parent.postMessage({
        type: 'OBHYASH_PDF_READY',
        totalPages: plan.length,
        totalCards: window.heights.length,
        fillPercentage: fillPct,
        overflows: over
      }, '*');
    }
  }, 400);
});
</script>
